# V-OTA RecSys — data collection config (spec sections 5.5, 6.1, 6.2, 7, 8, 11)
#
# This file is the authority for: rate limits, concurrency, the canonical
# destination list + aliases, taxonomy mapping, URL classification, attribute
# derivation, FX rates, dedup thresholds and field precedence, and quality
# scoring. Spec section 6.2 requires the taxonomy map to live here and not in a
# parser; the same reasoning is applied to every other site-shape guess, so
# fixing a wrong guess is a YAML edit plus `normalize --force`, not a code change.
#
# Env vars override these values (see config.py) EXCEPT rate_limit_rps and
# concurrency, where env may only LOWER them - spec section 8 makes this file
# the authority for the politeness ceiling.

config_version: 1

# =============================================================================
# quote_context (spec section 5.5)
# =============================================================================
quote_contexts:
  # MANDATORY. `discover` refuses to run (exit 3) while this is null.
  #
  # Why it cannot default to "today": check-in would be today+30, so a discover
  # on Monday and another on Wednesday produce different quote_ctx values,
  # every crawl_target is re-inserted as pending, and the whole crawl repeats at
  # 0.5 rps. It also voids the entire point of section 5.5 - one fixed parameter
  # set so prices from different sources are comparable.
  #
  # Pin it once, commit it, leave it alone for the week.
  anchor_date: 2026-09-15

  # Week 1 only needs `base`. near/far are for the later "cập nhật trạng thái
  # phòng và ưu đãi theo thời gian" work.
  contexts:
    base: { checkin_offset_days: 30, nights: 1, adults: 2, rooms: 1 }
    near: { checkin_offset_days: 7,  nights: 1, adults: 2, rooms: 1 }
    far:  { checkin_offset_days: 90, nights: 1, adults: 2, rooms: 1 }

  enabled: [base]

# =============================================================================
# HTTP + politeness (spec sections 8, 11)
# =============================================================================
http:
  # Overridden by USER_AGENT in .env. Must not contain "Mozilla" -
  # tests/test_invariants.py asserts it, because a browser UA on a crawler is
  # anti-bot evasion and spec section 1 forbids that.
  user_agent: "VOTA-RecSys-Internship/0.1 (+mailto:you@example.com)"
  connect_timeout_s: 10.0
  read_timeout_s: 30.0
  total_timeout_s: 60.0
  follow_redirects: true
  max_redirects: 5
  max_bytes_per_page: 8_000_000     # skip anything larger; status='skipped'
  max_retries: 3                    # spec section 8: "tối đa 3 lần"
  backoff_base_s: 2.0               # 2s, 4s, 8s
  backoff_jitter_s: 0.5
  retry_statuses: [408, 429, 500, 502, 503, 504]
  # 403/451 are NEVER retried: they are the block signal, and retrying them is
  # indistinguishable from probing anti-bot.
  terminal_statuses: [400, 401, 403, 404, 410, 451]
  honour_retry_after: true
  max_retry_after_s: 120

ratelimit:
  # ONE ceiling, no per-source exemption and no API exemption. Spec section 8 is
  # unconditional: "mặc định <= 0.5 rps/domain, concurrency <= 2". Amadeus's
  # ~400 calls finish in 13 minutes at 0.5 rps, so a higher rate buys nothing.
  max_rps_cap: 0.5
  max_concurrency_cap: 2
  default_rps: 0.5
  # Hosts that share one token bucket (same infrastructure behind them).
  domain_aliases:
    "www.vinpearl.com": "vinpearl.com"
    "vinwonders.com": "vinpearl.com"
    "www.vinwonders.com": "vinpearl.com"

robots:
  # If robots.txt itself cannot be fetched we do NOT assume allow.
  on_unavailable: abort           # abort | allow   (abort => exit 5)
  cache_ttl_s: 3600
  respect_crawl_delay: true      # a longer Crawl-delay wins over our own rate

block_detector:
  # Detecting a block and STOPPING is a spec requirement (sections 1, 9, 13).
  # On trip: write a source_state latch row, abort the source, exit 4, print the
  # fallback command. Never retry, never rotate, never solve.
  consecutive_403_429: 3
  body_markers:
    - "px-captcha"
    - "Access to this page has been denied"
    - "Please verify you are a human"
    - "cf-browser-verification"
    - "Checking if the site connection is secure"
    - "__cf_chl_"
    - "captcha-delivery.com"
    # Observed on booking.com 2026-09-15: it answers a search URL with HTTP 202
    # and a noscript-only page. Markers give a named reason; the empty-shell
    # rule below is the backstop for when the wording changes.
    - "not a robot"
    - "JavaScript is disabled"
    - "Enable JavaScript and then reload"
  # A 2xx carrying almost no readable text is the quiet form of a block, and the
  # one that actually happens. Matching on wording alone missed booking.com
  # entirely, because 202 is a success code.
  empty_shell_max_text_chars: 200

# =============================================================================
# Sources (spec sections 1, 9)
# =============================================================================
# source_priority drives dedup field precedence (spec section 7): higher wins.
sources:

  vinpearl:
    enabled: true
    parser_version: "vinpearl-1.0.0"
    source_priority: 100          # spec section 7: wins name/description/images
    rate_limit_rps: 0.5
    concurrency: 2
    respect_robots: true
    base_url: "https://vinpearl.com"
    hosts: ["vinpearl.com", "www.vinpearl.com", "vinwonders.com", "www.vinwonders.com"]
    sitemaps:
      - "https://vinpearl.com/sitemap.xml"
      - "https://vinpearl.com/sitemap_index.xml"
      - "https://vinpearl.com/vi/sitemap.xml"
    # If every sitemap 404s, fall back to a bounded nav/listing crawl.
    link_harvest:
      enabled: true
      seeds:
        - "https://vinpearl.com/vi/khach-san-resort"
        - "https://vinpearl.com/vi/ve-vinwonders"
        - "https://vinpearl.com/vi/golf"
        - "https://vinpearl.com/vi/combo"
      max_depth: 2
      max_pages: 300
    description_policy: keep       # Vietnamese source text - the whole point
    # URL classification. EVERY pattern here is a guess about the real site;
    # `discover --dry-run --dump-unmatched` prints URLs that matched nothing so
    # this list can be corrected without touching code. First match wins.
    # FIRST MATCH WINS, so listing pages are declared before detail pages:
    # otherwise "/vi/ve-vinwonders" (the index) matches the attraction detail
    # rule and becomes a target that yields no product.
    url_patterns:
      # --- listings (recognised so they are skipped, not crawled as products) ---
      - { pattern: "/(vi/)?(khach-san-resort|khach-san|resort|ve-vinwonders|ve|golf|combo)/?$", page_type: list, taxonomy: null }
      # --- room pages, before the hotel rule that would otherwise swallow them ---
      - { pattern: "/(vi/)?(khach-san|resort|khach-san-resort)/[^/]+/(phong|room|loai-phong)/[^/]+/?$", page_type: room, taxonomy: hotel }
      # --- details ---
      - { pattern: "/(vi/)?(khach-san|resort|khach-san-resort)/[^/]+/?$", page_type: detail, taxonomy: hotel }
      # Note the [-/] separator: the real paths use a hyphenated segment
      # ("/vi/ve-vinwonders/...") as well as a plain one ("/vi/ve/..."), and a
      # pattern anchored on "/" alone silently matches neither.
      - { pattern: "/(vi/)?(ve|tickets?|mua-ve|vinwonders)[-/][^/]+", page_type: detail, taxonomy: attraction }
      - { pattern: "/(vi/)?golf[-/][^/]+/?$", page_type: detail, taxonomy: golf }
      - { pattern: "/(vi/)?(combo|goi|package)[-/][^/]+", page_type: detail, taxonomy: combo }
    url_exclude:
      - "/blog"
      - "/tin-tuc"
      - "/cam-nang"
      - "/tuyen-dung"
      - "/lien-he"
      - "/chinh-sach"
      - "/dieu-khoan"
      - "/sitemap"
      - "\\.(jpg|jpeg|png|gif|webp|pdf|css|js|svg|ico)$"

  booking:
    # Expected to be blocked (robots + anti-bot). That outcome is CORRECT
    # behaviour, not a bug: the collector latches `blocked` and the pipeline
    # moves to the fallback. Do not try to get past it (spec sections 1, 13).
    enabled: true
    parser_version: "booking-1.0.0"
    source_priority: 60           # spec section 7: wins structured attributes
    rate_limit_rps: 0.5
    concurrency: 1
    respect_robots: true
    base_url: "https://www.booking.com"
    hosts: ["www.booking.com", "booking.com"]
    description_policy: keep
    listing_url_template: "https://www.booking.com/searchresults.vi.html?ss={destination}&checkin={checkin}&checkout={checkout}&group_adults={adults}&no_rooms={rooms}&group_children=0"
    max_pages_per_destination: 2
    extract_preference: [jsonld, next_data, dom]

  agoda:
    enabled: true
    parser_version: "agoda-1.0.0"
    source_priority: 50
    rate_limit_rps: 0.5
    concurrency: 1
    respect_robots: true
    base_url: "https://www.agoda.com"
    hosts: ["www.agoda.com", "agoda.com"]
    description_policy: keep
    listing_url_template: "https://www.agoda.com/vi-vn/search?city={city_id}&checkIn={checkin}&los={nights}&adults={adults}&rooms={rooms}"
    max_pages_per_destination: 2
    extract_preference: [jsonld, initial_state, dom]

  trip:
    # Primary goal here is FLIGHT (required for Week 3 cross-category), plus
    # attractions. Hotels are a bonus. Also expected to be blocked.
    enabled: true
    parser_version: "trip-1.0.0"
    source_priority: 40
    rate_limit_rps: 0.5
    concurrency: 1
    respect_robots: true
    base_url: "https://vn.trip.com"
    hosts: ["vn.trip.com"]
    description_policy: keep
    extract_preference: [next_data, jsonld, dom]

  amadeus:
    # The volume source. Probed FIRST on Monday (see README) because vinpearl
    # alone cannot reach the 2,000 product floor.
    enabled: true
    parser_version: "amadeus-1.0.0"
    source_priority: 30           # never beats vinpearl on name/description
    rate_limit_rps: 0.5           # no API exemption; see ratelimit.max_rps_cap
    concurrency: 1
    respect_robots: true
    base_url: "https://test.api.amadeus.com"
    hosts: ["test.api.amadeus.com"]   # must match base_url; asserted at init
    is_api: true
    # Amadeus property text is ENGLISH. Putting it in products.description would
    # contaminate the Vietnamese corpus that Week 2's model comparison depends
    # on, while making the "missing description" number look good. So it goes to
    # attributes.descriptionEn and products.description stays NULL.
    description_policy: en_to_attributes
    budgets:
      hotels_by_geocode_per_destination: 1
      hotel_offers_batches: 8
      hotel_sentiments_batches: 4
      activities_per_destination: 1
      flight_offers_per_route: 1
    probe:
      # ~20 requests. Run this before anything else on Monday; the row counts it
      # prints decide the rest of the week.
      destinations: [Nha Trang, Phú Quốc, Đà Nẵng, Hà Nội, TP. Hồ Chí Minh]
      radius_km: 20

  manual:
    # Hand-curated floor for golf and combo. Without it those two taxonomies
    # have exactly one unverified source (vinpearl), and a single wrong URL
    # guess turns the 5-value taxonomy CHECK into a 3-value reality, failing
    # DoD section 0.1 and showing two empty rows in the Friday demo.
    enabled: true
    parser_version: "manual-1.0.0"
    source_priority: 10           # lowest: vinpearl always wins on merge
    rate_limit_rps: 0.5           # unused (no network) but keeps config uniform
    concurrency: 1
    respect_robots: false         # local YAML files, nothing is fetched
    files:
      - "data/manual/golf.yaml"
      - "data/manual/combo.yaml"
    description_policy: keep

  osm:
    # Second fallback leg (spec section 9): Overpass for POI geo/tags/opening
    # hours, Vietnamese Wikipedia for real prose where a POI declares an
    # article. It is the only section 9 source needing no credentials.
    #
    # DISABLED PENDING A HUMAN DECISION — read this before flipping it.
    # `cli robots-check --source osm` reports:
    #     DISALLOW  https://overpass-api.de/api/interpreter
    #     DISALLOW  https://vi.wikivoyage.org/w/api.php
    # Overpass robots.txt is literally "Disallow: /api/", and MediaWiki
    # disallows "/w/". Both are aimed at search-engine indexers rather than at
    # API clients — these are documented APIs with their own usage policies, and
    # Wikimedia publishes an API etiquette page precisely for programmatic use.
    # So there is a good argument that robots.txt is not the governing document
    # here and the usage policy is.
    #
    # That argument is NOT ours to make silently. Spec section 1 says read
    # robots.txt and, if blocked, switch sources rather than proceed. So this
    # source stays off until someone decides deliberately and records it in
    # ../../docs/decisions/. To enable:
    #   1. Read https://operations.osmfoundation.org/policies/api/ and
    #      https://wiki.openstreetmap.org/wiki/Overpass_API#Introduction
    #      (and https://www.mediawiki.org/wiki/API:Etiquette for Wikipedia).
    #   2. Write the decision + who made it into docs/decisions/.
    #   3. Set enabled: true and robots_policy: api_terms below.
    # `robots_policy: api_terms` is the ONLY way to reach these endpoints; it
    # exists so the exception is explicit, per-source, and greppable, instead of
    # being a blanket respect_robots: false that would also excuse real crawling.
    enabled: false
    robots_policy: robots_txt      # robots_txt | api_terms
    usage_policy_url: "https://operations.osmfoundation.org/policies/api/"
    parser_version: "osm-1.0.0"
    source_priority: 20
    rate_limit_rps: 0.5
    concurrency: 1
    respect_robots: true
    overpass_url: "https://overpass-api.de/api/interpreter"
    wikivoyage_api: "https://vi.wikipedia.org/w/api.php"
    hosts: ["overpass-api.de", "vi.wikipedia.org"]
    description_policy: keep
    probe:
      radius_km: 25


# trivago RecSys 2019 (spec section 9) is DECLINED on purpose: it is click-log
# data with no Vietnamese product text, so it cannot serve the catalogue this
# dataset exists to provide. Recorded here and in README so the decision is
# written down rather than merely omitted.

# =============================================================================
# Destinations (spec section 6.1) — fixed canonical list, aliases declared here
# =============================================================================
destinations:
  # Aliases are matched on WORD BOUNDARIES over an NFC-casefolded, diacritic-
  # folded haystack. There is deliberately no minimum alias length: a length
  # floor of 4 would make `Huế`/`Hue` (3 chars) and every 3-letter IATA code
  # unmatchable, and Huế is one of the 15 canonical destinations.
  match_field_order: [destination_raw, address, breadcrumb, name, url]
  geo_fallback_km: 25            # last resort: nearest centroid within this radius
  # Tokens too ambiguous to match on their own.
  ambiguous_aliases: ["VN", "Việt Nam", "Viet Nam", "Vietnam", "Miền Bắc", "Miền Nam", "Miền Trung"]

  canonical:
    - name: "Nha Trang"
      iata: [CXR]
      centroid: { lat: 12.2388, lon: 109.1967 }
      aliases: ["Nha Trang", "Khánh Hoà", "Khánh Hòa", "Khanh Hoa", "Cam Ranh", "Bãi Dài", "Bai Dai", "Hòn Tre", "Hon Tre", "Vinpearl Nha Trang", "CXR"]
    - name: "Phú Quốc"
      iata: [PQC]
      centroid: { lat: 10.2270, lon: 103.9670 }
      aliases: ["Phú Quốc", "Phu Quoc", "Kiên Giang", "Kien Giang", "Bãi Dài Phú Quốc", "Grand World", "Gành Dầu", "Ganh Dau", "PQC"]
    - name: "Hạ Long"
      iata: [HPH, VDO]
      centroid: { lat: 20.9500, lon: 107.0800 }
      # HPH (Cát Bi, Hải Phòng) is mapped here because it is the practical
      # gateway airport for Hạ Long and spec section 9 lists HPH among the
      # flight destinations, while `Hải Phòng` is not one of the 15 canonical
      # names. Without this ~25% of the flight catalogue lands in 'unknown'.
      # Open question D1 in docs/decisions/cdp-schema-questions.md.
      aliases: ["Hạ Long", "Ha Long", "Halong", "Quảng Ninh", "Quang Ninh", "Bãi Cháy", "Bai Chay", "Hòn Gai", "Tuần Châu", "Vịnh Hạ Long", "Hải Phòng", "Hai Phong", "HPH", "VDO"]
    - name: "Đà Nẵng"
      iata: [DAD]
      centroid: { lat: 16.0544, lon: 108.2022 }
      aliases: ["Đà Nẵng", "Da Nang", "Danang", "Ngũ Hành Sơn", "Mỹ Khê", "My Khe", "Bà Nà", "Ba Na", "Non Nước", "DAD"]
    - name: "Hội An"
      centroid: { lat: 15.8801, lon: 108.3380 }
      aliases: ["Hội An", "Hoi An", "Quảng Nam", "Quang Nam", "Cửa Đại", "Cua Dai", "An Bàng", "Phố cổ Hội An"]
    - name: "Nam Hội An"
      centroid: { lat: 15.7300, lon: 108.3800 }
      # Deliberately separate from Hội An (spec section 6.1 lists both). Scope:
      # the Nam Hội An resort/VinWonders area only. Question D2.
      aliases: ["Nam Hội An", "Nam Hoi An", "Vinpearl Nam Hội An", "VinWonders Nam Hội An", "Bình Minh", "Thăng Bình", "Duy Xuyên"]
    - name: "Hà Nội"
      iata: [HAN]
      centroid: { lat: 21.0278, lon: 105.8342 }
      aliases: ["Hà Nội", "Ha Noi", "Hanoi", "Hoàn Kiếm", "Hoan Kiem", "Tây Hồ", "Cầu Giấy", "Long Biên", "Nội Bài", "HAN"]
    - name: "TP. Hồ Chí Minh"
      iata: [SGN]
      centroid: { lat: 10.7769, lon: 106.7009 }
      aliases: ["TP. Hồ Chí Minh", "TP Hồ Chí Minh", "Thành phố Hồ Chí Minh", "Hồ Chí Minh", "Ho Chi Minh", "Ho Chi Minh City", "HCMC", "Sài Gòn", "Sai Gon", "Saigon", "Quận 1", "Tân Sơn Nhất", "SGN"]
    - name: "Đà Lạt"
      iata: [DLI]
      centroid: { lat: 11.9404, lon: 108.4583 }
      aliases: ["Đà Lạt", "Da Lat", "Dalat", "Lâm Đồng", "Lam Dong", "Liên Khương", "Tuyền Lâm", "DLI"]
    - name: "Sa Pa"
      centroid: { lat: 22.3364, lon: 103.8438 }
      aliases: ["Sa Pa", "Sapa", "Lào Cai", "Lao Cai", "Fansipan", "Hoàng Liên", "Tả Van", "Cát Cát"]
    - name: "Huế"
      iata: [HUI]
      centroid: { lat: 16.4637, lon: 107.5909 }
      aliases: ["Huế", "Hue", "Thừa Thiên Huế", "Thua Thien Hue", "Thuận An", "Lăng Cô", "Lang Co", "Phú Bài", "HUI"]
    - name: "Quy Nhơn"
      iata: [UIH]
      centroid: { lat: 13.7765, lon: 109.2237 }
      aliases: ["Quy Nhơn", "Quy Nhon", "Bình Định", "Binh Dinh", "Phù Cát", "Ghềnh Ráng", "Kỳ Co", "UIH"]
    - name: "Vũng Tàu"
      centroid: { lat: 10.3460, lon: 107.0843 }
      aliases: ["Vũng Tàu", "Vung Tau", "Bà Rịa", "Ba Ria", "Bãi Sau", "Bai Sau", "Long Hải", "Hồ Tràm", "Ho Tram"]
    - name: "Cần Thơ"
      iata: [VCA]
      centroid: { lat: 10.0452, lon: 105.7469 }
      aliases: ["Cần Thơ", "Can Tho", "Ninh Kiều", "Ninh Kieu", "Cái Khế", "Trà Nóc", "VCA"]
    - name: "Tây Ninh"
      centroid: { lat: 11.3100, lon: 106.0989 }
      aliases: ["Tây Ninh", "Tay Ninh", "Núi Bà Đen", "Nui Ba Den", "Bà Đen", "Sun World Ba Den", "Trảng Bàng"]

# Flight route matrix (spec section 9: "các cặp HAN/SGN <-> CXR/PQC/DAD/HPH...")
flight_routes:
  origins: [HAN, SGN]
  destinations: [CXR, PQC, DAD, HPH, HUI, UIH, DLI, VCA]
  both_directions: true
  # A flight's `destination` column is the ARRIVAL city (question D3). The
  # origin goes to attributes.originIata. This also keeps the section 10
  # invariant "1 trip = 1 destination" true.
  destination_rule: arrival

# =============================================================================
# Taxonomy mapping (spec section 6.2 — must live in config, not in a parser)
# =============================================================================
# For site sources the authoritative declaration is sources.<s>.url_patterns[].taxonomy.
# The tables below map a source's own CATEGORY STRING, for sources that give one.
taxonomy_map:
  default: null                   # unmapped => staging row is rejected, never guessed
  by_category:
    vinpearl:
      "Khách sạn": hotel
      "Resort": hotel
      "Khách sạn & Resort": hotel
      "Vé VinWonders": attraction
      "Vé tham quan": attraction
      "Golf": golf
      "Combo": combo
      "Combo & Ưu đãi": combo
    booking:
      "Hotel": hotel
      "Resort": hotel
      "Apartment": hotel
      "Villa": hotel
      "Hostel": hotel
      "Guest house": hotel
    agoda:
      "Hotel": hotel
      "Resort": hotel
      "Serviced apartment": hotel
    trip:
      "Flight": flight
      "Hotel": hotel
      "Attraction": attraction
      "Things to do": attraction
    amadeus:
      "HOTEL": hotel
      "LODGING": hotel
      "ACTIVITY": attraction
      "FLIGHT_OFFER": flight
    osm:
      "attraction": attraction
      "theme_park": attraction
      "museum": attraction
      "viewpoint": attraction
      "golf_course": golf
    manual:
      "golf": golf
      "combo": combo

# =============================================================================
# Attribute derivation (spec section 5.2)
# =============================================================================
# normalise.py owns derive_attributes(payload, taxonomy, cfg). Collectors emit
# raw labels/text; nothing is derived in a parser.
derive:
  brand_star_default: null
  brand_map:
    "Vinpearl": Vinpearl
    "VinHolidays": Vinpearl
    "Vinpearl Resort": Vinpearl
    "Vinpearl Luxury": Vinpearl
    "Melia": Melia
    "InterContinental": InterContinental
    "Marriott": Marriott
    "Sheraton": Marriott
    "Accor": Accor
    "Novotel": Accor
    "Pullman": Accor
    "Radisson": Radisson
    "Best Western": BestWestern

  # Boolean hotel attributes required by spec section 5.2, derived from amenity
  # labels + description text. Matching is diacritic-insensitive, word-boundary.
  flag_keywords:
    familyFriendly: ["gia đình", "family", "trẻ em", "kids club", "sân chơi trẻ em", "family friendly"]
    privatePool: ["hồ bơi riêng", "bể bơi riêng", "private pool", "plunge pool", "pool villa"]
    beachfront: ["mặt biển", "sát biển", "ngay bãi biển", "beachfront", "beach front", "bãi biển riêng"]
    petFriendly: ["thú cưng", "vật nuôi", "pet friendly", "pet-friendly", "cho phép thú cưng"]
    hasSpa: ["spa", "xông hơi", "massage", "wellness", "chăm sóc sức khoẻ"]
    hasKidsClub: ["kids club", "câu lạc bộ trẻ em", "khu vui chơi trẻ em", "kid's club"]
    breakfastIncluded: ["bao gồm ăn sáng", "kèm ăn sáng", "breakfast included", "ăn sáng miễn phí", "buffet sáng"]
    freeCancellation: ["huỷ miễn phí", "hủy miễn phí", "free cancellation", "miễn phí huỷ phòng"]

  view_keywords:
    ocean: ["hướng biển", "view biển", "ocean view", "sea view", "nhìn ra biển"]
    pool: ["hướng hồ bơi", "pool view", "view bể bơi", "nhìn ra hồ bơi"]
    garden: ["hướng vườn", "garden view", "view vườn", "nhìn ra vườn"]
    city: ["hướng thành phố", "city view", "view thành phố", "nhìn ra thành phố"]

  # Attraction labels: where openingHours / duration / restrictions come from.
  # Spec section 5.2 note - Week 4 needs these for itinerary building, so they
  # are crawled from Week 1 and never backfilled later.
  attraction_labels:
    opening_hours: ["giờ mở cửa", "thời gian mở cửa", "giờ hoạt động", "opening hours"]
    duration: ["thời lượng", "thời gian tham quan", "duration", "thời gian trải nghiệm"]
    height_restriction: ["chiều cao", "giới hạn chiều cao", "cao từ", "height"]
    age_restriction: ["độ tuổi", "giới hạn tuổi", "tuổi từ", "trẻ em từ", "age"]
    included_services: ["bao gồm", "dịch vụ bao gồm", "vé bao gồm", "included"]
  # Fallback durations (minutes) when the page states none, by taxonomy.
  duration_defaults:
    attraction: 180
    golf: 270

  combo_nights_regex: "(\\d+)\\s*(đêm|dem|night|nights|ngày|ngay)"
  ticket_type_keywords:
    adult: ["người lớn", "nguoi lon", "adult"]
    child: ["trẻ em", "tre em", "child", "children"]
    senior: ["người cao tuổi", "cao tuổi", "senior"]

  indoor_outdoor_keywords:
    indoor: ["trong nhà", "indoor", "thuỷ cung", "aquarium", "khu trong nhà"]
    outdoor: ["ngoài trời", "outdoor", "công viên nước", "water park", "bãi biển"]

  attr_synonyms:
    amenities:
      "Hồ bơi": pool
      "Bể bơi": pool
      "Wifi miễn phí": wifi
      "Wi-Fi": wifi
      "Bãi đậu xe": parking
      "Chỗ đậu xe": parking
      "Phòng gym": gym
      "Trung tâm thể dục": gym
      "Nhà hàng": restaurant
      "Quầy bar": bar
      "Đưa đón sân bay": airport_shuttle
      "Điều hoà": air_conditioning
      "Máy lạnh": air_conditioning

# Rating scale normalisation (spec section 7 picks aggregateRating by highest
# reviewCount - without rescaling first, one column ends up holding 8.7, 4.4 and
# 87 as "the rating" with no unit).
ratings:
  target_scale: 5
  scale_by_source:
    booking: 10
    agoda: 10
    trip: 5
    amadeus: 100
    vinpearl: jsonld      # honour the page's own aggregateRating.bestRating
    osm: null
    manual: 5

# =============================================================================
# Normalisation (spec section 6.2)
# =============================================================================
normalise:
  normaliser_version: "1.0.0"
  price:
    # "3.400.000đ" -> 3400000 ; "từ 2.500.000 VND" -> 2500000 ; "3,4tr" -> 3400000
    currency_symbols: { "đ": VND, "₫": VND, "VND": VND, "$": USD, "USD": USD, "€": EUR, "EUR": EUR }
    million_suffixes: ["tr", "triệu", "trieu", "m"]
    thousand_suffixes: ["k", "nghìn", "nghin"]
    max_plausible_vnd: 500_000_000
    min_plausible_vnd: 10_000

  text:
    # NFC, collapse whitespace, strip tags. NEVER lowercase, NEVER strip
    # diacritics, NEVER truncate - spec section 6.2 and section 5.1.
    unicode_form: NFC
    strip_tags: true
    collapse_whitespace: true
    # Headings whose section must not end up in `description`: review content is
    # forbidden by spec section 5.4.
    description_heading_denylist:
      - "Đánh giá"
      - "Nhận xét"
      - "Nhận xét của khách"
      - "Bình luận"
      - "Reviews"
      - "Guest reviews"
      - "Customer reviews"
      - "Ý kiến khách hàng"

  images:
    # Spec section 6.2: drop resize query params, keep the largest version.
    drop_query_params: [w, h, width, height, resize, size, quality, q, fit, crop, dpr, auto, fm]
    min_bytes_hint: 0
    max_images_per_product: 20
    per_source:
      vinpearl: { drop_query_params: [w, h, quality, fm], prefer_path_tokens: ["original", "large", "1920"] }
      booking:  { drop_query_params: [k, o], bucket_path_rewrite: { from: "square(60|200|240|600)|max300|max500", to: "max1920x1080" } }
      agoda:    { drop_query_params: [s, ce, d], bucket_path_rewrite: { from: "/\\d+x\\d+/", to: "/1920x1080/" } }
      trip:     { drop_query_params: [proc] }
      amadeus:  { drop_query_params: [] }

  phone:
    # Required by spec section 5.3 as a dedup field.
    default_country_code: "84"
    strip_chars: [" ", "-", ".", "(", ")", "+"]

# Foreign exchange (spec section 6.2 + section 12 item 3: the rate and the date
# it was applied must appear in README). The values used by a run are recorded in
# crawl_runs.stats.fx so the README is generated, not hand-maintained.
fx_rates:
  as_of: "2026-09-15"
  source: "Vietcombank ty gia trung tam, ghi tay - khong goi API trong Week 1"
  base: VND
  rates:
    VND: 1
    USD: 26150
    EUR: 28400
    SGD: 19450
    THB: 745
    KRW: 19.1
    JPY: 176
    AUD: 17300
    GBP: 33100
    CNY: 3660

# =============================================================================
# Dedup + merge (spec section 7)
# =============================================================================
dedup:
  dedup_version: "1.0.0"
  block_by: destination
  distance_m_threshold: 150       # spec section 7
  name_similarity_threshold: 0.82 # spec section 7 (pg_trgm)
  trgm_candidate_threshold: 0.70  # grey zone floor; `%` operator uses this
  star_rating_max_delta: 1        # spec section 7
  grey_zone: { low: 0.70, high: 0.82 }
  review_csv: "data/reports/dedup_review.csv"
  # Do not merge a property-level row with a room-level row: different grain.
  allow_cross_grain_merge: false
  allow_cross_taxonomy_merge: false
  match_score_weights:
    name_similarity: 0.45
    distance: 0.25
    star_rating: 0.10
    brand: 0.08
    address: 0.07
    phone: 0.05

# Field precedence when a cluster has several sources (spec section 7 table).
# Declared here so README section 12 item 2 is generated from the same data the
# merge actually uses.
merge:
  content_order: [vinpearl, manual, booking, agoda, trip, osm, amadeus]
  ota_order: [booking, agoda, trip, amadeus]
  columns:
    name:           { strategy: source_order, order: content_order, default_required: true }
    description:    { strategy: source_order, order: content_order, prefer_vietnamese: true, tie_break: longest }
    taxonomy:       { strategy: source_order, order: content_order, default_required: true }
    destination:    { strategy: source_order, order: content_order, default: unknown }
    unit_price:     { strategy: source_order, order: ota_order, fallback_order: content_order }
    currency:       { strategy: constant, value: VND }
    available:      { strategy: source_order, order: ota_order, default: true }
    available_from: { strategy: source_order, order: ota_order, default: null }
    available_to:   { strategy: source_order, order: ota_order, default: null }
    image_url:      { strategy: first_of, field: images }
    images:         { strategy: source_order, order: content_order, default: [] }
    latitude:       { strategy: source_order, order: ota_order, fallback_order: content_order }
    longitude:      { strategy: source_order, order: ota_order, fallback_order: content_order }
    source_ref:     { strategy: primary_member }
  # Everything below is routed into products.attributes under its exact
  # spec section 5.2 camelCase key - these are NOT columns of products.
  attributes:
    starRating:       { strategy: source_order, order: [booking, agoda, vinpearl, trip, amadeus] }
    amenities:        { strategy: source_order, order: [booking, agoda, vinpearl, trip, amadeus] }
    address:          { strategy: source_order, order: ota_order, fallback_order: content_order }
    brand:            { strategy: source_order, order: content_order }
    aggregateRating:  { strategy: max_by, key: reviewCount, restrict_to: ota_order }
    reviewCount:      { strategy: max_by, key: reviewCount, restrict_to: ota_order }
    descriptionEn:    { strategy: source_order, order: [amadeus, booking, agoda, trip] }
    _default:         { strategy: source_order, order: content_order }

# =============================================================================
# quality_score (spec section 7)
# =============================================================================
quality:
  demo_threshold: 0.5            # THE only home for this number
  description_min_chars: 200
  vietnamese_min_diacritic_ratio: 0.02
  weights:
    description_len: 0.30
    real_vietnamese: 0.25
    has_image: 0.15
    has_price: 0.15
    valid_destination: 0.15
  # Components not applicable to a taxonomy are dropped from the DENOMINATOR,
  # not scored 1.0. Scoring them 1.0 hands a flight 0.55 before any real signal
  # is measured, so a flight with no price, no image and destination='unknown'
  # would clear the 0.5 demo gate - the opposite of what the gate is for.
  exempt_components:
    flight: [description_len, real_vietnamese, has_image]
    golf: [real_vietnamese]

# =============================================================================
# Definition of Done checks (spec section 0) — `report --strict` enforces these
# =============================================================================
dod:
  # WARN Monday-Thursday, FAIL only under --strict (Friday). A gate that is red
  # all week gets ignored by Thursday, which is exactly when it matters.
  products_min: 2000
  products_max: 5000
  destinations_min: 10
  destinations_max: 15
  required_taxonomies: [hotel, flight, combo, attraction, golf]
  descriptions_reviewed_min: 20

# =============================================================================
# Seeded customer histories (spec section 10)
# =============================================================================
seed:
  users: 500
  random_seed: 42
  reference_date: "2026-09-15"   # --now default; keeps runs reproducible
  history_window_days: 540
  zipf_alpha: 1.2                # ~20% of products take ~80% of bookings
  destination_zipf_alpha: 1.0
  events_per_user:               # sparse: most users 1-5 events/year
    weights: { 1: 0.28, 2: 0.22, 3: 0.16, 4: 0.11, 5: 0.08, 6: 0.05, 8: 0.04, 12: 0.03, 20: 0.02, 35: 0.01 }
  trip_composition:
    hotel_only: 0.40
    hotel_flight: 0.30
    hotel_flight_attraction: 0.20
    hotel_attraction: 0.07
    golf_trip: 0.03
  funnel:
    # A purchase is usually preceded by views/cart in the same event_group_id.
    p_search_before: 0.55
    p_view_before: 0.85
    views_per_purchase: { min: 1, max: 4 }
    p_add_to_cart: 0.45
    p_abandoned_cart: 0.18       # cart with no purchase
  lead_time_days: { min: 3, max: 90, mode: 21 }
  lifecycle:
    new:      { max_orders: 0 }
    active:   { max_days_since: 90 }
    dormant:  { max_days_since: 365 }
    churned:  { max_days_since: 99999 }
  vinclub_tiers:
    none: 0.45
    silver: 0.25
    gold: 0.18
    platinum: 0.09
    diamond: 0.03
  home_cities:
    "Hà Nội": 0.30
    "TP. Hồ Chí Minh": 0.34
    "Đà Nẵng": 0.09
    "Cần Thơ": 0.05
    "Huế": 0.04
    "Nha Trang": 0.04
    "Đà Lạt": 0.03
    "Hải Phòng": 0.06
    "Quy Nhơn": 0.03
    "Vũng Tàu": 0.02
  messy_edges:
    p_optout: 0.06               # gdpr/email/sms/push off
    p_zero_event_profile: 0.08
    p_dangling_product_ref: 0.02 # events.product_id has no FK on purpose
  demo_accounts:
    - { cdp_user_id: "VP0000001", email: "nhatrang.regular@demo.vota.local", persona: nha_trang_regular }
    - { cdp_user_id: "VP0000002", email: "firsttimer@demo.vota.local",       persona: first_timer }
    - { cdp_user_id: "VP0000003", email: "dormant@demo.vota.local",          persona: dormant_6m }
    - { cdp_user_id: "VP0000004", email: "blank@demo.vota.local",            persona: empty_history }
  demo_password: "vota-demo-2026"   # demo only; hashed with bcrypt at seed time

# Mandatory sanity check (spec section 10): popularity baseline near 0 => data
# too random; nothing beats it => too concentrated.
sanity:
  k: 20                          # Recall@20
  min_events_for_split: 2
  popular_recall_band: { low: 0.02, high: 0.60 }
  require_popular_beats_random: true

# =============================================================================
# Logging / runtime
# =============================================================================
logging:
  level: INFO
  to_file: true
  dir: "logs"
  max_bytes: 20_000_000
  backup_count: 5
  progress_every: 25

paths:
  data_root: "data"
  raw_dir: "data/raw"
  reports_dir: "data/reports"
  seed_dir: "data/seed"
  manual_dir: "data/manual"
