[project]
name = "vota-data-collection"
version = "0.1.0"
description = "V-OTA Vinpearl RecSys - Week 1 data collection pipeline"
requires-python = ">=3.11"

# Dependency set is deliberately small. Every entry is justified; anything not
# listed here is not importable, and tests/test_deps.py enforces that the tree
# only imports what is pinned.
dependencies = [
    # DB. psycopg[binary] (v3) ships cp313 win_amd64 wheels; plain `psycopg` is
    # the pure-Python distribution and needs libpq + pg_config at build time,
    # which this machine does not have. SQLAlchemy must be handed
    # `postgresql+psycopg://` explicitly - a bare `postgresql://` URL resolves
    # to psycopg2, which is not a dependency.
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",

    # HTTP. httpx for the sync client + Retry-After handling; no browser
    # automation anywhere in this project by design (spec section 1).
    "httpx>=0.27",

    # HTML parsing. selectolax is a fast CSS-selector parser used as the LAST
    # resort after JSON-LD and embedded JSON (spec section 13).
    "selectolax>=0.3.21",

    # XML parsing for sitemaps, with entity resolution and network access
    # disabled. Not optional: stdlib xml.etree has no XXE protections and
    # sitemaps are remote input.
    "lxml>=5.2",

    # CLI + config.
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Password hashing for the seeded demo accounts. bcrypt so Spring
    # Security's BCryptPasswordEncoder can verify them unchanged in Week 2.
    "bcrypt>=4.1",
]

# Deliberately NOT dependencies:
#   tenacity  - retry is hand-rolled in collectors/net.py because 403 must never
#               be retried (spec section 1) and Retry-After must be honoured;
#               expressing that in tenacity is longer than writing it.
#   orjson    - json.dumps(..., ensure_ascii=False) already keeps Vietnamese
#               unescaped, which was the only reason to reach for it.
#   numpy     - the Zipf popularity sampling uses random.choices with 1/rank**a
#               weights; pulling in numpy for one line is not worth it.
#   rapidfuzz - name similarity is computed by pg_trgm inside Postgres, which is
#               also where the index lives (spec section 7).

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.uv]
# No build step: `python -m cli` runs from this directory with a flat layout.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pg` marks tests that need a live Postgres; skip with -m "not pg".
markers = [
    "pg: requires a running Postgres (docker compose up -d postgres)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
