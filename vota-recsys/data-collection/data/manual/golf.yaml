# Sân golf Việt Nam — dữ liệu curate tay (spec §9 fallback)
#
# TẠI SAO FILE NÀY TỒN TẠI
# DoD §0.1 yêu cầu đủ 5 taxonomy `hotel|flight|combo|attraction|golf`. Truy vết
# từng taxonomy qua các nguồn đã thiết kế thì `golf` chỉ có DUY NHẤT một nguồn
# (vinpearl.com), và nguồn đó hiện trả 403 ở robots.txt. Amadeus không có
# endpoint sân golf; booking/agoda/trip cũng không. Nếu không có file này,
# `products.taxonomy` chỉ còn 3 giá trị thay vì 5 và bảng đếm theo category ở
# demo thứ Sáu có 2 dòng trống.
#
# NGUYÊN TẮC GHI DỮ LIỆU — đọc trước khi sửa
# 1. Chỉ ghi thứ kiểm chứng được. Field không chắc thì để `null`, KHÔNG đoán.
#    Spec §6.1 "không tự đoán" áp dụng cho giá và số liệu sân y như destination.
# 2. `price_raw: null` ở tất cả các mục là CỐ Ý. Giá green fee thay đổi theo
#    ngày/mùa/hạng thành viên; điền một con số bịa vào đây sẽ chảy thẳng vào
#    `products.unit_price` và trông y như giá crawl thật. Thà để trống —
#    `quality_score` nhìn thấy được chỗ trống, không nhìn thấy được số sai.
# 3. Toạ độ là toạ độ XẤP XỈ khu vực sân, đủ dùng cho dedup (§7 ngưỡng 150 m)
#    và itinerary Week 4, không phải toạ độ tee 1.
# 4. `source_priority` của `manual` là thấp nhất trong config.yaml → khi nào
#    vinpearl/OTA crawl được cùng sản phẩm, nguồn đó thắng mọi field khi merge.
#
# VIỆC CẦN LÀM TRƯỚC DEMO
# - Xác nhận `holes`/`par` với trang chủ từng sân (các ô `null` bên dưới).
# - Nếu cần hiển thị giá: lấy green fee công bố + ghi ngày lấy vào `spec_pairs`.

taxonomy: golf
curated_by: "data workstream (Week 1)"
curated_at: "2026-09-15"
provenance_note: >-
  Curate tay từ thông tin công khai về các sân golf đang hoạt động tại các
  destination trong §6.1. Tên, địa điểm và mô tả đã kiểm chứng; số hố/par để
  null ở những sân chưa xác nhận lại. Giá để null có chủ ý — xem nguyên tắc 2.

