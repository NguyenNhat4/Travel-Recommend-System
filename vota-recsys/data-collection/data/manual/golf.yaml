      lối chơi thay đổi theo buổi trong ngày. Sân được bố trí men theo sườn đồi
      và bờ biển của đảo, kết hợp fairway rộng ở các hố mở đầu và green nhỏ hơn
      ở nhóm hố cuối. Do nằm trên đảo, việc di chuyển tới sân đi qua tuyến cáp
      treo hoặc tàu từ bến Nha Trang, vì vậy golfer thường kết hợp một buổi
      chơi golf với lịch nghỉ dưỡng nhiều ngày tại đảo thay vì đi trong ngày.
