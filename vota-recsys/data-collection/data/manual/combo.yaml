# Combo / gói dịch vụ — dữ liệu curate tay (spec §9 fallback)
#
# TẠI SAO FILE NÀY TỒN TẠI
# Giống golf.yaml: taxonomy `combo` chỉ có DUY NHẤT nguồn vinpearl.com, và nguồn
# đó hiện trả 403 ở robots.txt. Không có file này thì DoD §0.1 (đủ 5 taxonomy)
# không đạt và cột `combo` trong bảng đếm demo thứ Sáu trống.
#
# ĐỌC KỸ — GIỚI HẠN CỦA DỮ LIỆU NÀY
# Mỗi mục dưới đây là một **combo template**: mô tả CẤU TRÚC của một loại gói
# dịch vụ (thành phần gồm những gì, mấy đêm) tại một destination cụ thể. Nó
# KHÔNG phải một SKU đang bán với mã và điều kiện cụ thể. Câu đầu tiên trong
# `description` nói rõ điều đó, để cả khi ai chỉ nhìn thấy một dòng trong bảng
# `products` thì vẫn không nhầm nó là gói đã crawl từ trang bán.
#
# `price_raw: null` ở mọi mục là CỐ Ý — giá combo phụ thuộc ngày, số khách và
# chương trình ưu đãi đang chạy. Bịa một con số vào đây sẽ chảy thẳng vào
# `products.unit_price` và trông y như giá thật.
#
# KHI CRAWL ĐƯỢC NGUỒN THẬT
# `source_priority` của `manual` thấp nhất trong config.yaml, nên ngay khi
# vinpearl.com (hoặc một OTA) cho ra combo thật, nguồn đó thắng mọi field khi
# merge và các dòng này chỉ còn đóng góp độ phủ. Khi đó nên xoá bớt file này.

taxonomy: combo
curated_by: "data workstream (Week 1)"
curated_at: "2026-09-15"
provenance_note: >-
  Combo template curate tay để taxonomy `combo` có dữ liệu dùng được trong
  Week 1 khi vinpearl.com không crawl được. Thành phần gói và số đêm là cấu
  trúc điển hình của loại sản phẩm này tại từng destination; giá và điều kiện
  cụ thể chưa xác minh và để null. Không dùng các dòng này cho bất kỳ nội dung
  nào hiển thị giá cho người dùng thật.

items:
  # --- Nha Trang -----------------------------------------------------------
  - name: "Combo nghỉ dưỡng Nha Trang 3 ngày 2 đêm - phòng và vé công viên"
    destination: "Nha Trang"
    nights: 2
    min_pax: 2
    transfer_included: true
    price_raw: null
    components:
      - { taxonomy: "hotel", name: "Phòng khách sạn/resort tại Nha Trang", quantity: 2 }
      - { taxonomy: "attraction", name: "Vé công viên giải trí", quantity: 2 }
    description: >-
      Đây là combo template do nhóm dữ liệu curate, mô tả cấu trúc gói chứ
      không phải một gói đang bán với mã cụ thể. Cấu trúc gói: hai đêm phòng
      tại một khu nghỉ dưỡng ở Nha Trang kèm vé vào công viên giải trí cho
      cùng số khách, cộng dịch vụ đưa đón giữa sân bay Cam Ranh và khu nghỉ.
      Loại gói này phù hợp với khách đi nhóm hai người hoặc gia đình muốn gộp
      phần lưu trú và phần vui chơi vào một lần đặt thay vì mua rời. Điểm cần
      lưu ý khi đặt loại gói này là ngày sử dụng vé thường phải nằm trong thời
      gian lưu trú, và số đêm tối thiểu quyết định gói có hiệu lực hay không.
    spec_pairs:
      - { label: "Số đêm", value: "2" }
      - { label: "Số khách tối thiểu", value: "2" }
      - { label: "Đưa đón", value: "Sân bay Cam Ranh - khu nghỉ" }

  - name: "Combo Nha Trang 4 ngày 3 đêm - phòng, vé công viên và ăn sáng"
    destination: "Nha Trang"
    nights: 3
    min_pax: 2
    transfer_included: true
    price_raw: null
    components:
      - { taxonomy: "hotel", name: "Phòng khách sạn/resort tại Nha Trang", quantity: 3 }
      - { taxonomy: "attraction", name: "Vé công viên giải trí nhiều ngày", quantity: 2 }
    description: >-
      Đây là combo template do nhóm dữ liệu curate, mô tả cấu trúc gói chứ
      không phải một gói đang bán với mã cụ thể. Cấu trúc gói: ba đêm lưu trú
      tại Nha Trang, ăn sáng hàng ngày, vé công viên giải trí dùng được nhiều
      ngày và dịch vụ đưa đón sân bay. So với gói hai đêm, phiên bản ba đêm
      thường dành cho khách muốn chia lịch trình thành một ngày vui chơi, một
      ngày nghỉ biển và một ngày tham quan thành phố. Loại gói dài ngày cũng là
      dạng sản phẩm hay xuất hiện trong lịch sử đặt của khách quay lại nhiều
      lần, nên hữu ích cho phần gợi ý xuyên danh mục.
    spec_pairs:
      - { label: "Số đêm", value: "3" }
      - { label: "Bao gồm", value: "Ăn sáng hàng ngày" }

  # --- Phú Quốc ------------------------------------------------------------
