# Week 1 runs ONLY the postgres service. Python runs on the host under `uv`
# (see data-collection/README.md): on Windows the host-volume mapping for
# data/raw plus console encoding are not worth the trouble, and the collector
# image exists so the pipeline is reproducible on Linux/CI, not because Week 1
# needs it.
#
#   docker compose up -d postgres
#   docker compose exec postgres psql -U vota -d vota      # psql is not on the host PATH
#
# IMPORTANT — where .env lives:
# Compose reads variables like ${POSTGRES_PASSWORD} from the .env file sitting
# NEXT TO THIS FILE, and from nowhere else unless told. The Python side searches
# several locations (config.ENV_SEARCH_PATHS), so it tolerates .env being at the
# repository root; compose does not. If .env is at the repository root, pass it
# explicitly every time:
#
#   docker compose --env-file ../.env up -d postgres
#
# Otherwise compose fails with "POSTGRES_PASSWORD is missing a value" even
# though every `python -m cli` command works fine — which is a confusing pair of
# symptoms to debug together.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vota}
      POSTGRES_USER: ${POSTGRES_USER:-vota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
    # Host port is configurable: 5432 is often already taken by another
    # project's Postgres. Inside the compose network the port is always 5432;
    # only the host mapping and DATABASE_URL change.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only so `psql -f /migrations/002_cdp_clone.sql` and `\i` work from
      # inside the container. This is the only way to run ad-hoc SQL here,
      # because the host has no psql client.
      - ./data-collection/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vota} -d ${POSTGRES_DB:-vota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    build: ./data-collection
    env_file: .env
    environment:
      # Inside the container postgres is reachable by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vota}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vota}
    volumes:
      - ./data-collection/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # No default command: every pipeline step is an explicit invocation, e.g.
    #   docker compose run --rm collector python -m cli report
    profiles: ["docker"]

volumes:
  pgdata:
