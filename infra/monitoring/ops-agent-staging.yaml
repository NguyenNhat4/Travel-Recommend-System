logging:
  receivers:
    docker_json:
      type: files
      include_paths:
        - /var/lib/docker/containers/*/*-json.log
      record_log_file_path: true
    fresh_catalog_logs:
      type: files
      include_paths:
        - /srv/vota/fresh-catalog-logs/*.log
      record_log_file_path: true
    docker_events:
      type: files
      include_paths:
        - /var/log/vota/docker-events.jsonl
      record_log_file_path: true
    container_disk:
      type: files
      include_paths:
        - /var/log/vota/container-disk.jsonl
      record_log_file_path: true
  processors:
    # Tầng 1: vỏ docker json-file {"log": "<dòng>", "stream", "time"}.
    parse_docker_json:
      type: parse_json
      field: message
    # Tầng 2: dòng log của app (docs/spec/logging-schema.md). Dòng không phải JSON (redis, weaviate, log cũ)
    # giữ nguyên. Thời gian lấy từ ts_utc, mức độ từ severity.
    parse_app_json:
      type: parse_json
      field: log
      time_key: ts_utc
      time_format: "%Y-%m-%dT%H:%M:%S.%LZ"
    set_app_severity:
      type: modify_fields
      fields:
        severity:
          move_from: jsonPayload.severity
    parse_docker_events:
      type: parse_json
      field: message
    parse_container_disk:
      type: parse_json
      field: message
  service:
    pipelines:
      default_pipeline:
        receivers:
          - docker_json
        processors:
          - parse_docker_json
          - parse_app_json
          - set_app_severity
      fresh_catalog_pipeline:
        receivers:
          - fresh_catalog_logs
      docker_events_pipeline:
        receivers:
          - docker_events
        processors:
          - parse_docker_events
      container_disk_pipeline:
        receivers:
          - container_disk
        processors:
          - parse_container_disk

metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  processors:
    # Metric theo từng tiến trình chiếm ~83% lượng metric agent được tính phí (2026-10-12). Autoscaler và dashboard
    # không dùng; cpu/memory/disk/network của máy vẫn giữ. Tài liệu: monitoring/settings/disable (Ops Agent >= 2.0.0).
    metrics_filter:
      type: exclude_metrics
      metrics_pattern:
        - agent.googleapis.com/processes/*
  service:
    pipelines:
      default_pipeline:
        receivers:
          - hostmetrics
        processors:
          - metrics_filter
