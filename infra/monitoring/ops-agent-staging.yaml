logging:
  receivers:
    docker_json:
      type: files
      include_paths:
        - /var/lib/docker/containers/*/*-json.log
      record_log_file_path: true
    fresh_catalog_logs:
      type: files
      include_paths:
        - /srv/vota/fresh-catalog-logs/*.log
      record_log_file_path: true
    docker_events:
      type: files
      include_paths:
        - /var/log/vota/docker-events.jsonl
      record_log_file_path: true
  processors:
    parse_docker_json:
      type: parse_json
      field: message
    parse_docker_events:
      type: parse_json
      field: message
  service:
    pipelines:
      default_pipeline:
        receivers:
          - docker_json
        processors:
          - parse_docker_json
      fresh_catalog_pipeline:
        receivers:
          - fresh_catalog_logs
      docker_events_pipeline:
        receivers:
          - docker_events
        processors:
          - parse_docker_events

metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  service:
    pipelines:
      default_pipeline:
        receivers:
          - hostmetrics
