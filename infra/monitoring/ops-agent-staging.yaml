logging:
  receivers:
    docker_json:
      type: files
      include_paths:
        - /var/lib/docker/containers/*/*-json.log
      record_log_file_path: true
  processors:
    parse_docker_json:
      type: parse_json
      field: message
  service:
    pipelines:
      default_pipeline:
        receivers:
          - docker_json
        processors:
          - parse_docker_json

metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  service:
    pipelines:
      default_pipeline:
        receivers:
          - hostmetrics
