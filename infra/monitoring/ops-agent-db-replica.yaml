logging:
  receivers:
    pg_replica_probe:
      type: files
      include_paths:
        - /var/log/vota/pg-replica.jsonl
      record_log_file_path: true
  processors:
    parse_pg_replica:
      type: parse_json
      field: message
  service:
    pipelines:
      pg_replica_pipeline:
        receivers:
          - pg_replica_probe
        processors:
          - parse_pg_replica

metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  service:
    pipelines:
      default_pipeline:
        receivers:
          - hostmetrics
