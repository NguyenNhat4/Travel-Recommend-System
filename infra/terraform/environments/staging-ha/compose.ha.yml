# One app VM of the HA group. Host networking is kept so the frontend keeps reaching the
# backend on 127.0.0.1:8000, as in ops/docker-compose.backend-vm.yml. Redis, Postgres and
# Weaviate are NOT here: they are shared services reached through the env secret.
# Giới hạn log json-file như docker-compose.yml gốc, để log container không làm đầy đĩa VM.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # Gom kết nối Postgres của 2 worker backend. DATABASE_URL/CDP_DATABASE_URL trỏ 127.0.0.1:6432.
  pgbouncer:
    container_name: vota-pgbouncer
    image: edoburu/pgbouncer@sha256:9c78945868a6a142c7fc40ccd843bbe5a606df163c7ffce4de70e0d628d696a2
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    volumes:
      - /etc/vota/pgbouncer:/etc/pgbouncer:ro
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    container_name: vota-backend
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    env_file:
      - /etc/vota/backend.env
    volumes:
      - /etc/vota/secrets:/app/secrets:ro
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Chờ SSE (90s) xong khi bị rút khỏi LB: bằng LB draining (100s), nhỏ hơn stop_grace_period bên dưới.
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: ${UVICORN_GRACEFUL_SECONDS:-100}
      # Nhiều bản sao sau LB: chỉ nhận traffic khi RecSys đã nạp, và từ chối Weaviate/Redis loopback.
      READY_REQUIRES_RECSYS: "true"
      REQUIRE_SHARED_BACKENDS: "true"
      # Chỉ readiness (LB) thăm dò DB; liveness cho autohealing cố ý không phụ thuộc DB.
      READY_REQUIRES_DB: "true"
      # Mọi VM cùng mất DB thì giữ lại (catalog/search không cần DB); một VM mất DB một mình vẫn bị loại.
      READY_DB_OUTAGE_KEEPS_READY: "true"
    depends_on:
      pgbouncer:
        condition: service_healthy
    mem_limit: 3g
    cpus: 1.5
    stop_grace_period: ${BACKEND_STOP_GRACE:-110}s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    container_name: vota-frontend
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    env_file:
      - /etc/vota/frontend.env   # only AUTH_SERVICE_TOKEN and SESSION_REDIS_URL, never DB credentials
    environment:
      NODE_ENV: production
      APP_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_BASE_URL: http://127.0.0.1:8000
    mem_limit: 768m
    cpus: 0.5
    stop_grace_period: ${BACKEND_STOP_GRACE:-110}s   # frontend proxy SSE, phải sống bằng backend
