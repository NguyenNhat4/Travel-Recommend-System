; Sidecar trên mỗi VM của nhóm HA: gom kết nối của các worker thành một số ít kết nối thật tới Postgres.
; Placeholder __UPSTREAM_HOST__ được startup.sh.tftpl thay bằng PGBOUNCER_UPSTREAM_HOST (db.vota.internal).
[databases]
vota = host=__UPSTREAM_HOST__ port=5432 dbname=vota

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; transaction pooling: connection phía server chỉ bị giữ trong một transaction. Khoá advisory mức session KHÔNG dùng
; được qua đây (LEADER_LOCK_DATABASE_URL đi thẳng tới Postgres).
pool_mode = transaction
max_client_conn = 500
; Mỗi VM tối đa 10 (+2 dự phòng) kết nối thật cho mỗi cặp (database, user): 4 VM x 2 role x 12 = 96 trong trường hợp
; xấu nhất. Đo thực tế: 250 request đồng thời chỉ dùng 10 kết nối thật. Ngân sách tính bằng POOLED=1 ops/check-db-direct.sh.
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 2
reserve_pool_timeout = 3
; psycopg 3 tự prepare statement sau vài lần chạy; bật hỗ trợ prepared statement của pgbouncer (>= 1.21).
max_prepared_statements = 100
server_idle_timeout = 300
query_wait_timeout = 15
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
