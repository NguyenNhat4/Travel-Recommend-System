logging:
  receivers:
    patroni_cluster_probe:
      type: files
      include_paths:
        - /var/log/vota/patroni-cluster.jsonl
      record_log_file_path: true
  processors:
    parse_patroni_cluster:
      type: parse_json
      field: message
  service:
    pipelines:
      patroni_cluster_pipeline:
        receivers:
          - patroni_cluster_probe
        processors:
          - parse_patroni_cluster

metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  processors:
    # Không gửi metric theo tiến trình (agent.googleapis.com/processes/*): là phần lớn lượng metric bị tính phí.
    metrics_filter:
      type: exclude_metrics
      metrics_pattern:
        - agent.googleapis.com/processes/*
  service:
    pipelines:
      default_pipeline:
        receivers:
          - hostmetrics
        processors:
          - metrics_filter
