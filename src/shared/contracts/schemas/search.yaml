SearchRequest:
  type: object
  required:
  - query
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 500
      pattern: \S
    destination:
      type:
      - string
      - 'null'
    taxonomy:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/Taxonomy
      - type: 'null'
    priceMin:
      type:
      - integer
      - 'null'
      minimum: 0
    priceMax:
      type:
      - integer
      - 'null'
      minimum: 0
    starRatingMin:
      type:
      - number
      - 'null'
      minimum: 0
      maximum: 5
    availableOnly:
      type:
      - boolean
      - 'null'
      default: true
    sort:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/SearchSort
      - type: 'null'
    limit:
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 50
      default: 20
    offset:
      type:
      - integer
      - 'null'
      minimum: 0
      default: 0
  additionalProperties: false
  description: 'query bắt buộc; trường tùy chọn null tương đương bỏ qua/default. Lọc priceMin/Max trên
    unitPrice snapshot VND, không phải tổng chuyến đi; giá null bị loại khi có lọc giá. Không hỗ trợ startDate/endDate/party:
    Agent tự kiểm tra sau retrieval. availableOnly=true chỉ lọc snapshot; lấy điểm không bán vé bằng false.'
SearchFacets:
  type: object
  required:
  - taxonomy
  - destination
  properties:
    taxonomy:
      type: object
      propertyNames:
        $ref: ../openapi.yaml#/components/schemas/Taxonomy
      additionalProperties:
        type: integer
        minimum: 0
    destination:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
SearchResponse:
  type: object
  required:
  - results
  - total
  properties:
    results:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/ScoredProduct
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
    offset:
      type: integer
    topScore:
      type:
      - number
      - 'null'
      minimum: 0
      maximum: 1
    facets:
      $ref: ../openapi.yaml#/components/schemas/SearchFacets
    requestId:
      type: string
