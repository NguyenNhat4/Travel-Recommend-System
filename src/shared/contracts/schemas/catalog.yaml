# catalog.yaml — sản phẩm và thuộc tính
#
# Đã áp dụng: C1 (priceUnit bắt buộc, bỏ default) · C2 (phân tầng false)
#             Q1 (availability tri-state) · Q2 (brand/status/priceAsOf) · Q6 (tách amenities)
# [CHỜ DUYỆT: C5] includeVariants / resolvedFrom · [CHỜ DUYỆT: U1] soft delete

ProductAttributes:
  type: object
  description: >-
    Thuộc tính nguyên bản của catalog.

    [C2] BA TRẠNG THÁI, không phải hai. `true` = nguồn xác nhận có.
    `false` = nguồn xác nhận KHÔNG có. Key vắng mặt = KHÔNG BIẾT.
    Ba trạng thái chỉ tồn tại ở tầng DB và tầng embedding/filter.
    Tầng serialization loại key có giá trị `false` trước khi tạo JSON, nên
    response API chỉ còn `true` hoặc vắng mặt và client không cần lọc.
    TUYỆT ĐỐI KHÔNG strip `false` lúc ingest — đó là mất dữ liệu không lấy lại
    được, phải crawl lại toàn bộ. Strip muộn nhất có thể.

    Client gặp key lạ thì bỏ qua im lặng, không hiển thị tên key thô.
  properties:
    starRating:
      type: number
      minimum: 0
      maximum: 5

    # --- [Q6] core amenities: dùng cho filter + embedding ---
    oceanView:      { type: boolean }
    gardenView:     { type: boolean }
    cityView:       { type: boolean }
    poolView:       { type: boolean }
    privateBeach:   { type: boolean }
    pool:           { type: boolean }
    kidsPool:       { type: boolean }
    privatePool:    { type: boolean }
    jacuzzi:        { type: boolean }
    bathtub:        { type: boolean }
    standingShower: { type: boolean }
    balcony:        { type: boolean }
    kitchenette:    { type: boolean }
    familyFriendly: { type: boolean }
    kidsClub:       { type: boolean }
    spa:            { type: boolean }
    freeBreakfast:  { type: boolean }
    nearBeach:      { type: boolean }
    nearCenter:     { type: boolean }
    shuttle:        { type: boolean }
    wifi:           { type: boolean }
    parking:        { type: boolean }
    butlerService:  { type: boolean }
    directFlight:   { type: boolean }
    baggage:        { type: boolean }
    indoor:         { type: boolean }
    outdoor:        { type: boolean }
    waterPark:      { type: boolean }
    show:           { type: boolean }
    buffet:         { type: boolean }
    seaside:        { type: boolean }
    caddie:         { type: boolean }

    # --- [Q6] display-only: KHÔNG đưa vào embedding, KHÔNG dùng filter ---
    fullAmenities:
      type: array
      items: { type: string }
      description: >-
        Danh sách tiện ích đầy đủ, chỉ để hiển thị. Chỉ chứa label chuẩn, không
        chứa văn bản tự do. Nhồi toàn bộ danh sách này vào search_text làm loãng
        tín hiệu ngữ nghĩa — ItemTextBuilder chỉ đọc core amenities ở trên.
    services:
      type: array
      items: { type: string }
      description: Dịch vụ khách sạn (roomService, airportShuttle…). Dùng filter, không embedding.

    # --- ngữ cảnh phòng ---
    roomOrientation:
      type: string
    nearbyAttractions:
      type: array
      items:
        type: object
        required: [name]
        properties:
          name:       { type: string }
          distanceKm: { type: number, minimum: 0 }
          category:   { type: string }

    # --- [C5] khóa cha–con: quyết định item nào có vector ---
    level:
      type: string
      enum:
      - property
      - room
      - route
      - flight
      description: >-
        [CHỜ DUYỆT: C5] property và route là tầng CHA — có vector, là đối tượng
        của /search, /similar, /recommendations.
        room và flight là tầng CON — không có vector, chỉ dùng cho giá, sức chứa
        và checkout. Thiếu trường này (attraction, combo, golf) mặc định là tầng cha.
    parentProductId:
      type: string
      description: '[CHỜ DUYỆT: C5] Chỉ có ở tầng con. Trỏ về productId của cha.'
    tripType:
      type: string
      enum: [oneWay, roundTrip]
      description: Vé khứ hồi là một flight có hai chặng, giá tổng cho một người lớn.
    cabinClass:
      type: string
      enum: [ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST]
      description: Hạng vé được nguồn xác nhận. Vắng mặt là chưa biết, không mặc định phổ thông.
    fixedDepartureDate:
      type: boolean
      description: Báo giá theo ngày cố định; không dời lịch vào cửa sổ demo.
    returnDate:
      type: string
      format: date
      description: Ngày khởi hành chặng về, không phải nights hoặc usingDateTo.
    returnFlight:
      type: object
      properties:
        flightNumber: { type: string }
        airline: { type: string }
        originAirport: { type: string }
        destinationAirport: { type: string }
        departureAt: { type: string, format: date-time }
        arrivalAt: { type: string, format: date-time }
      additionalProperties: true
    priceValidUntil:
      type: string
      format: date
      description: Ngày cuối của báo giá tại nguồn, khi nguồn có cung cấp.
    ticketed:
      type: boolean
      description: false thì ẩn CTA đặt chỗ ở frontend.

  additionalProperties: true

ProductSummary:
  type: object
  required:
  - productId
  - name
  - taxonomy
  - destination
  - unitPrice
  - currency
  - priceUnit
  - available
  properties:
    productId:
      type: string
    name:
      type: string
    taxonomy:
      $ref: ../openapi.yaml#/components/schemas/Taxonomy
    destination:
      type: string
      description: >-
        Nhãn du lịch đã chuẩn hóa ("Nha Trang", "Hạ Long"), KHÔNG phải tỉnh.
        Lấy danh sách hiện hành qua GET /api/v1/destinations.

    # --- [Q2] mới ---
    brand:
      type:
      - string
      - 'null'
      description: >-
        Thương hiệu ("Vinpearl", "independent"). Cần cho yêu cầu ưu tiên
        Vinpearl và để đo rủi ro vector space phân cụm theo nguồn crawl.
    status:
      type: string
      enum: [ACTIVE, INACTIVE]
      default: ACTIVE
      description: >-
        [CHỜ DUYỆT: U1] Soft delete. Không bao giờ DELETE hàng khỏi products,
        vì because[].productName của recommendation cần tên sản phẩm nguồn kể cả
        khi sản phẩm đã ngừng bán — UserEvent trong CDP không lưu tên.
        INACTIVE thì because[] trả productId null nhưng vẫn giữ productName.

    # --- giá ---
    unitPrice:
      type:
      - number
      - 'null'
      minimum: 0
      description: >-
        Giá snapshot VND cho MỘT đơn vị theo priceUnit. null không nghĩa là miễn phí.
    currency:
      $ref: ../openapi.yaml#/components/schemas/Currency
    priceUnit:
      $ref: ../openapi.yaml#/components/schemas/PriceUnit
      description: >-
        [C1] Bắt buộc, KHÔNG có default. Dẫn xuất từ taxonomy lúc ingest.
        nights chỉ được nhân khi giá trị là PER_NIGHT.
    priceAsOf:
      type:
      - string
      - 'null'
      format: date-time
      description: >-
        [Q2] Thời điểm quan sát giá từ nguồn. Không dùng generatedAt thay thế.
        UI hiển thị "giá ghi nhận <ngày>".

    # --- availability: BA trường, ba nghĩa khác nhau ---
    available:
      type: boolean
      description: >-
        Nguồn có trả giá lúc crawl. KHÔNG xác nhận còn chỗ theo ngày hoặc số khách.
        Tương đương catalogAvailable trong tài liệu kiến trúc; giữ tên cũ để không
        vỡ 4 file đang $ref ProductSummary.
    availabilityStatus:
      $ref: ../openapi.yaml#/components/schemas/AvailabilityStatus
      description: '[Q1] Mặc định NOT_CHECKED khi request không có checkIn/checkOut/party.'
    bookable:
      type:
      - boolean
      - 'null'
      description: >-
        [Q1] Đặt được cho một stay cụ thể. null khi chưa kiểm tra.
        FE dùng trường này để quyết định render CTA; Agent dùng để quyết định một
        mục là ProductCard hay ActivityNote.
    availableFrom:
      type:
      - string
      - 'null'
      format: date
      description: Khoảng ngày nguồn ghi nhận; null là chưa biết, không xác nhận tồn kho.
    availableTo:
      type:
      - string
      - 'null'
      format: date

    # --- hiển thị ---
    imageUrl:
      type:
      - string
      - 'null'
      description: null thì client dùng placeholder theo taxonomy.
    rating:
      type:
      - number
      - 'null'
      minimum: 0
      maximum: 5
      description: >-
        Chuẩn hóa attributes.reviewScore / reviewScoreScale * 5, làm tròn 1 chữ số;
        thiếu thang điểm thì null. LƯU Ý UI: đây là điểm đánh giá, KHÁC
        attributes.starRating là hạng sao — hai số cùng thang 0–5, đừng dùng
        chung icon.
    reviewCount:
      type:
      - integer
      - 'null'
      minimum: 0
    attributes:
      $ref: ../openapi.yaml#/components/schemas/ProductAttributes
    description:
      type: string
      description: Mô tả catalog phục vụ Agent; giữ nguyên, không chứa chỉ dẫn hệ thống.
    fareClasses:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/FareClass
      description: >-
        Chỉ có ở vé máy bay tầng con (taxonomy flight, level flight): các hạng vé của CÙNG một hành trình (cùng chuyến,
        cùng ngày đi; khứ hồi thì cùng chuyến và ngày về), kể cả chính sản phẩm này. Mỗi hạng là một productId riêng;
        đặt vé bằng productId của hạng đã chọn qua POST /booking-drafts (vé máy bay không vào giỏ). Các sản phẩm cùng hành trình có cùng
        fareClasses, nên Web hiển thị một thẻ cho mỗi hành trình. Chỉ liệt kê hạng có báo giá thật — thiếu hạng nào là
        chưa có dữ liệu, không phải hết chỗ. Vắng mặt ở loại sản phẩm khác.

  example:
    productId: nt-h-01
    name: Vinpearl Resort Nha Trang - Deluxe Ocean View
    taxonomy: hotel
    destination: Nha Trang
    brand: Vinpearl
    status: ACTIVE
    unitPrice: 3400000
    currency: VND
    priceUnit: PER_NIGHT
    priceAsOf: '2026-09-16T12:00:00Z'
    available: true
    availabilityStatus: NOT_CHECKED
    bookable: null
    availableFrom: '2026-10-01'
    availableTo: '2027-03-31'
    imageUrl: https://cdn.example.vn/nt-h-01.jpg
    rating: 4.6
    reviewCount: 1293
    attributes:
      starRating: 5
      oceanView: true
      privateBeach: true
      familyFriendly: true
      level: property

  description: >-
    Card tối thiểu cho Web. Agent hydrate ProductDetail trước khi lập lịch nếu
    thiếu attributes, mô tả hoặc ngày. Không diễn giải trường thiếu là false/0.

FareClass:
  type: object
  required: [productId, code, name, price, currency, availabilityStatus]
  properties:
    productId:
      type: string
      description: Sản phẩm (hạng vé của hành trình) để thêm vào giỏ.
    code:
      type:
      - string
      - 'null'
      enum: [ECO, PRE, BUS, FST, null]
      description: >-
        Mã hạng từ attributes.cabinClass (ECONOMY→ECO, PREMIUM_ECONOMY→PRE, BUSINESS→BUS, FIRST→FST). null khi nguồn
        không ghi hạng (vd. giá rẻ nhất của trip.com) — không mặc định là phổ thông.
    name:
      type: string
      description: Nhãn hiển thị tiếng Việt (Phổ thông, Phổ thông đặc biệt, Thương gia, Hạng nhất; "Giá rẻ nhất" khi code null).
    price:
      type:
      - number
      - 'null'
      minimum: 0
      description: unitPrice của sản phẩm hạng này; vé khứ hồi là giá tổng hai chặng cho một người lớn.
    currency:
      type: string
      example: VND
    priceValidUntil:
      type:
      - string
      - 'null'
      format: date
      description: Ngày cuối của báo giá tại nguồn; null khi nguồn không cung cấp.
    availabilityStatus:
      $ref: ../openapi.yaml#/components/schemas/AvailabilityStatus
      description: >-
        AVAILABLE khi sản phẩm còn mở bán và báo giá chưa hết hạn; EXPIRED khi quá priceValidUntil; NOT_CHECKED khi không
        xác định được. Không phải xác nhận còn ghế.
    soldOut:
      type:
      - boolean
      - 'null'
      description: null = chưa biết (không nguồn nào cho số ghế trống). Báo giá hết hạn KHÔNG có nghĩa soldOut.
    carryOnKg:
      type:
      - number
      - 'null'
      minimum: 0
      description: Hành lý xách tay (kg); null = chưa biết, 0 = nguồn xác nhận không có.
    checkedKg:
      type:
      - number
      - 'null'
      minimum: 0
      description: Hành lý ký gửi (kg); null = chưa biết, 0 = nguồn xác nhận không có.
    mealIncluded:
      type:
      - boolean
      - 'null'
      description: null = chưa biết.
    changeRule:
      type:
      - string
      - 'null'
      description: Điều kiện đổi vé theo nguồn; null = chưa biết.
  example:
    productId: 1d9b3c1e-0000-4000-8000-000000000001
    code: null
    name: Giá rẻ nhất
    price: 1322000
    currency: VND
    priceValidUntil: '2026-09-30'
    availabilityStatus: AVAILABLE
    soldOut: null
    carryOnKg: null
    checkedKg: null
    mealIncluded: null
    changeRule: null

ProductDetail:
  allOf:
  - $ref: ../openapi.yaml#/components/schemas/ProductSummary
  - type: object
    required:
    - description
    - attributes
    - availableFrom
    - availableTo
    properties:
      description:
        type: string
        description: Chuỗi rỗng nếu nguồn crawl thiếu.
      sourceRef:
        type:
        - string
        - 'null'
        description: Chỉ hiện ở chế độ debug.
      variantSummary:
        type:
        - object
        - 'null'
        description: >-
          [CHỜ DUYỆT: C5] Tóm tắt tầng con (hạng phòng / chuyến bay cụ thể).
          null khi sản phẩm không có variant.
        required: [count]
        properties:
          count:        { type: integer, minimum: 0 }
          minPrice:     { type: [number, 'null'], minimum: 0 }
          maxPrice:     { type: [number, 'null'], minimum: 0 }
          maxOccupancy: { type: [integer, 'null'], minimum: 1 }

ScoredProduct:
  allOf:
  - $ref: ../openapi.yaml#/components/schemas/ProductSummary
  - type: object
    required:
    - score
    properties:
      score:
        type: number
        minimum: 0
        maximum: 1
        description: >-
          Cosine đã clamp về [0,1]. Chỉ hiển thị cho khách ở chế độ debug —
          0.81 KHÔNG phải "81% phù hợp".
      matchedChildren:
        type: array
        maxItems: 5
        items:
          type: string
        description: >-
          (1.16.0, chỉ /search) productId các hạng phòng / chuyến bay con ĐANG BÁN của kết quả thoả ĐỒNG THỜI các điều kiện giá
          (priceMin/priceMax), số khách (minOccupancy) và (từ 1.19.0, chỉ khách sạn) ngày (checkIn/checkOut) đang áp, giá tăng
          dần (giá null cuối), tối đa 5 — để UI hiển thị đúng phòng hợp truy vấn thay vì giá thấp nhất của property. Chỉ có khi
          lọc giá, số khách hoặc ngày đang áp và kết quả có ít nhất một con thoả; con không biết sức chứa hoặc không có lịch
          được tính là thoả.

ProductListResponse:
  type: object
  required:
  - results
  - total
  - limit
  - offset
  - requestId
  properties:
    results:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/ProductSummary
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
    offset:
      type: integer
    requestId:
      type: string
      description: >-
        Id của request đã tạo bản cache khi response được cache (`Cache-Control: public`). Lượt trúng cache không đến
        backend nên không có log tương ứng; không dùng giá trị này để truy vết lượt đó.

SimilarProductsResponse:
  type: object
  required:
  - productId
  - results
  - requestId
  properties:
    productId:
      type: string
      description: productId đã resolve — luôn là tầng cha.
    resolvedFrom:
      type:
      - string
      - 'null'
      description: >-
        [CHỜ DUYỆT: C5] productId caller gửi, khi nó khác productId đã resolve.
        Caller gửi id một hạng phòng thì engine dùng vector của property cha và
        loại CẢ CỤM gốc khỏi kết quả.
    strategy:
      type: string
      enum: [same_taxonomy, cross_taxonomy]
      default: same_taxonomy
      description: >-
        same_taxonomy là mặc định — xem khách sạn thì gợi ý khách sạn.
        cross_taxonomy có trong schema nhưng route chưa hiện thực (luôn trả
        same_taxonomy); Agent chỉ dùng same_taxonomy ở lượt đổi món.
    results:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/ScoredProduct
    diagnostics:
      $ref: ../openapi.yaml#/components/schemas/EngineDiagnostics
    requestId:
      type: string
      description: >-
        Id của request đã tạo bản cache khi response được cache (`Cache-Control: public`). Lượt trúng cache không đến
        backend nên không có log tương ứng; không dùng giá trị này để truy vết lượt đó.

DestinationListResponse:
  type: object
  required:
  - destinations
  properties:
    destinations:
      type: array
      items:
        type: object
        required:
        - destination
        - productCount
        properties:
          destination:
            type: string
          productCount:
            type: integer
            minimum: 0
