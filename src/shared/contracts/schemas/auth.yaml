RegisterRequest:
  type: object
  required:
  - email
  - password
  - fullName
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 8
    fullName:
      type: string
      minLength: 1
      maxLength: 100
LoginRequest:
  type: object
  required:
  - email
  - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
AuthUser:
  type: object
  required:
  - userId
  - cdpUserId
  - email
  - fullName
  properties:
    userId:
      type: string
    cdpUserId:
      type: string
    email:
      type: string
      format: email
    fullName:
      type: string
AuthResponse:
  type: object
  required:
  - accessToken
  - tokenType
  - expiresIn
  - user
  properties:
    accessToken:
      type: string
    tokenType:
      type: string
      const: Bearer
    expiresIn:
      type: integer
      description: Giây
    user:
      $ref: ../openapi.yaml#/components/schemas/AuthUser
# --- Hybrid session (docs/hop-dong-tich-hop-auth.md §5, §18) -------------------
# Nhóm này chỉ BFF gọi, gác bằng X-Service-Token. Trình duyệt không bao giờ nhận
# accessToken/refreshToken; BFF giữ chúng trong session store phía server.
# Các schema v1 phía trên không đổi — client nội bộ/test vẫn dùng AuthResponse.
SessionState:
  type: string
  description: >-
    anonymous = khách vãng lai; pending_mfa = đúng mật khẩu nhưng chưa qua yếu tố
    thứ hai, chưa mang cdpUserId; authenticated = đã xác thực đầy đủ.
  enum:
  - anonymous
  - pending_mfa
  - authenticated
SessionRequest:
  type: object
  required:
  - email
  - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
    captchaToken:
      type: string
      description: Bắt buộc khi lần thử trước trả details.captchaRequired = true (§9.3).
SessionResponse:
  type: object
  required:
  - state
  properties:
    state:
      $ref: ../openapi.yaml#/components/schemas/SessionState
    accessToken:
      type: string
      description: JWT hạn ngắn. Chỉ có khi state = authenticated. Không bao giờ tới trình duyệt.
    refreshToken:
      type: string
      description: Chuỗi đục, một lần dùng. Chỉ có khi state = authenticated.
    expiresIn:
      type: integer
      description: Giây tới hạn của accessToken.
    user:
      $ref: ../openapi.yaml#/components/schemas/AuthUser
RefreshRequest:
  type: object
  required:
  - refreshToken
  properties:
    refreshToken:
      type: string
RevokeRequest:
  type: object
  required:
  - refreshToken
  properties:
    refreshToken:
      type: string
MfaVerifyRequest:
  type: object
  required:
  - code
  properties:
    code:
      type: string
      minLength: 6
      maxLength: 10
    isRecoveryCode:
      type: boolean
      default: false
PasswordChangeRequest:
  type: object
  required:
  - currentPassword
  - newPassword
  properties:
    currentPassword:
      type: string
    newPassword:
      type: string
      minLength: 8
      maxLength: 128
JwksResponse:
  type: object
  required:
  - keys
  properties:
    keys:
      type: array
      minItems: 1
      items:
        type: object
        required:
        - kty
        - kid
        - use
        - alg
        properties:
          kty:
            type: string
          kid:
            type: string
          use:
            type: string
            const: sig
          alg:
            type: string
            enum:
            - RS256
            - ES256
          n:
            type: string
          e:
            type: string
