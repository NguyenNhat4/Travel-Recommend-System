# common.yaml — enum và kiểu dùng chung
#
# Đã áp dụng: C1 (PriceUnit), C4 (SearchMode), Q1 (error code availability)
# Đánh dấu [CHỜ DUYỆT: Cx] là phần chưa được duyệt trong schema-freeze-decisions.md

Taxonomy:
  type: string
  enum:
  - hotel
  - flight
  - attraction
  - combo
  - golf

# [C1] PER_NIGHT là đơn vị gốc. Luôn dẫn xuất từ taxonomy lúc ingest.
# KHÔNG có default: priceUnit không bao giờ ở trạng thái thiếu, và một
# default PER_NIGHT sẽ khiến bản ghi flight rơi mất trường bị nhân với nights.
# Ánh xạ chốt:
#   hotel      -> PER_NIGHT    (chứng cứ: tham số crawl "1 đêm, 2 người lớn")
#   combo      -> PER_PACKAGE  (số đêm đã nằm trong gói)
#   flight     -> PER_PERSON
#   attraction -> PER_PERSON
#   golf       -> PER_PERSON
# Bất biến: nights CHỈ được nhân khi priceUnit == PER_NIGHT.
PriceUnit:
  type: string
  enum:
  - PER_NIGHT
  - PER_PERSON
  - PER_PACKAGE
  - UNKNOWN
  description: >-
    Đơn vị của unitPrice. UNKNOWN là van an toàn của schema; không taxonomy nào
    trong catalog hiện tại mang giá trị đó. nights chỉ được đưa vào phép nhân
    khi giá trị là PER_NIGHT — mọi đơn vị khác bỏ qua nights kể cả khi client gửi.

ProductSort:
  type: string
  enum:
  - popular
  - price_asc
  - price_desc
  default: popular
  description: >-
    popular xếp theo products.popularity_score (cột materialized).
    [CHỜ DUYỆT: C7] công thức và cách cập nhật.

SearchSort:
  type: string
  enum:
  - relevance
  - price_asc
  - price_desc
  default: relevance

# [C4] Chế độ truy xuất phải được khai báo trong diagnostics.
# Không bao giờ chuyển từ exact sang approximate mà không đổi giá trị này.
SearchMode:
  type: string
  enum:
  - EXACT_FILTER_SCORE
  - ANN_CANDIDATE_SCORE
  - HYBRID_CANDIDATE_SCORE
  description: >-
    ANN_CANDIDATE_SCORE là mặc định cho /similar và /recommendations
    (từ 2026-09-24): lọc id theo structured filter, lấy top-K ứng viên từ Weaviate,
    rồi chấm điểm và đếm trên tập ứng viên đó. Ở chế độ này approximate là true,
    totalExact và facetsExact bắt buộc là false.

    HYBRID_CANDIDATE_SCORE là mặc định của /search (từ 2026-09-25): R = R_dense ∪ R_lex.
    R_dense = top-K dense có score >= cutoff (như ANN). R_lex = hit BM25 (trên
    nameAscii/searchTextAscii đã fold dấu) có rank <= diagnostics.lexicalK, score
    trong [diagnostics.lexicalCutoff, cutoff) và tên chứa >= diagnostics.lexicalMinCoverage
    token của truy vấn. Khi diagnostics.evidenceGate = true (1.28.0): R_lex còn đòi tên khớp
    ít nhất một cặp âm tiết liền nhau, đúng thứ tự, giữ dấu với câu; RRF chỉ cộng hạng BM25 của
    unit có cặp đó trong tên hoặc mô tả. Khi diagnostics.filterOnly = true: R = top-K của F, không cutoff.
    results sắp theo RRF (k = diagnostics.rrfK) nên score — vẫn là cosine đã clamp —
    KHÔNG đơn điệu trong một trang; đếm phần vớt ở diagnostics.lexicalCount.
    approximate/totalExact/facetsExact như ANN. Backend tắt hybrid (SEARCH_HYBRID=false)
    thì /search khai lại ANN_CANDIDATE_SCORE.

    EXACT_FILTER_SCORE giữ cho engine quét toàn bộ vector (bản chạy offline).

# [Q1] Kết quả kiểm tra availability theo một khoảng ngày cụ thể.
AvailabilityStatus:
  type: string
  enum:
  - NOT_CHECKED
  - AVAILABLE
  - PARTIALLY_AVAILABLE
  - UNAVAILABLE
  - EXPIRED
  description: >-
    NOT_CHECKED là giá trị mặc định khi chưa có checkIn/checkOut/party.
    EXPIRED khi snapshot availability đã quá hạn (expires_at).

Strategy:
  type: string
  description: >-
    Thêm giá trị mới phải thông báo trước; client map giá trị lạ về tiêu đề chung.
    long_term: có lịch sử nhưng không có chuyến đang mở và chưa quá ngưỡng dormant của engine.
    cold_start_content: có chuyến đang mở, tổng dưới 3 event dùng được và chưa mua gì trong chuyến.
  enum:
  - cross_vertical
  - recent_activity
  - dormant
  - popular
  - long_term
  - cold_start_content

BecauseEvent:
  type: string
  enum:
  - purchase
  - add_to_cart
  - product_view
  - search

Currency:
  type: string
  const: VND

ReferenceCode:
  type: string
  pattern: ^VOTA-[0-9]{8}-[A-Z0-9]{4}$

ErrorCode:
  type: string
  enum:
  # --- chung ---
  - VALIDATION_ERROR
  - CART_EMPTY
  - INVALID_CREDENTIALS
  - INVALID_TOKEN
  - TOKEN_EXPIRED
  - PRODUCT_NOT_FOUND
  - CART_ITEM_NOT_FOUND
  - BOOKING_NOT_FOUND
  - NOT_FOUND
  - EMAIL_ALREADY_EXISTS
  - PRODUCT_UNAVAILABLE
  - PRICE_CHANGED
  - DATE_OUT_OF_RANGE
  - SEARCH_UNAVAILABLE
  - INTERNAL_ERROR
  - INVALID_TRIP_DURATION
  - CONVERSATION_NOT_FOUND
  - UNSUPPORTED_DESTINATION
  - LLM_UNAVAILABLE
  - ITINERARY_VALIDATION_FAILED
  # --- [Q1] availability ---
  - AVAILABILITY_NOT_FOUND
  - AVAILABILITY_EXPIRED
  - NO_RATE_PLAN
  - MIN_STAY_NOT_MET
  - CLOSED_ON_ARRIVAL
  - CLOSED_ON_DEPARTURE
  - PARTIALLY_AVAILABLE
  # --- [CHỜ DUYỆT: C5] hai tầng property/room ---
  - PRODUCT_NOT_INDEXED
  # --- auth hybrid (docs/hop-dong-tich-hop-auth.md §17) ---
  - UNAUTHENTICATED
  - SESSION_EXPIRED
  - CSRF_FAILED
  - MFA_REQUIRED
  - MFA_INVALID
  - EMAIL_NOT_VERIFIED
  - TOO_MANY_ATTEMPTS
  - CAPTCHA_REQUIRED
  - CAPTCHA_FAILED
  - WEAK_PASSWORD
  - INVALID_VERIFICATION_TOKEN
  - OAUTH_EMAIL_UNVERIFIED
  - OAUTH_ALREADY_LINKED
  - CDP_UNAVAILABLE
  # --- booking: giữ chỗ và thanh toán Stripe ---
  - BOOKING_PENDING_PAYMENT
  - BOOKING_ALREADY_PAID
  - BOOKING_NOT_CANCELLABLE
  - PAYMENT_PROVIDER_UNAVAILABLE
  - INVALID_WEBHOOK_SIGNATURE
  # --- booking: đặt trực tiếp qua đơn nháp (docs/spec/booking/dat-truc-tiep-theo-don-nhap.md) ---
  - DIRECT_BOOKING_ONLY
  - BOOKING_DRAFT_NOT_FOUND
  - BOOKING_DRAFT_EXPIRED
  # --- 1.14.0: PostgreSQL không với tới được (503, retryable) ---
  - DATABASE_UNAVAILABLE

ValidationFieldError:
  type: object
  description: >-
    Một vi phạm trong details.fields[] của VALIDATION_ERROR. Backend trả mọi vi phạm trong một lần; message là tiếng Việt hiển thị
    được trực tiếp. reason là mã luật dùng chung giữa Web và Backend (docs/spec/booking/checkout-nhieu-buoc-hanh-khach.md §5.6):
    REQUIRED, NAME_INVALID, PHONE_INVALID, EMAIL_INVALID, BIRTH_DATE_INVALID, CHILD_AGE_INVALID, ADULT_REQUIRED,
    PARTY_TOO_LARGE, TRAVELER_UNKNOWN, TRAVELER_DUPLICATED, ITEM_DETAIL_MISSING, ITEM_DETAIL_UNKNOWN, ITEM_DETAIL_DUPLICATED,
    ITEM_WITHOUT_TRAVELER, GUEST_COUNT_MISMATCH, INFANTS_EXCEED_ADULTS, ROOM_COUNT_MISMATCH, OCCUPANCY_EXCEEDED,
    LEAD_GUEST_INVALID, TRAVELERS_REQUIRED, ROOMS_TOO_MANY; với đơn nháp và giỏ của khách: DUPLICATE_ITEM, CART_FULL, NOT_REBOOKABLE. Client
    gặp reason lạ thì hiển thị message.
  required:
  - field
  - reason
  - message
  properties:
    field:
      type: string
      description: Đường dẫn trong request, ví dụ travelers[2].birthDate hoặc itemDetails[0].rooms[1].
    reason:
      type: string
    message:
      type: string
    cartItemId:
      type: string
      description: Có khi vi phạm thuộc một mục giỏ hoặc mục đơn nháp, để Web gắn lỗi vào đúng thẻ dịch vụ.

ErrorResponse:
  type: object
  required:
  - error
  properties:
    error:
      type: object
      required:
      - code
      - message
      - retryable
      - requestId
      properties:
        code:
          $ref: ../openapi.yaml#/components/schemas/ErrorCode
        message:
          type: string
          description: Tiếng Việt, hiển thị được trực tiếp cho người dùng.
        retryable:
          type: boolean
          description: >-
            true chỉ với SEARCH_UNAVAILABLE, INTERNAL_ERROR, LLM_UNAVAILABLE,
            TOO_MANY_ATTEMPTS, CDP_UNAVAILABLE, PAYMENT_PROVIDER_UNAVAILABLE và
            DATABASE_UNAVAILABLE (503, kèm Retry-After; áp dụng cho mọi endpoint cần DB).
            Mọi mã còn lại là false — thử lại nguyên request cho cùng kết quả.
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
          description: >-
            Tùy mã lỗi. VALIDATION_ERROR {fields: ValidationFieldError[]}; PRODUCT_NOT_FOUND và
            PRODUCT_UNAVAILABLE {productId}; CART_ITEM_NOT_FOUND {cartItemId};
            PRICE_CHANGED {productId, oldPrice, newPrice, fareType?} — fareType là CHILD khi giá vé trẻ em đổi; DATE_OUT_OF_RANGE
            {productId, availableFrom, availableTo}; UNSUPPORTED_DESTINATION
            {destination, supportedDestinations, conversationId} — conversationId
            là hội thoại đã lưu phần chuyến đi còn lại, gửi lại cùng điểm đến
            hợp lệ để tiếp tục; MIN_STAY_NOT_MET {productId, minStay};
            PRODUCT_NOT_INDEXED {productId, taxonomy}; TOO_MANY_ATTEMPTS
            {retryAfterSeconds}; MFA_INVALID {attemptsLeft}; EMAIL_NOT_VERIFIED
            {email}; WEAK_PASSWORD {reasons}; INVALID_VERIFICATION_TOKEN
            {purpose}; OAUTH_EMAIL_UNVERIFIED và OAUTH_ALREADY_LINKED
            {provider}; BOOKING_PENDING_PAYMENT {referenceCode, holdExpiresAt} — đơn đang
            giữ chỗ để tiếp tục hoặc huỷ; BOOKING_NOT_CANCELLABLE {referenceCode, reason,
            cancellableUntil}; BOOKING_ALREADY_PAID {referenceCode}; DIRECT_BOOKING_ONLY {productId, taxonomy};
            BOOKING_DRAFT_EXPIRED {draftId, items: [{productId, taxonomy, inCart}]}; PRODUCT_UNAVAILABLE khi tạo đơn
            nháp mà không mục nào được nhận {rejectedItems}.

Pagination:
  type: object
  required:
  - page
  - pageSize
  - totalItems
  - totalPages
  description: Phân trang theo trang (docs/prd/api-contract.md §1.3). totalPages bằng 0 khi không có phần tử nào.
  properties:
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
