SlotTime:
  type: string
  enum:
  - MORNING
  - NOON
  - AFTERNOON
  - EVENING
ItemSource:
  type: string
  enum:
  - SEARCH
  - RECOMMENDATION
ActivityType:
  type: string
  enum:
  - MEAL
  - REST
  - FREE_TIME
  - TRANSFER
  - SIGHTSEEING
PartyType:
  type: string
  enum:
  - SOLO
  - COUPLE
  - FAMILY_WITH_KIDS
  - FRIENDS
Pace:
  type: string
  enum:
  - RELAXED
  - BALANCED
  - PACKED
BudgetStatus:
  type: string
  enum:
  - WITHIN_BUDGET
  - OVER_BUDGET
  - NO_BUDGET
  - UNKNOWN
Party:
  type: object
  required:
  - type
  - adults
  - children
  properties:
    type:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/PartyType
      - type: 'null'
    adults:
      type: integer
      minimum: 1
    children:
      type: integer
      minimum: 0
TripIntent:
  type: object
  description: Baseline tích hợp 1.1.0.
  required:
  - destination
  - startDate
  - days
  - party
  - budget
  - interests
  - pace
  properties:
    destination:
      type:
      - string
      - 'null'
    startDate:
      type:
      - string
      - 'null'
      format: date
    days:
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 7
    party:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/Party
      - type: 'null'
    budget:
      type:
      - integer
      - 'null'
      minimum: 0
      description: Tổng ngân sách VND.
    interests:
      type: array
      items:
        type: string
    pace:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/Pace
      - type: 'null'
    origin:
      type:
      - string
      - 'null'
      maxLength: 150
      description: >-
        (1.18.0, AC-AGT-02) Thành phố đi, đúng giá trị `attributes.originCity` của tuyến bay trong catalog. Tuỳ chọn:
        vắng mặt tương đương null; null thì lịch trình không có chặng bay. Web gợi ý từ vị trí trình duyệt chỉ gửi tên
        thành phố, không gửi toạ độ (AC-AGT-03).
TripIntentPatch:
  type: object
  description: Chỉ các trường người dùng sửa bằng chip; trường vắng mặt nghĩa là không đổi.
  minProperties: 1
  properties:
    destination:
      type: string
    startDate:
      type:
      - string
      - 'null'
      format: date
    days:
      type: integer
      minimum: 1
      maximum: 7
    party:
      $ref: ../openapi.yaml#/components/schemas/Party
    budget:
      type:
      - integer
      - 'null'
      minimum: 0
    interests:
      type: array
      items:
        type: string
    pace:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/Pace
      - type: 'null'
    origin:
      type: string
      minLength: 1
      maxLength: 150
      description: (1.18.0) Thành phố đi; chỉ gửi tên thành phố, không gửi toạ độ.
ItineraryRequest:
  type: object
  description: Baseline tích hợp 1.1.0. Cần message, intentOverride hoặc selectStayOption (1.20.0); intentOverride và
    selectStayOption yêu cầu conversationId khác null.
  properties:
    conversationId:
      type:
      - string
      - 'null'
    message:
      type:
      - string
      - 'null'
      minLength: 1
      maxLength: 1000
    intentOverride:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/TripIntentPatch
      - type: 'null'
    selectStayOption:
      description: >-
        (1.20.0, AC-AGT-04) Chọn một phương án trong `stayOptions` của câu trả lời gần nhất của hội thoại (người dùng bấm
        "Đổi sang khách sạn này"; lượt này không có message trả về). Lịch đổi đúng như phương án đã báo, không tìm lại
        sản phẩm. Cần conversationId; không cần message. index không còn trong phương án đã lưu thì backend xử lý như một
        lượt nhắn thường.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - index
        properties:
          index:
            type: integer
            minimum: 1
            maximum: 3
      - type: 'null'
    context:
      type: object
      properties:
        language:
          type: string
          enum:
          - vi
          - en
          default: vi
          description: Ngôn ngữ phản hồi. Khi context hoặc language vắng mặt, backend dùng vi; giá trị được lưu theo conversation.
  anyOf:
  - required:
    - message
    properties:
      message:
        type: string
  - required:
    - conversationId
    - intentOverride
    properties:
      conversationId:
        type: string
      intentOverride:
        $ref: ../openapi.yaml#/components/schemas/TripIntentPatch
  - required:
    - conversationId
    - selectStayOption
    properties:
      conversationId:
        type: string
      selectStayOption:
        type: object
ItinerarySlot:
  type: object
  required:
  - time
  - product
  - note
  properties:
    slotId:
      type: string
    time:
      $ref: ../openapi.yaml#/components/schemas/SlotTime
    startTime:
      type:
      - string
      - 'null'
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    endTime:
      type:
      - string
      - 'null'
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    activityType:
      description: Chỉ khác null khi product là null.
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/ActivityType
      - type: 'null'
    product:
      description: null nghĩa là ActivityNote (không giá, không nút).
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/ProductSummary
      - type: 'null'
    note:
      type:
      - string
      - 'null'
      maxLength: 160
    source:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/ItemSource
      - type: 'null'
    because:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/BecauseItem
      description: Tùy chọn; giữ lại khi hiển thị lý do cá nhân hóa, thiếu tương đương [].
  allOf:
  - if:
      properties:
        product:
          type: 'null'
      required:
      - product
    then:
      properties:
        activityType:
          $ref: ../openapi.yaml#/components/schemas/ActivityType
        source:
          type: 'null'
        because:
          maxItems: 0
      required:
      - activityType
    else:
      properties:
        activityType:
          type: 'null'
        source:
          $ref: ../openapi.yaml#/components/schemas/ItemSource
ItineraryStay:
  type: object
  required:
  - product
  - nights
  properties:
    product:
      $ref: ../openapi.yaml#/components/schemas/ProductSummary
    nights:
      type: integer
      minimum: 1
    fromNight:
      type: integer
      minimum: 1
      description: >-
        (1.19.0, AC-AGT-04) Đêm đầu tiên ở khách sạn này, đếm từ 1 (đêm của ngày 1). Khách sạn ở các đêm
        fromNight .. fromNight + nights − 1. Backend luôn gửi từ 1.19.0; client coi vắng mặt là 1.
    rooms:
      type: integer
      minimum: 1
      maximum: 9
      description: >-
        (1.23.0, AC-AGT-04) Số phòng cho cả đoàn ở khách sạn này = ceil(số người lớn / attributes.priceAdults của khách
        sạn); trẻ em ở cùng phòng người lớn. Khách sạn thiếu priceAdults tính 1 phòng, kèm cảnh báo STAY_ROOMS_UNKNOWN.
        Tiền khách sạn = giá × nights × rooms. Backend luôn gửi từ 1.23.0; client coi vắng mặt là 1.
    note:
      type:
      - string
      - 'null'
      maxLength: 160
    source:
      $ref: ../openapi.yaml#/components/schemas/ItemSource
    because:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/BecauseItem
FlightDirection:
  type: string
  description: (1.18.0) Chặng của vé trong lịch trình; ROUND_TRIP là một vé khứ hồi phủ cả hai chặng.
  enum:
  - OUTBOUND
  - RETURN
  - ROUND_TRIP
ItineraryFlight:
  type: object
  description: >-
    (1.18.0, AC-AGT-02) Một vé máy bay trong lịch trình. Backend chọn bằng luật tất định từ chuyến bay thật của catalog
    (tầng con của tuyến), không do LLM tạo. Giá tính vào estimatedTotal bằng unitPrice × passengers.
  required:
  - product
  - direction
  - date
  - passengers
  - source
  properties:
    product:
      $ref: ../openapi.yaml#/components/schemas/ProductSummary
    direction:
      $ref: ../openapi.yaml#/components/schemas/FlightDirection
    date:
      type: string
      format: date
      description: Ngày bay của chặng đi (OUTBOUND, ROUND_TRIP) hoặc chặng về (RETURN).
    returnDate:
      type:
      - string
      - 'null'
      format: date
      description: Ngày bay chặng về; chỉ khác null khi direction là ROUND_TRIP.
    passengers:
      type: integer
      minimum: 1
      description: Số khách (người lớn + trẻ em) dùng để tính tiền vé.
    source:
      $ref: ../openapi.yaml#/components/schemas/ItemSource
ItineraryDay:
  type: object
  required:
  - day
  - slots
  properties:
    day:
      type: integer
      minimum: 1
    date:
      type:
      - string
      - 'null'
      format: date
    title:
      type: string
    slots:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/ItinerarySlot
ItineraryPlan:
  type: object
  required:
  - days
  - estimatedTotal
  - currency
  - budgetStatus
  properties:
    title:
      type: string
    stay:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/ItineraryStay
      - type: 'null'
    stays:
      type: array
      minItems: 1
      maxItems: 2
      description: >-
        (1.19.0, AC-AGT-04) Khách sạn theo đêm, sắp theo fromNight; hai mục khi lịch trình đổi khách sạn giữa chuyến
        (chuyến từ 5 ngày, mỗi khách sạn ít nhất 2 đêm). Tổng nights = max(1, days − 1). `stay` luôn bằng stays[0] để
        client cũ vẫn chạy; vắng mặt khi không có khách sạn. estimatedTotal cộng giá × nights × rooms của từng khách sạn
        (rooms từ 1.23.0).
      items:
        $ref: ../openapi.yaml#/components/schemas/ItineraryStay
    flights:
      type: array
      maxItems: 2
      description: >-
        (1.18.0, AC-AGT-02) Vé máy bay của chuyến: một vé ROUND_TRIP, hoặc OUTBOUND và/hoặc RETURN. Vắng mặt hoặc rỗng
        khi không đủ điều kiện có chặng bay; lý do nằm trong warnings (mã FLIGHT_*).
      items:
        $ref: ../openapi.yaml#/components/schemas/ItineraryFlight
    days:
      type: array
      minItems: 1
      items:
        $ref: ../openapi.yaml#/components/schemas/ItineraryDay
    bookableCount:
      type: integer
      minimum: 0
      description: Số mục ứng viên checkout demo có available=true và giá khác null, loại ticketed=false
        và bản ghi cha khi đã chọn con; không xác nhận tồn kho.
    estimatedTotal:
      type:
      - integer
      - 'null'
      minimum: 0
      description: Backend tính tổng khi đủ đơn vị/số lượng; thiếu thì null, budgetStatus UNKNOWN và warning.
        Không bỏ qua khoản chưa biết. Điểm tham quan tự do (attraction/golf có ticketed=false hoặc unitPrice null)
        tính 0 vào tổng, kèm warning FREE_ENTRY_ASSUMED.
    costBreakdown:
      $ref: ../openapi.yaml#/components/schemas/ItineraryCostBreakdown
    currency:
      $ref: ../openapi.yaml#/components/schemas/Currency
    budgetStatus:
      $ref: ../openapi.yaml#/components/schemas/BudgetStatus
    priceAsOf:
      type:
      - string
      - 'null'
      format: date-time
      description: Thời điểm quan sát giá nguồn chung; null nếu thiếu hoặc khác nhau. Không dùng generatedAt
        thay thời điểm giá.
  allOf:
  - if:
      properties:
        estimatedTotal:
          type: 'null'
      required:
      - estimatedTotal
    then:
      properties:
        budgetStatus:
          const: UNKNOWN
SearchResultsByTaxonomy:
  type: object
  propertyNames:
    $ref: ../openapi.yaml#/components/schemas/Taxonomy
  additionalProperties:
    type: array
    maxItems: 6
    items:
      $ref: ../openapi.yaml#/components/schemas/ProductSummary
ExplorationSearchResults:
  type: object
  description: >-
    (1.28.0, AC-AGT-06) Số lượng theo yêu cầu, tổng tối đa 20 thẻ do backend kiểm. Không nêu số lượng:
    tối đa 3 điểm tham quan/tour, 2 khách sạn hỏi chung hoặc 4 khi chỉ hỏi chỗ ở. Thiếu dữ liệu/ngân sách thực thi
    thì trả số thực chọn và giải thích trong question. Không áp dụng cho lịch trình đã xếp.
  propertyNames:
    $ref: ../openapi.yaml#/components/schemas/Taxonomy
  properties:
    flight:
      type: array
      maxItems: 4
      items:
        $ref: ../openapi.yaml#/components/schemas/ProductSummary
  additionalProperties:
    type: array
    maxItems: 20
    items:
      $ref: ../openapi.yaml#/components/schemas/ProductSummary
ItineraryWarning:
  type: object
  required:
  - code
  - message
  properties:
    code:
      type: string
      description: Ví dụ PRODUCT_DROPPED_UNAVAILABLE, DAY_WITHOUT_PRODUCTS, OVER_BUDGET.
    message:
      type: string
    productId:
      type:
      - string
      - 'null'
ItineraryMetadata:
  type: object
  required:
  - personalised
  - searchRequestIds
  - generatedAt
  - requestId
  properties:
    personalised:
      type: boolean
    searchRequestIds:
      type: array
      items:
        type: string
    generatedAt:
      type: string
      format: date-time
    requestId:
      type: string
ItineraryStayOption:
  type: object
  required:
  - index
  - kmDelta
  - moneyDelta
  - itinerary
  description: >-
    (1.20.0, AC-AGT-04) Một phương án khác của lịch trình: lịch đầy đủ khi đổi khách sạn (để client xem trước không gọi
    server) và đánh đổi so với lịch đang chọn. Mọi số do backend tính.
  properties:
    index:
      type: integer
      minimum: 1
      maximum: 3
      description: Số thứ tự để chọn (`selectStayOption.index`, "lấy phương án N").
    kmDelta:
      type: number
      description: Chênh quãng đường cả chuyến so với lịch đang chọn, km đường chim bay; âm là đi ít hơn.
    moneyDelta:
      type: integer
      description: Chênh tổng tiền so với lịch đang chọn (VND); âm là rẻ hơn.
    overBudget:
      type:
      - integer
      - 'null'
      minimum: 0
      description: Số tiền vượt ngân sách; null khi không vượt hoặc không có ngân sách.
    itinerary:
      $ref: ../openapi.yaml#/components/schemas/ItineraryPlan
ItineraryStayOptions:
  type: object
  required:
  - distanceKm
  - options
  description: >-
    (1.20.0, AC-AGT-04) Mục "Phương án khác" dạng hàng thẻ: tổng km của lịch đang chọn và tối đa 3 phương án. Vắng mặt
    khi không có phương án nào.
  properties:
    distanceKm:
      type: number
      minimum: 0
      description: Quãng đường cả chuyến của lịch đang chọn (`itinerary`), km đường chim bay.
    options:
      type: array
      minItems: 1
      maxItems: 3
      items:
        $ref: ../openapi.yaml#/components/schemas/ItineraryStayOption
ItineraryCostBreakdown:
  type: object
  required:
  - flights
  - stays
  - activities
  description: >-
    (1.21.0, user-flow §4.2 "Ngân sách dự tính") estimatedTotal chia theo nhóm sản phẩm; flights + stays + activities =
    estimatedTotal. Có khi estimatedTotal khác null, vắng mặt khi tổng chưa biết. Chỉ gồm sản phẩm trong lịch: không có
    khoản ăn uống hay đi lại ước tính.
  properties:
    flights:
      type: integer
      minimum: 0
      description: Vé máy bay, unitPrice × passengers của từng vé.
    stays:
      type: integer
      minimum: 0
      description: Khách sạn, giá × số đêm × số phòng (`rooms`, 1.23.0) của từng khách sạn.
    activities:
      type: integer
      minimum: 0
      description: Tour, điểm tham quan, golf trong các ngày; điểm tham quan tự do tính 0.
ItineraryCompleted:
  type: object
  required:
  - status
  - conversationId
  - itinerary
  - warnings
  properties:
    status:
      type: string
      const: COMPLETED
    conversationId:
      type: string
    intent:
      allOf:
      - $ref: ../openapi.yaml#/components/schemas/TripIntent
      - properties:
          destination:
            type: string
            minLength: 1
          days:
            type: integer
            minimum: 1
            maximum: 7
    itinerary:
      $ref: ../openapi.yaml#/components/schemas/ItineraryPlan
    message:
      type: string
      description: >-
        Lời diễn giải lịch trình hiển thị trong khung chat. Dòng đầu có dạng `**Tiêu đề**` (markdown in đậm), các
        mục sau mở đầu bằng một dòng in đậm. Khi lượt này đổi thông tin chuyến đi, câu ngay sau tiêu đề ghi nhận
        thay đổi đó. Sản phẩm chỉ được nhắc bằng link `[Tên](product:<productId>)`, với `productId` có trong
        `itinerary` và tên sao chép từ dữ liệu; giá trong câu lấy từ dữ liệu sản phẩm và `estimatedTotal`. Không có
        trường này thì client hiển thị `itinerary.title`.
    searchResults:
      description: >-
        Gói hoặc tour nhiều ngày (vé dùng 2 ngày trở lên, tour 3N2Đ...) tìm được nhưng không xếp vào một buổi của
        lịch trình, để người dùng cân nhắc riêng; `message` có mục hỏi người dùng có muốn thêm không. Không tính vào
        `estimatedTotal`.
      allOf:
      - $ref: ../openapi.yaml#/components/schemas/SearchResultsByTaxonomy
    stayOptions:
      $ref: ../openapi.yaml#/components/schemas/ItineraryStayOptions
    suggestions:
      type: array
      maxItems: 3
      description: >-
        Tuỳ chọn (1.25.0, FR-AGT-06). Câu yêu cầu gửi được nguyên văn làm lượt chat kế tiếp, cùng ngữ nghĩa với
        `ItineraryNeedsClarification.suggestions`. Ví dụ lịch tham khảo khi ngày đi chưa mở bán: nút "Đi Phú Quốc 3 ngày
        từ ngày 28/10/2026" để lập lại lịch đặt được ngay.
      items:
        type: string
    warnings:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/ItineraryWarning
    metadata:
      $ref: ../openapi.yaml#/components/schemas/ItineraryMetadata
ItineraryNeedsClarification:
  type: object
  required:
  - status
  - conversationId
  - question
  properties:
    status:
      type: string
      const: NEEDS_CLARIFICATION
    conversationId:
      type: string
    question:
      type: string
      description: >-
        Câu hỏi hiển thị cho người dùng. Dòng đầu có dạng `**Tiêu đề**` (markdown in đậm) tóm tắt cả câu, các dòng
        sau là phần chi tiết: lý do và gợi ý khi một giá trị không hợp lệ (ngày đi đã qua, điểm đến ngoài catalog,
        số ngày, số người hoặc ngân sách ngoài giới hạn), hoặc câu hỏi cụ thể khi còn thiếu thông tin. Câu trả
        lời chào hỏi, cảm ơn không có tiêu đề.
    missingFields:
      type: array
      minItems: 1
      items:
        type: string
        enum:
        - destination
        - days
        - startDate
        - party
        - budget
        - origin
    knownIntent:
      $ref: ../openapi.yaml#/components/schemas/TripIntent
    suggestedValues:
      type: object
      properties:
        destination:
          type: array
          items:
            type: string
        days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
    clarificationForm:
      type: object
      description: Form gợi ý hiển thị trong khung chat khi hỏi bằng câu chữ một lượt vẫn chưa đủ thông tin.
      required:
      - fields
      - defaults
      properties:
        fields:
          type: array
          minItems: 1
          description: >-
            Ô hiển thị theo thứ tự. `interests` (1.24.0, FR-AGT-06; 1.26.0 AC-AGT-01): không bắt buộc, gồm các lựa
            chọn cố định trong `interestOptions` (chọn nhiều, tích sẵn theo `defaults.interests`) và một ô tự nhập tối
            đa 150 ký tự, điền sẵn bằng phần `defaults.interests` không thuộc `interestOptions`.
          items:
            type: string
            enum:
            - destination
            - days
            - startDate
            - party
            - budget
            - origin
            - interests
        defaults:
          $ref: ../openapi.yaml#/components/schemas/TripIntent
        startDateMin:
          type: string
          format: date
          description: Ngày khởi hành sớm nhất được phép chọn; hôm nay theo giờ Việt Nam.
        autoOpen:
          type: boolean
          description: Tuỳ chọn (1.26.0). Mở ngay khi người dùng trực tiếp xin form; mặc định chỉ hiện nút mở.
        interestOptions:
          type: array
          maxItems: 8
          description: >-
            Tuỳ chọn (1.24.0, FR-AGT-06). Nhãn sở thích khách sạn đã có dữ liệu (ví dụ "Hồ bơi", "Phù hợp trẻ nhỏ"). Sở
            thích là ưu tiên khi tìm khách sạn, không loại khách sạn thiếu dữ liệu tiện ích. Client ghép lựa chọn vào câu
            xác nhận ("ưu tiên khách sạn có Hồ bơi, Phù hợp trẻ nhỏ"); nội dung ô tự nhập đi sau đó (1.26.0).
          items:
            type: string
    suggestions:
      type: array
      maxItems: 3
      description: >-
        Tuỳ chọn (1.13.0). Câu yêu cầu gửi được nguyên văn làm lượt chat kế tiếp, cùng ngữ nghĩa với
        `ItineraryNoResults.suggestions`. Có khi điều kiện bắt buộc (khách sạn, khách sạn hoặc hoạt động cụ thể)
        không có sản phẩm nào đáp ứng, ví dụ ngày khởi hành gần nhất còn bán hoặc lập lịch không cần khách sạn.
        Từ 1.24.0 còn có ở lượt trò chuyện và khám phá (FR-AGT-06): tối đa 3 nút theo các hướng khác nhau (đi tiếp
        như lập lịch, xem sâu, đổi hướng), không lặp nút của lượt trước.
      items:
        type: string
    searchResults:
      description: >-
        Tuỳ chọn (1.24.0, FR-AGT-06). Lượt khám phá trước khi lập lịch ("Hà Nội có gì?", "khách sạn nào có hồ bơi?"):
        sản phẩm thật lấy từ Search của chính lượt này, nhóm theo loại. Từ 1.28.0 số lượng theo AC-AGT-06,
        tổng tối đa 20 thẻ/lượt; `flight` giữ tối đa 4. `question` nhắc từng sản
        phẩm bằng link `[Tên](product:<productId>)` với `productId` có trong đây; client đặt thẻ ngay sau dòng đầu tiên
        nhắc sản phẩm, như lời diễn giải lịch trình. Không có trường này thì lượt hỏi lại như trước.
        Từ 1.25.0 còn có ở lượt hỏi giá vé máy bay (FR-AGT-07): `flight` là các chuyến một chiều thật của tuyến được hỏi,
        lấy từ catalog (danh sách chuyến của tuyến), tối đa 4, chuyến `question` nêu đầu tiên đứng đầu (thường mỗi
        chuyến một ngày bay; hỏi một ngày cụ thể thì có thể nhiều chuyến cùng ngày). Client gom các chuyến này thành một
        hàng thẻ ngày–giá đặt tại dòng đầu tiên nhắc chuyến, mỗi thẻ mở trang vé máy bay của đúng tuyến và ngày bay đó.
      allOf:
      - $ref: ../openapi.yaml#/components/schemas/ExplorationSearchResults
    metadata:
      $ref: ../openapi.yaml#/components/schemas/ItineraryMetadata
