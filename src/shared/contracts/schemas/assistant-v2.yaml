AssistantV2Event:
  description: Safe SSE envelope. Sequence and terminal cardinality checked by runtime/consumer.
  oneOf:
  - $ref: ../assistant-v2.openapi.yaml#/components/schemas/EventStart
  - $ref: ../assistant-v2.openapi.yaml#/components/schemas/EventActivity
  - $ref: ../assistant-v2.openapi.yaml#/components/schemas/EventToolCompleted
  - $ref: ../assistant-v2.openapi.yaml#/components/schemas/EventPreview
  - $ref: ../assistant-v2.openapi.yaml#/components/schemas/EventFinal
  - $ref: ../assistant-v2.openapi.yaml#/components/schemas/EventError
  discriminator:
    propertyName: event
    mapping:
      start: ../assistant-v2.openapi.yaml#/components/schemas/EventStart
      activity: ../assistant-v2.openapi.yaml#/components/schemas/EventActivity
      tool-completed: ../assistant-v2.openapi.yaml#/components/schemas/EventToolCompleted
      preview: ../assistant-v2.openapi.yaml#/components/schemas/EventPreview
      final: ../assistant-v2.openapi.yaml#/components/schemas/EventFinal
      error: ../assistant-v2.openapi.yaml#/components/schemas/EventError
