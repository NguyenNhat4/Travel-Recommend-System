ErrorCode:
  type: string
  enum:
  - VALIDATION_ERROR
  - CART_EMPTY
  - INVALID_CREDENTIALS
  - INVALID_TOKEN
  - TOKEN_EXPIRED
  - PRODUCT_NOT_FOUND
  - CART_ITEM_NOT_FOUND
  - BOOKING_NOT_FOUND
  - NOT_FOUND
  - EMAIL_ALREADY_EXISTS
  - PRODUCT_UNAVAILABLE
  - PRICE_CHANGED
  - DATE_OUT_OF_RANGE
  - SEARCH_UNAVAILABLE
  - INTERNAL_ERROR
  - INVALID_TRIP_DURATION
  - CONVERSATION_NOT_FOUND
  - UNSUPPORTED_DESTINATION
  - LLM_UNAVAILABLE
  - ITINERARY_VALIDATION_FAILED
  - AVAILABILITY_NOT_FOUND
  - AVAILABILITY_EXPIRED
  - NO_RATE_PLAN
  - MIN_STAY_NOT_MET
  - CLOSED_ON_ARRIVAL
  - CLOSED_ON_DEPARTURE
  - PARTIALLY_AVAILABLE
  - PRODUCT_NOT_INDEXED
  - UNAUTHENTICATED
  - SESSION_EXPIRED
  - CSRF_FAILED
  - MFA_REQUIRED
  - MFA_INVALID
  - EMAIL_NOT_VERIFIED
  - TOO_MANY_ATTEMPTS
  - CAPTCHA_REQUIRED
  - CAPTCHA_FAILED
  - WEAK_PASSWORD
  - INVALID_VERIFICATION_TOKEN
  - OAUTH_EMAIL_UNVERIFIED
  - OAUTH_ALREADY_LINKED
  - CDP_UNAVAILABLE
  - BOOKING_PENDING_PAYMENT
  - BOOKING_ALREADY_PAID
  - BOOKING_NOT_CANCELLABLE
  - PAYMENT_PROVIDER_UNAVAILABLE
  - INVALID_WEBHOOK_SIGNATURE
  - DIRECT_BOOKING_ONLY
  - BOOKING_DRAFT_NOT_FOUND
  - BOOKING_DRAFT_EXPIRED
  - DATABASE_UNAVAILABLE
  - TURN_IN_PROGRESS
  - IDEMPOTENCY_CONFLICT
  - PLAN_REVISION_CONFLICT
ErrorResponse:
  type: object
  required:
  - error
  properties:
    error:
      type: object
      required:
      - code
      - message
      - retryable
      - requestId
      properties:
        code:
          $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorCode
        message:
          type: string
          description: Tiếng Việt, hiển thị được trực tiếp cho người dùng.
        retryable:
          type: boolean
          description: Existing project retryability; TURN_IN_PROGRESS true with Retry-After, IDEMPOTENCY_CONFLICT/PLAN_REVISION_CONFLICT
            false.
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
          description: 'Tùy mã lỗi. VALIDATION_ERROR {fields: ValidationFieldError[]}; PRODUCT_NOT_FOUND và PRODUCT_UNAVAILABLE
            {productId}; CART_ITEM_NOT_FOUND {cartItemId}; PRICE_CHANGED {productId, oldPrice, newPrice, fareType?}
            — fareType là CHILD khi giá vé trẻ em đổi; DATE_OUT_OF_RANGE {productId, availableFrom, availableTo};
            UNSUPPORTED_DESTINATION {destination, supportedDestinations, conversationId} — conversationId là hội
            thoại đã lưu phần chuyến đi còn lại, gửi lại cùng điểm đến hợp lệ để tiếp tục; MIN_STAY_NOT_MET {productId,
            minStay}; PRODUCT_NOT_INDEXED {productId, taxonomy}; TOO_MANY_ATTEMPTS {retryAfterSeconds}; MFA_INVALID
            {attemptsLeft}; EMAIL_NOT_VERIFIED {email}; WEAK_PASSWORD {reasons}; INVALID_VERIFICATION_TOKEN {purpose};
            OAUTH_EMAIL_UNVERIFIED và OAUTH_ALREADY_LINKED {provider}; BOOKING_PENDING_PAYMENT {referenceCode, holdExpiresAt}
            — đơn đang giữ chỗ để tiếp tục hoặc huỷ; BOOKING_NOT_CANCELLABLE {referenceCode, reason, cancellableUntil};
            BOOKING_ALREADY_PAID {referenceCode}; DIRECT_BOOKING_ONLY {productId, taxonomy}; BOOKING_DRAFT_EXPIRED
            {draftId, items: [{productId, taxonomy, inCart}]}; PRODUCT_UNAVAILABLE khi tạo đơn nháp mà không mục
            nào được nhận {rejectedItems}.'
ProgressCounts:
  type: object
  description: Separate source, eligibility, orc selection and displayed counts.
  additionalProperties: false
  required:
  - found
  - eligible
  - selected
  - displayed
  properties:
    found:
      type: integer
      description: Code-counted found for this group, not model-provided or accumulated across replacements.
      minimum: 0
    eligible:
      type: integer
      description: Code-counted eligible for this group, not model-provided or accumulated across replacements.
      minimum: 0
    selected:
      type: integer
      description: Code-counted selected for this group, not model-provided or accumulated across replacements.
      minimum: 0
    displayed:
      type: integer
      description: Code-counted displayed for this group, not model-provided or accumulated across replacements.
      minimum: 0
ActivityData:
  type: object
  description: Actual Think/Act/Observe progress; explanation is a checked public decision summary, never internal reasoning or raw model output.
  additionalProperties: false
  required:
  - groupId
  - kind
  - status
  - taxonomy
  - counts
  properties:
    groupId:
      type: string
      description: Stable group identity, replace its state rather than cumulatively append counts.
      minLength: 1
    kind:
      type: string
      description: Actual work requested, no predetermined next steps.
      enum:
      - think
      - search
      - recommend
      - similar
      - detail
      - destinations
      - catalog
      - flights
      - itinerary
      - answer
    status:
      type: string
      description: Actual lifecycle of this activity.
      enum:
      - running
      - completed
      - failed
      - partial
    taxonomy:
      description: Optional taxonomy for this activity.
      oneOf:
      - $ref: ../assistant-v2.openapi.yaml#/components/schemas/Taxonomy
      - type: 'null'
    counts:
      $ref: ../assistant-v2.openapi.yaml#/components/schemas/ProgressCounts
    explanation:
      type: string
      minLength: 1
      maxLength: 400
      description: Checked public explanation for a think activity; authored with the existing model decision. No raw facts, queries, secrets or internal reasoning.
    destination:
      type: string
      description: Destination from the checked tool arguments, when present.
    outcome:
      type: string
      description: Actual source outcome; empty differs from error and needs_input.
      enum: [ok, empty, partial, needs_input, error]
EventStart:
  type: object
  description: One start event; final/error are terminal and only one terminal event is emitted.
  additionalProperties: false
  required:
  - event
  - runId
  - sequence
  - data
  properties:
    event:
      type: string
      description: SSE event name.
      const: start
    runId:
      type: string
      description: Run identity; ignore events of another active run.
      minLength: 1
    sequence:
      type: integer
      description: Strictly increasing per run; ignore duplicate or stale sequences.
      minimum: 1
    data:
      type: object
      description: Start of a run.
      additionalProperties: false
      required:
      - conversationId
      - clientTurnId
      - planRevision
      properties:
        conversationId:
          type: string
          description: Conversation for this turn.
          minLength: 1
        clientTurnId:
          type: string
          description: Caller idempotency ID.
          minLength: 1
        planRevision:
          type: integer
          description: Committed revision at turn start.
          minimum: 0
