# booking.yaml — giỏ hàng, checkout, đơn đặt chỗ, đoàn khách và giá theo loại khách (contract 1.11.0)
#
# Đoàn khách và dòng giá: docs/spec/booking/checkout-nhieu-buoc-hanh-khach.md §4–§7 (FR-BKG-08).
# 1.11.0 thêm giấy tờ hành khách cho vé máy bay (FR-BKG-13): `documents` tuỳ chọn trong schema, bắt buộc theo luật khi giỏ có vé bay.
# Mọi trường thêm ở 1.10.0 đều tuỳ chọn trong v1 (docs/prd/api-contract.md §3.2): client cũ không thấy khác biệt.
TravelerType:
  type: string
  enum:
  - ADULT
  - CHILD
  description: ADULT từ 12 tuổi; CHILD dưới 12 tuổi tại ngày sử dụng sớm nhất của đơn (bắt buộc có ngày sinh).
FareType:
  type: string
  enum:
  - ADULT
  - CHILD
  - ROOM
  - PACKAGE
  description: >-
    Loại giá của một dòng giá. ADULT, CHILD cho dịch vụ tính theo người (vé máy bay, vé tham quan, golf); ROOM cho khách
    sạn (giá phòng-đêm); PACKAGE cho combo (giá theo gói).
GuestCounts:
  type: object
  description: >-
    Số người lớn và số trẻ em của một mục giỏ, tính theo loại giá tại ngày sử dụng của mục (trẻ em đã tròn 12 tuổi tính là
    người lớn). Không chứa tên. Tối đa 9 khách mỗi mục.
  required:
  - adults
  - children
  properties:
    adults:
      type: integer
      minimum: 1
      maximum: 9
    children:
      type: integer
      minimum: 0
      maximum: 8
FareLine:
  type: object
  description: Một loại giá trong một dịch vụ. Thành tiền của mục bằng tổng amount các dòng giá của mục.
  required:
  - fareType
  - unitPrice
  - count
  - nights
  - amount
  properties:
    fareType:
      $ref: ../openapi.yaml#/components/schemas/FareType
    unitPrice:
      type: integer
      minimum: 0
      description: VND cho 1 khách, 1 phòng-đêm hoặc 1 gói.
    count:
      type: integer
      minimum: 1
    nights:
      type:
      - integer
      - 'null'
      minimum: 1
      description: Chỉ khác null khi fareType là ROOM.
    amount:
      type: integer
      minimum: 0
      description: unitPrice × count × (nights hoặc 1).
TravelerTitle:
  type: string
  enum:
  - MR
  - MRS
  - MS
  - MSTR
  - MISS
  description: Danh xưng in trên vé. MR, MRS, MS (Ông, Bà, Cô) cho người lớn; MSTR, MISS (Bé trai, Bé gái) cho trẻ em và em bé.
TravelerNationality:
  type: string
  enum:
  - VN
  - KR
  - CN
  - JP
  - US
  - AU
  - FR
  - OTHER
  description: Quốc tịch hành khách. OTHER là quốc tịch khác các nước liệt kê.
TravelerDocType:
  type: string
  enum:
  - CCCD
  - PASSPORT
  description: Loại giấy tờ của người lớn. CCCD chỉ dành cho quốc tịch VN; quốc tịch khác dùng PASSPORT.
TravelerDocuments:
  type: object
  description: >-
    Thông tin hãng bay yêu cầu (FR-BKG-13), khai một lần ở bước Hành khách và dùng cho mọi chặng. Bắt buộc theo luật khi giỏ
    có vé máy bay (Backend kiểm, lỗi REQUIRED). Chỉ mô phỏng, không dùng để xuất vé thật. Số giấy tờ chỉ lưu ở Backend, response
    trả 4 số cuối; không gửi sang CDP, Insider, Stripe.
  properties:
    title:
      $ref: ../openapi.yaml#/components/schemas/TravelerTitle
    nationality:
      $ref: ../openapi.yaml#/components/schemas/TravelerNationality
    docType:
      anyOf:
      - $ref: ../openapi.yaml#/components/schemas/TravelerDocType
      - type: 'null'
      description: Chỉ người lớn. Trẻ em và em bé dùng giấy khai sinh nên không gửi.
    docNumber:
      type:
      - string
      - 'null'
      maxLength: 20
      description: Chỉ người lớn. CCCD gồm 12 chữ số; hộ chiếu gồm 6–9 chữ và số.
    docExpiry:
      type:
      - string
      - 'null'
      format: date
      description: Chỉ khi docType là PASSPORT; phải sau ngày bay cuối cùng của đơn.
    escortTravelerRef:
      type:
      - string
      - 'null'
      maxLength: 64
      description: Chỉ em bé (dưới 2 tuổi tại ngày bay). travelerRef của người lớn đi kèm; mỗi người lớn đi kèm tối đa 1 em bé.
BookingTravelerDocuments:
  type: object
  description: Giấy tờ của hành khách trong response. Không có số giấy tờ đầy đủ và không có ngày hết hạn.
  required:
  - title
  - nationality
  properties:
    title:
      $ref: ../openapi.yaml#/components/schemas/TravelerTitle
    nationality:
      $ref: ../openapi.yaml#/components/schemas/TravelerNationality
    docType:
      anyOf:
      - $ref: ../openapi.yaml#/components/schemas/TravelerDocType
      - type: 'null'
    docNumberLast4:
      type:
      - string
      - 'null'
      description: 4 ký tự cuối của số giấy tờ.
CheckoutTraveler:
  type: object
  description: >-
    Một người trong đoàn khách, khai một lần ở bước Hành khách. Họ tên nhập ở hai ô; Backend nối thành họ tên đầy đủ.
    Ngày sinh chỉ lưu ở Backend, không bao giờ có trong response và không gửi sang CDP, Insider, Stripe.
  required:
  - travelerRef
  - type
  - surname
  - givenNames
  properties:
    travelerRef:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,36}$
      description: Mã tạm do Web sinh, duy nhất trong request; các dịch vụ tham chiếu người này bằng mã này.
    type:
      $ref: ../openapi.yaml#/components/schemas/TravelerType
    surname:
      type: string
      minLength: 1
      maxLength: 50
      description: Họ. Chỉ gồm chữ cái (kể cả tiếng Việt có dấu), khoảng trắng, dấu nháy đơn và gạch nối.
    givenNames:
      type: string
      minLength: 1
      maxLength: 50
      description: Tên đệm và tên. Cùng quy tắc ký tự với surname.
    birthDate:
      type:
      - string
      - 'null'
      format: date
      description: Bắt buộc khi type là CHILD, và khi type là ADULT mà giỏ có vé máy bay (Backend kiểm, lỗi REQUIRED). Giỏ không có vé bay thì người lớn không cần ngày sinh.
    documents:
      $ref: ../openapi.yaml#/components/schemas/TravelerDocuments
CheckoutRoom:
  type: object
  description: Ai ở một phòng của mục khách sạn.
  required:
  - travelerRefs
  - leadTravelerRef
  properties:
    travelerRefs:
      type: array
      minItems: 1
      maxItems: 9
      items:
        type: string
    leadTravelerRef:
      type: string
      description: Người lớn đại diện nhận phòng; phải là người lớn ở trong phòng này.
BookingTraveler:
  type: object
  description: Một hành khách của một mục đơn. Không có ngày sinh để response trả ít dữ liệu cá nhân nhất có thể.
  required:
  - fullName
  - type
  - roomNo
  - isLead
  properties:
    fullName:
      type: string
    type:
      $ref: ../openapi.yaml#/components/schemas/TravelerType
    roomNo:
      type:
      - integer
      - 'null'
      minimum: 1
      description: Chỉ khác null với khách sạn.
    isLead:
      type: boolean
      description: Người đại diện nhận phòng. Luôn false với loại dịch vụ khác.
    documents:
      $ref: ../openapi.yaml#/components/schemas/BookingTravelerDocuments
AddCartItemRequest:
  type: object
  description: >-
    Thêm trùng productId và usingDate thì cộng dồn quantity và guests; kết quả sau khi cộng vẫn phải đạt luật (tối đa 9 khách,
    mỗi phòng một người lớn, không vượt maxOccupancy). Không gửi guests (client cũ): khách sạn và dịch vụ tính theo người mặc
    định mỗi phòng/vé một người lớn; combo mặc định 1 người lớn.
  required:
  - productId
  - usingDate
  anyOf:
  - required:
    - quantity
  - required:
    - guests
  properties:
    productId:
      type: string
    usingDate:
      type: string
      format: date
    quantity:
      type: integer
      minimum: 1
      description: >-
        Số phòng (khách sạn), số gói (combo) hoặc số vé. Dịch vụ tính theo người (vé máy bay, tham quan, golf) gửi guests
        thì được bỏ quantity; gửi cả hai mà lệch adults + children thì bị từ chối (GUEST_COUNT_MISMATCH).
    nights:
      type:
      - integer
      - 'null'
      minimum: 1
      description: Chỉ dùng với taxonomy hotel; loại khác bị bỏ qua.
    guests:
      $ref: ../openapi.yaml#/components/schemas/GuestCounts
UpdateCartItemRequest:
  type: object
  minProperties: 1
  description: >-
    Sửa một mục giỏ và ghi lại giá snapshot bằng giá hiện tại (khách đã thấy giá mới). Chỉ đổi quantity của mục đang có trẻ
    em thì giữ nguyên children và đặt adults = quantity − children.
  properties:
    usingDate:
      type: string
      format: date
    quantity:
      type: integer
      minimum: 1
    nights:
      type:
      - integer
      - 'null'
      minimum: 1
    guests:
      $ref: ../openapi.yaml#/components/schemas/GuestCounts
CartItem:
  type: object
  required:
  - cartItemId
  - product
  - usingDate
  - quantity
  - nights
  - lineTotal
  properties:
    cartItemId:
      type: string
    product:
      $ref: ../openapi.yaml#/components/schemas/ProductSummary
    usingDate:
      type: string
      format: date
    quantity:
      type: integer
      minimum: 1
    nights:
      type:
      - integer
      - 'null'
      minimum: 1
    guests:
      $ref: ../openapi.yaml#/components/schemas/GuestCounts
    fares:
      type: array
      description: Các dòng giá của mục theo giá catalog hiện tại. lineTotal bằng tổng fares[].amount.
      items:
        $ref: ../openapi.yaml#/components/schemas/FareLine
    lineTotal:
      type: integer
      minimum: 0
CartResponse:
  type: object
  required:
  - cartId
  - cdpUserId
  - items
  - itemCount
  - subtotal
  - total
  - currency
  - updatedAt
  properties:
    cartId:
      type: string
    cdpUserId:
      type: string
    items:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/CartItem
    itemCount:
      type: integer
      minimum: 0
    subtotal:
      type: integer
      minimum: 0
    total:
      type: integer
      minimum: 0
    currency:
      $ref: ../openapi.yaml#/components/schemas/Currency
    updatedAt:
      type: string
      format: date-time
Contact:
  type: object
  required:
  - fullName
  - email
  - phone
  properties:
    fullName:
      type: string
      minLength: 1
      maxLength: 100
    email:
      type: string
      format: email
    phone:
      type: string
      pattern: ^0[0-9]{9}$
CheckoutItemDetail:
  type: object
  required:
  - cartItemId
  properties:
    cartItemId:
      type: string
    guestNames:
      type: array
      description: Chỉ dùng khi request không có travelers (client cũ); bị bỏ qua khi có travelers.
      items:
        type: string
        minLength: 1
    travelerRefs:
      type: array
      description: Ai dùng dịch vụ (dịch vụ tính theo người, combo). Mọi phần tử phải có trong travelers.
      items:
        type: string
    rooms:
      type: array
      description: Khách sạn. Số phòng phải bằng quantity của mục giỏ; mỗi phòng có ít nhất 1 người lớn và không vượt maxOccupancy.
      items:
        $ref: ../openapi.yaml#/components/schemas/CheckoutRoom
    specialRequest:
      type:
      - string
      - 'null'
      maxLength: 500
CheckoutRequest:
  type: object
  required:
  - contact
  - itemDetails
  properties:
    contact:
      $ref: ../openapi.yaml#/components/schemas/Contact
    travelers:
      type: array
      minItems: 1
      maxItems: 9
      description: >-
        Đoàn khách (1–9 người, ít nhất 1 người lớn). Có travelers thì áp luật đoàn khách; không có thì Backend coi guestNames
        là tên người lớn và chỉ nhận khi mọi mục giỏ không có trẻ em.
      items:
        $ref: ../openapi.yaml#/components/schemas/CheckoutTraveler
    itemDetails:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/CheckoutItemDetail
BookingItem:
  type: object
  required:
  - bookingItemId
  - product
  - usingDate
  - quantity
  - nights
  - lineTotal
  - guestNames
  - specialRequest
  properties:
    bookingItemId:
      type: string
    product:
      $ref: ../openapi.yaml#/components/schemas/ProductSummary
    usingDate:
      type: string
      format: date
    quantity:
      type: integer
      minimum: 1
    nights:
      type:
      - integer
      - 'null'
      minimum: 1
    lineTotal:
      type: integer
      minimum: 0
    fares:
      type: array
      description: Các dòng giá của mục; lineTotal bằng tổng fares[].amount và mỗi dòng là một line item trên trang Stripe.
      items:
        $ref: ../openapi.yaml#/components/schemas/FareLine
    travelers:
      type: array
      description: Hành khách của mục (không có ngày sinh). Rỗng với đơn tạo trước khi có đoàn khách; khi đó dùng guestNames.
      items:
        $ref: ../openapi.yaml#/components/schemas/BookingTraveler
    guestNames:
      type: array
      description: Họ tên các khách của mục, theo thứ tự trong đoàn.
      items:
        type: string
    specialRequest:
      type:
      - string
      - 'null'
BookingGroup:
  type: object
  required:
  - destination
  - eventGroupId
  - items
  - groupTotal
  properties:
    destination:
      type: string
    eventGroupId:
      type: string
    items:
      type: array
      minItems: 1
      items:
        $ref: ../openapi.yaml#/components/schemas/BookingItem
    groupTotal:
      type: integer
      minimum: 0
BookingStatus:
  type: string
  enum:
  - PENDING_PAYMENT
  - CONFIRMED
  - PAYMENT_FAILED
  - EXPIRED
  - CANCELLED
  description: PENDING_PAYMENT là đang giữ chỗ (tối đa 30 phút). CONFIRMED chỉ khi Stripe xác nhận đã thu tiền.
PaymentStatus:
  type: string
  enum:
  - OPEN
  - SUCCEEDED
  - FAILED
  - EXPIRED
  - REFUND_PENDING
  - REFUNDED
  - REFUND_FAILED
PaymentFailureReason:
  type: string
  enum:
  - CARD_DECLINED
  - INSUFFICIENT_FUNDS
  - EXPIRED_CARD
  - INCORRECT_CVC
  - AUTHENTICATION_FAILED
  - PROCESSING_ERROR
  - TOO_MANY_ATTEMPTS
  - AMOUNT_MISMATCH
PaymentInfo:
  type: object
  required:
  - status
  - amount
  - currency
  - checkoutUrl
  - failedAttempts
  - failureReason
  - refundedAmount
  properties:
    status:
      $ref: ../openapi.yaml#/components/schemas/PaymentStatus
    amount:
      type: integer
      minimum: 0
    currency:
      $ref: ../openapi.yaml#/components/schemas/Currency
    checkoutUrl:
      type:
      - string
      - 'null'
      description: Trang thanh toán Stripe. Chỉ khác null khi status là OPEN.
    failedAttempts:
      type: integer
      minimum: 0
    failureReason:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/PaymentFailureReason
      - type: 'null'
    refundedAmount:
      type: integer
      minimum: 0
CancellationInfo:
  type: object
  required:
  - cancelledAt
  - reason
  - refundAmount
  properties:
    cancelledAt:
      type: string
      format: date-time
    reason:
      type:
      - string
      - 'null'
    refundAmount:
      type: integer
      minimum: 0
CancelBookingRequest:
  type: object
  properties:
    reason:
      type:
      - string
      - 'null'
      maxLength: 500
BookingResponse:
  type: object
  required:
  - referenceCode
  - createdAt
  - status
  - holdExpiresAt
  - cancellableUntil
  - payment
  - cancellation
  - contact
  - groups
  - total
  - currency
  properties:
    referenceCode:
      $ref: ../openapi.yaml#/components/schemas/ReferenceCode
    createdAt:
      type: string
      format: date-time
    status:
      $ref: ../openapi.yaml#/components/schemas/BookingStatus
    holdExpiresAt:
      type:
      - string
      - 'null'
      format: date-time
      description: Hạn giữ chỗ. Chỉ khác null khi status là PENDING_PAYMENT.
    cancellableUntil:
      type:
      - string
      - 'null'
      format: date-time
      description: Hạn huỷ có hoàn 100% (00:00 giờ Việt Nam của ngày liền trước usingDate sớm nhất). Chỉ khác null khi CONFIRMED.
    payment:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/PaymentInfo
      - type: 'null'
    cancellation:
      oneOf:
      - $ref: ../openapi.yaml#/components/schemas/CancellationInfo
      - type: 'null'
    contact:
      $ref: ../openapi.yaml#/components/schemas/Contact
    groups:
      type: array
      minItems: 1
      items:
        $ref: ../openapi.yaml#/components/schemas/BookingGroup
    total:
      type: integer
      minimum: 0
    currency:
      $ref: ../openapi.yaml#/components/schemas/Currency
