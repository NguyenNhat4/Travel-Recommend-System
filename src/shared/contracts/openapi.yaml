openapi: 3.1.0
info:
  title: Travel Recommendation Product API
  version: 1.4.0
  description: 'Contract chung cho frontend Next.js và backend Python/FastAPI. Nguồn mô tả nghiệp vụ:
    docs/spec/hop-dong-tich-hop-backend.md (Auth, Catalog, Search, Recommendation, Booking) và docs/spec/hop-dong-tich-hop-frontend.md
    (góc nhìn Web, đề xuất ItineraryResponse hợp nhất). Khi tài liệu và file này mâu thuẫn, file này thắng.'
servers:
- url: /api/v1
tags:
- name: auth
  description: Đăng ký, đăng nhập, JWT và tài khoản demo
- name: catalog
  description: Danh sách, chi tiết, sản phẩm tương tự và điểm đến
- name: search
  description: Semantic search trên catalog
- name: recommendations
  description: Gợi ý cá nhân hóa kèm because[]
- name: booking
  description: Giỏ hàng server-side và checkout giả lập
- name: assistant
  description: Itinerary Assistant (đề xuất, chờ Team Agent duyệt)
- name: events
  description: Ghi hành vi người dùng; Backend chuyển sang CDP clone qua CdpClient
paths:
  /auth/register:
    $ref: ./paths/auth.yaml#/~1auth~1register
  /auth/login:
    $ref: ./paths/auth.yaml#/~1auth~1login
  /auth/me:
    $ref: ./paths/auth.yaml#/~1auth~1me
  /auth/demo-accounts:
    $ref: ./paths/auth.yaml#/~1auth~1demo-accounts
  /auth/session:
    $ref: ./paths/auth.yaml#/~1auth~1session
  /auth/session/token:
    $ref: ./paths/auth.yaml#/~1auth~1session~1token
  /auth/session/revoke:
    $ref: ./paths/auth.yaml#/~1auth~1session~1revoke
  /auth/session/mfa/verify:
    $ref: ./paths/auth.yaml#/~1auth~1session~1mfa~1verify
  /auth/password:
    $ref: ./paths/auth.yaml#/~1auth~1password
  /products:
    $ref: ./paths/catalog.yaml#/~1products
  /products/{productId}:
    $ref: ./paths/catalog.yaml#/~1products~1{productId}
  /products/{productId}/similar:
    $ref: ./paths/catalog.yaml#/~1products~1{productId}~1similar
  /destinations:
    $ref: ./paths/catalog.yaml#/~1destinations
  /search:
    $ref: ./paths/search.yaml#/~1search
  /recommendations:
    $ref: ./paths/recommendations.yaml#/~1recommendations
  /cart:
    $ref: ./paths/booking.yaml#/~1cart
  /cart/items:
    $ref: ./paths/booking.yaml#/~1cart~1items
  /cart/items/{cartItemId}:
    $ref: ./paths/booking.yaml#/~1cart~1items~1{cartItemId}
  /bookings:
    $ref: ./paths/booking.yaml#/~1bookings
  /bookings/{referenceCode}:
    $ref: ./paths/booking.yaml#/~1bookings~1{referenceCode}
  /assistant/itineraries:
    $ref: ./paths/itinerary-agent.yaml#/~1assistant~1itineraries
  /assistant/itineraries/stream:
    $ref: ./paths/itinerary-agent.yaml#/~1assistant~1itineraries~1stream
  /assistant/status:
    $ref: ./paths/itinerary-agent.yaml#/~1assistant~1status
  /events:
    $ref: ./paths/events.yaml#/~1events
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: >-
        Chỉ BFF, seed và job nội bộ. Tối thiểu 32 ký tự. Không bao giờ có trong
        code frontend, URL hay log (docs/hop-dong-tich-hop-auth.md §14.4).
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: ID truy vết. Caller chưa gửi thì service đầu tiên tự sinh.
      schema:
        type: string
        maxLength: 64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    CartItemId:
      name: cartItemId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Lỗi theo envelope chung
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Cart:
      description: Toàn bộ giỏ sau thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CartResponse'
  schemas:
    Taxonomy:
      $ref: ./schemas/common.yaml#/Taxonomy
    ProductSort:
      $ref: ./schemas/common.yaml#/ProductSort
    SearchSort:
      $ref: ./schemas/common.yaml#/SearchSort
    Strategy:
      $ref: ./schemas/common.yaml#/Strategy
    BecauseEvent:
      $ref: ./schemas/common.yaml#/BecauseEvent
    Currency:
      $ref: ./schemas/common.yaml#/Currency
    ReferenceCode:
      $ref: ./schemas/common.yaml#/ReferenceCode
    ErrorCode:
      $ref: ./schemas/common.yaml#/ErrorCode
    ErrorResponse:
      $ref: ./schemas/common.yaml#/ErrorResponse
    PriceUnit:
      $ref: ./schemas/common.yaml#/PriceUnit
    SearchMode:
      $ref: ./schemas/common.yaml#/SearchMode
    AvailabilityStatus:
      $ref: ./schemas/common.yaml#/AvailabilityStatus
    ProductAttributes:
      $ref: ./schemas/catalog.yaml#/ProductAttributes
    ProductSummary:
      $ref: ./schemas/catalog.yaml#/ProductSummary
    ProductDetail:
      $ref: ./schemas/catalog.yaml#/ProductDetail
    ScoredProduct:
      $ref: ./schemas/catalog.yaml#/ScoredProduct
    ProductListResponse:
      $ref: ./schemas/catalog.yaml#/ProductListResponse
    SimilarProductsResponse:
      $ref: ./schemas/catalog.yaml#/SimilarProductsResponse
    DestinationListResponse:
      $ref: ./schemas/catalog.yaml#/DestinationListResponse
    RegisterRequest:
      $ref: ./schemas/auth.yaml#/RegisterRequest
    LoginRequest:
      $ref: ./schemas/auth.yaml#/LoginRequest
    AuthUser:
      $ref: ./schemas/auth.yaml#/AuthUser
    AuthResponse:
      $ref: ./schemas/auth.yaml#/AuthResponse
    DemoAccountListResponse:
      $ref: ./schemas/auth.yaml#/DemoAccountListResponse
    SessionState:
      $ref: ./schemas/auth.yaml#/SessionState
    SessionRequest:
      $ref: ./schemas/auth.yaml#/SessionRequest
    SessionResponse:
      $ref: ./schemas/auth.yaml#/SessionResponse
    RefreshRequest:
      $ref: ./schemas/auth.yaml#/RefreshRequest
    RevokeRequest:
      $ref: ./schemas/auth.yaml#/RevokeRequest
    MfaVerifyRequest:
      $ref: ./schemas/auth.yaml#/MfaVerifyRequest
    PasswordChangeRequest:
      $ref: ./schemas/auth.yaml#/PasswordChangeRequest
