  /events:
    $ref: ./paths/events.yaml#/~1events
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: >-
        Chỉ BFF, seed và job nội bộ. Tối thiểu 32 ký tự. Không bao giờ có trong
        code frontend, URL hay log (docs/hop-dong-tich-hop-auth.md §14.4).
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: ID truy vết. Caller chưa gửi thì service đầu tiên tự sinh.
      schema:
        type: string
        maxLength: 64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    CartItemId:
      name: cartItemId
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    XGuestId:
      name: X-Guest-Id
      in: header
      required: false
      description: >-
        Mã khách chưa đăng nhập, do BFF phát và chỉ BFF gửi. Backend chỉ tin khi X-Service-Token hợp lệ; có Bearer thì bị bỏ
        qua. Trình duyệt không tự đặt được header này.
      schema:
        type: string
        pattern: ^g_[A-Za-z0-9_-]{22}$
  responses:
    Error:
      description: Lỗi theo envelope chung
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Cart:
      description: Toàn bộ giỏ sau thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CartResponse'
    BookingDraft:
      description: Đơn nháp với giá và tình trạng còn bán hiện tại
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingDraft'
