/products:
  get:
    tags:
    - catalog
    operationId: listProducts
    summary: Danh sách sản phẩm
    description: >-
      Không có parentProductId: chỉ trả tầng cha (search unit — property, route và taxonomy không phân tầng),
      giống /search và /recommendations. Có parentProductId: trả các sản phẩm tầng con (hạng phòng, chuyến bay
      cụ thể) của sản phẩm cha đó, là đơn vị đặt chỗ mà Web thêm vào giỏ; sort=popular với tầng con xếp theo
      giá tăng dần. parentProductId không có trong catalog hoặc không có tầng con thì trả results rỗng.
      Response 200 có `Cache-Control: public, max-age=60, s-maxage=300`: danh mục không đọc người dùng nên giống
      nhau cho mọi người, trình duyệt giữ 60 giây và lớp cache trung gian giữ 5 phút. Lỗi 400 không có header này.
      diversify=taxonomy (1.27.0) trộn danh sách theo nhóm loại; kệ Phổ biến tab Tất cả ở Home dùng tham số này.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    - name: parentProductId
      in: query
      required: false
      description: productId của sản phẩm cha (property hoặc route). Lọc các tầng con của nó.
      schema:
        type: string
        minLength: 1
    - name: destination
      in: query
      schema:
        type: string
    - name: taxonomy
      in: query
      required: false
      description: >-
        Lọc một hoặc nhiều danh mục (1.27.0): nhiều giá trị cách nhau bằng dấu phẩy, ví dụ taxonomy=attraction,golf.
        Một giá trị như cũ vẫn hợp lệ. Giá trị trùng được bỏ qua; giá trị ngoài enum hoặc đoạn rỗng (taxonomy=hotel,)
        trả 400 VALIDATION_ERROR, details.fields có "taxonomy".
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        items:
          $ref: ../openapi.yaml#/components/schemas/Taxonomy
    - name: availableOnly
      in: query
      schema:
        type: boolean
        default: false
    - name: freeOnly
      in: query
      required: false
      description: >-
        Chỉ điểm tham quan/golf vào cửa tự do, lọc trước sort và phân trang; total là số điểm phù hợp.
        entryPolicy=free hoặc assumed_free (điểm không giá, không ghi ticketed=true; cần xác nhận phí vào cửa).
        Không gửi/false giữ hành vi cũ. Không tự suy hotel/flight/combo thiếu giá thành miễn phí.
      schema:
        type: boolean
        default: false
    - name: sort
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/ProductSort
    - name: diversify
      in: query
      required: false
      description: >-
        (1.27.0) Chỉ nhận taxonomy. Trộn danh sách đã lọc và xếp theo round-robin giữa các nhóm loại, thứ tự nhóm cố
        định: khách sạn (hotel) → vé tham quan và golf (attraction, golf) → combo → vé máy bay (flight); trong mỗi nhóm
        giữ thứ tự của sort, nhóm hết món thì bỏ qua. Trộn trước khi cắt offset/limit nên kết quả là một hoán vị: total
        không đổi, các trang nối tiếp nhau. Lọc taxonomy chỉ còn một nhóm thì thứ tự không đổi. Chỉ đi với sort=popular
        và không có parentProductId; giá trị khác, đi cùng sort giá hoặc parentProductId trả 400 VALIDATION_ERROR,
        details.fields có "diversify". Không gửi thì giữ hành vi cũ.
      schema:
        type: string
        enum:
        - taxonomy
    - $ref: ../openapi.yaml#/components/parameters/Limit
    - $ref: ../openapi.yaml#/components/parameters/Offset
    responses:
      '200':
        description: Trang sản phẩm
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ProductListResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
/products/{productId}:
  get:
    tags:
    - catalog
    operationId: getProduct
    summary: Chi tiết sản phẩm
    description: >-
      Response 200 có `Cache-Control: public, max-age=60, s-maxage=300` (chi tiết không đọc người dùng). 404 không có
      header này.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    - $ref: ../openapi.yaml#/components/parameters/ProductId
    responses:
      '200':
        description: Chi tiết sản phẩm
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ProductDetail
      '404':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
/products/{productId}/similar:
  get:
    tags:
    - catalog
    operationId: getSimilarProducts
    summary: Sản phẩm tương tự theo độ gần vector sản phẩm
    description: >-
      Response 200 có `Cache-Control: public, max-age=60, s-maxage=300` (vector và danh sách tương tự không đọc người
      dùng). 400, 404, 409 và 503 không có header này.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    - $ref: ../openapi.yaml#/components/parameters/ProductId
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 8
    responses:
      '200':
        description: Sản phẩm tương tự, có thể rỗng
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/SimilarProductsResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '404':
        $ref: ../openapi.yaml#/components/responses/Error
      '409':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
      '503':
        $ref: ../openapi.yaml#/components/responses/Error
/destinations:
  get:
    tags:
    - catalog
    operationId: listDestinations
    security: []
    summary: Danh sách điểm đến chuẩn hóa
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    responses:
      '200':
        description: Điểm đến
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/DestinationListResponse
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
