/events:
  post:
    tags:
    - events
    operationId: trackEvent
    summary: Ghi hành vi người dùng mà Backend không tự thấy được (hiện chỉ product_view)
    description: 'Web gọi khi người dùng thật sự mở trang chi tiết, không gọi khi prefetch/SSR. Backend kiểm tra
      productId trong catalog, lấy taxonomy từ catalog, rồi ghi sang CDP clone ở nền: trả 202 trước khi CDP
      xác nhận, CDP lỗi thì event bị bỏ và chỉ ghi log. search và add_to_cart không đi qua endpoint này mà do
      POST /search và POST /cart/items tự ghi; purchase do POST /bookings ghi.'
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/TrackEventRequest
    responses:
      '202':
        description: Đã nhận; không bảo đảm CDP đã lưu
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
      '404':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
