/assistant/itineraries:
  post:
    tags:
    - assistant
    operationId: createItinerary
    summary: Tạo hoặc tiếp tục lịch trình
    description: Shape hợp nhất được khóa tại OpenAPI; xem docs/spec/hop-dong-tich-hop-frontend.md §9.
      Lỗi luôn trả ErrorResponse với HTTP status tương ứng, không có status "ERROR" trong body 200.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ItineraryRequest
    responses:
      '200':
        description: Kết quả theo status
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ItineraryResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
      '404':
        $ref: ../openapi.yaml#/components/responses/Error
      '422':
        $ref: ../openapi.yaml#/components/responses/Error
      '429':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
      '503':
        $ref: ../openapi.yaml#/components/responses/Error
/assistant/itineraries/stream:
  post:
    tags:
    - assistant
    operationId: streamItinerary
    summary: Tạo hoặc tiếp tục lịch trình và stream tiến trình graph
    description: SSE phát topology, node.activity, node.completed với progress tuỳ chọn, run.preview sau compose và kết quả cuối. Progress cập nhật theo groupId; số cộng dồn do backend tính. Preview tối đa 6 sản phẩm đã kiểm nguồn. Không phát raw state, prompt hoặc token.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ItineraryRequest
    responses:
      '200':
        description: Luồng Server-Sent Events. Kết quả nghiệp vụ nằm trong run.completed; lỗi sau khi mở stream nằm trong run.failed.
        content:
          text/event-stream:
            schema:
              type: string
              description: Mỗi data là AssistantStreamEvent được mã hóa JSON.
      '422':
        $ref: ../openapi.yaml#/components/responses/Error
      '429':
        $ref: ../openapi.yaml#/components/responses/Error
      '503':
        $ref: ../openapi.yaml#/components/responses/Error
/assistant/conversations:
  get:
    tags:
    - assistant
    operationId: listAssistantConversations
    summary: Liệt kê lịch sử hội thoại của người dùng hiện tại
    security:
    - bearerAuth: []
    parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    responses:
      '200':
        description: Danh sách hội thoại mới nhất trước, chỉ của user hiện tại
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AssistantConversationList
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
/assistant/conversations/{conversationId}:
  get:
    tags:
    - assistant
    operationId: getAssistantConversation
    summary: Đọc transcript một hội thoại của người dùng hiện tại
    security:
    - bearerAuth: []
    parameters:
    - name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Transcript và response có cấu trúc đã lưu
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AssistantConversationDetail
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
      '404':
        $ref: ../openapi.yaml#/components/responses/Error
/assistant/status:
  get:
    tags:
    - assistant
    operationId: getAssistantStatus
    summary: Kiểm tra trạng thái runtime và nguồn dữ liệu của agent
    responses:
      '200':
        description: Trạng thái agent
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AssistantStatus
