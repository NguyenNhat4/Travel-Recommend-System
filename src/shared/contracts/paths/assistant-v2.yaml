/assistant/itineraries:
  post:
    tags:
    - assistant
    operationId: createAssistantV2
    summary: Run an autonomous assistant turn
    description: Atomic owner/conversation/clientTurnId claim in shared store for 24h; identical content replays
      final, running returns TURN_IN_PROGRESS, conflicting content returns IDEMPOTENCY_CONFLICT. Revision checked
      before replacing plan; no silent overwrite. No unvalidated model product text streamed.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - name: X-Request-ID
      in: header
      required: false
      description: Caller trace ID; generated by server if absent.
      schema:
        type: string
        maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../assistant-v2.openapi.yaml#/components/schemas/AssistantV2Request
    responses:
      '200':
        description: Idempotent validated final.
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/AssistantV2Final
      '400':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
      '401':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
      '409':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
        headers:
          Retry-After:
            description: Seconds until retry when retryable, including TURN_IN_PROGRESS.
            schema:
              type: integer
              minimum: 1
      '422':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
      '429':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
        headers:
          Retry-After:
            description: Seconds until retry when retryable, including TURN_IN_PROGRESS.
            schema:
              type: integer
              minimum: 1
      '500':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
      '503':
        description: 'Project Error Envelope. 409: TURN_IN_PROGRESS (Retry-After), IDEMPOTENCY_CONFLICT or PLAN_REVISION_CONFLICT.'
        content:
          application/json:
            schema:
              $ref: ../assistant-v2.openapi.yaml#/components/schemas/ErrorResponse
        headers:
          Retry-After:
            description: Seconds until retry when retryable, including TURN_IN_PROGRESS.
            schema:
              type: integer
              minimum: 1
