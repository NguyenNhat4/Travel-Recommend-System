/recommendations:
  get:
    tags:
    - recommendations
    operationId: getRecommendations
    summary: Gợi ý cá nhân hóa, hoặc phổ biến khi không có JWT
    description: Không đọc được lịch sử từ CDP clone thì vẫn trả 200 với strategy popular, because rỗng,
      diagnostics.coldStart true và eventsUsed 0; không trả 500 vì lỗi CDP.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    - name: k
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
    - name: destination
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Gợi ý
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RecommendationResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
