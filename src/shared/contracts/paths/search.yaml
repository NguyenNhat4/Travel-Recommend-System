/search:
  post:
    tags:
    - search
    operationId: searchProducts
    summary: Semantic search trên catalog
    description: 'Có JWT và offset = 0 thì Backend ghi event search (searchQuery = query) sang CDP clone ở nền;
      đổi trang không ghi thêm, CDP lỗi không ảnh hưởng response. Agent gọi endpoint này không kèm JWT để lượt
      tìm của Agent không bị tính là hành vi người dùng.'
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/SearchRequest
    responses:
      '200':
        description: Kết quả tìm kiếm
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/SearchResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
      '503':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
