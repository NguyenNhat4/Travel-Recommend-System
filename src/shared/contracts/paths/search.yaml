/search:
  get:
    tags:
    - search
    operationId: searchProductsCompat
    summary: Semantic search trên catalog
    description: 'Có JWT và offset = 0 thì Backend ghi event search (searchQuery = q) sang CDP clone ở nền;
      đổi trang không ghi thêm, CDP lỗi không ảnh hưởng response. Agent không gắn danh tính khi tìm kiếm:
      chế độ `inprocess` gọi engine trong tiến trình; chế độ `http` gọi endpoint này không kèm JWT, để lượt
      tìm của Agent không bị tính là hành vi người dùng.'
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    - name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 500
        pattern: \S
    - name: taxonomy
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/Taxonomy
    - name: destination
      in: query
      schema:
        type: string
    - name: origin
      in: query
      description: >-
        (1.15.0) Thành phố đi của tuyến bay; chỉ có hiệu lực với taxonomy = flight hoặc câu hỏi vé máy bay (xem
        SearchRequest.origin). Trang /flights của Web dùng GET /products, không dùng tham số này.
      schema:
        type: string
    - name: priceMin
      in: query
      schema:
        type: integer
        minimum: 0
    - name: priceMax
      in: query
      schema:
        type: integer
        minimum: 0
    - name: starRatingMin
      in: query
      description: SOFT filter như SearchRequest.starRatingMin ([C6]).
      schema:
        type: number
        minimum: 0
        maximum: 5
    - name: availableOnly
      in: query
      schema:
        type: boolean
        default: true
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    responses:
      '200':
        description: Kết quả tìm kiếm
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/SearchResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
      '503':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
  post:
    tags:
    - search
    operationId: searchProducts
    summary: Semantic search trên catalog theo hợp đồng v1
    description: 'Bề mặt v1 được giữ để không phá client hiện có. Agent không gắn danh tính khi tìm kiếm:
      chế độ `inprocess` gọi engine trong tiến trình; chế độ `http` gọi GET compatibility endpoint không kèm
      JWT. Web có thể tiếp tục dùng POST với SearchRequest. Từ 1.16.0 travelContext.guests (adults, children) thành
      filter sức chứa (appliedFilters.hard.minOccupancy, partySource = param); GET không có tham số tương ứng.'
    security:
    - {}
    - bearerAuth: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/SearchRequest
    responses:
      '200':
        description: Kết quả tìm kiếm
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/SearchResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/Error
      '401':
        $ref: ../openapi.yaml#/components/responses/Error
      '503':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
/search/suggestions:
  get:
    tags:
    - search
    operationId: suggestSearch
    summary: Gợi ý tức thì khi gõ ở ô tìm kiếm (FR-SRC-05)
    description: 'Khớp chữ theo đầu từ trên tên điểm đến và tên search unit của catalog đang phục vụ, không phân
      biệt dấu và hoa thường. Không gọi embed hay kho vector, không ghi event search sang CDP và không ghi
      search log, nên Web được gọi theo từng lần gõ. Không gợi ý vé máy bay. `q` có dưới 2 ký tự chữ hoặc
      số sau chuẩn hoá thì trả `suggestions` rỗng với status 200. Response giống nhau cho mọi người dùng và
      có `Cache-Control: public`. Thiếu `q`, `q` dài quá 100 ký tự hoặc `limit` ngoài 1–10 trả 422
      VALIDATION_ERROR.'
    security: []
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/XRequestId
    - name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 8
    responses:
      '200':
        description: Gợi ý, có thể rỗng
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/SearchSuggestionResponse
      '422':
        $ref: ../openapi.yaml#/components/responses/Error
      '500':
        $ref: ../openapi.yaml#/components/responses/Error
