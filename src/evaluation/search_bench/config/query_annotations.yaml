# query_annotations — nhãn THEO CÂU cho gold (06/10; thay config/forbidden_v3.yaml của 05/10).
#
# NHÃN MÁY, CHƯA DUYỆT — không phải gold. Bench (`runner.load_env` → `metrics.apply_annotations`) chỉ gắn trường nào câu gold
# CHƯA có (gold thắng từng trường; phần cấm forbidden_filter + forbidden tính là một: gold có một trong hai thì không gắn).
# Nạp qua `metrics.annotations` của sbench.yaml (tương đối theo thư mục gói search_bench).
#
# Khoá của một câu (thiếu khoá = không gắn; khoá lạ hoặc qid không có trong gold/gold.jsonl → MetricsError):
#   forbidden_filter  AST filter của `store/filters.py`: kết quả KHÔNG được xuất hiện trong top-k (forbidden_at_10). Trường
#                     dùng được: cột items + cột RAM `runner.attach_unit_columns`:
#                       features         = khoá tiện ích của backend (`domain/search/amenities.py`: pool, kitchen, balcony…)
#                       origin_city / destination_city = attributes.originCity / destinationCity của tuyến bay (chuỗi catalog)
#                       brand, taxonomy, variant, destination… = cột items.parquet
#   forbidden         danh sách product_id cấm tường minh
#   origin            câu vé máy bay: thành phố đi kỳ vọng (giá trị catalog) — direction_accuracy
#   destination_city  câu vé máy bay: thành phố đến kỳ vọng
#   expected_parse    {taxonomy, destination, origin, destination_city, must_not, must_not_brands, must_not_taxonomies,
#                      price_max, price_min, star_min, party_total} — chỉ so trường được nêu; null = kỳ vọng parser KHÔNG ra gì
#                      (metrics.PARSE_FIELDS / parse_ok)
#   family            id gộp các biến thể không dấu / gõ sai của cùng một ý định (by_family, family_macro_ndcg)
#   allowed_variants  (06/10, phương án b) variant catalog KHÔNG vi phạm loại cốt lõi của câu — kể cả phương án thay thế
#                     rubric cho 1 (combo cho câu hỏi vé #10 / vé máy bay #8d); lúc chấm, nhãn ≥ 1 của sản phẩm ngoài danh
#                     sách tính là 0 (`metrics.project_rubric_v4`, bật bằng `metrics.rubric_v4_projection`). Sinh từ
#                     expected_parse.taxonomy (cross_vertical: ngành dọc nêu trong câu; tên POI: loại của nhãn 2 cũ), bỏ
#                     must_not_taxonomies; kiểm: mọi nhãn 2 cũ nằm trong danh sách.
#
# Nhãn gán từ gold_v4 trở đi (câu mới + hole D9a trở đi của câu cũ) theo rubric v4; nhãn cũ của câu v3 theo rubric v3
# (docs/spec/bench/gold-guide.md, 06/10) — report đọc theo `by_block` và ghi rõ câu v3 có nhãn hai rubric.
# Giữ các mục theo thứ tự qid.
#
# ---- Quy ước của bộ chú giải 06/10 (sinh bởi agent ANN, gộp bởi orchestrator; giữ nguyên nghĩa 8 mục forbidden_v3) ----
# Chú giải query understanding cho gold search bench: expected_parse / forbidden_filter / origin / destination_city / family.
# Nguồn: claude-opus-5-5, nhãn máy CHƯA DUYỆT, 06/10/2026. Sinh từ src/evaluation/search_bench/gold/gold.jsonl (154 câu
# active; c0463 retired bị bỏ qua) theo docs/spec/bench/gold-guide.md (rubric v3 cho câu < c0673; rubric v4 + quy ước
# #8-#14 + bảng chính sách từng câu cho câu từ c0673). Orchestrator gộp vào repo; người duyệt sửa trực tiếp file này.
# Cấu trúc: annotations.<qid>.{expected_parse, forbidden_filter?, origin?, destination_city?}; không câu nào có family.
#
# Quy ước expected_parse (thứ parser luật lý tưởng rút ra từ CHỮ của câu; catalog chỉ dùng để lấy đúng chính tả):
# - taxonomy: một ngành dọc duy nhất khách hỏi. khách sạn/KS/resort/villa/homestay/chỗ nghỉ/nơi ở/nơi lưu trú/KDL/phòng
#   -> hotel; vé máy bay/chuyến bay/đường bay -> flight; vé tham quan/vé vui chơi/VinWonders/Safari/điểm-khu vui chơi
#   -> attraction; combo/trọn gói -> combo; golf/sân golf/voucher golf -> golf. null khi câu nêu >= 2 ngành dọc
#   (cross_vertical; riêng "combo X và Y" -> combo vì combo là danh từ chính) hoặc không có từ ngành dọc (tên POI trần,
#   "hoạt động trải nghiệm", "gói vui chơi", "tour", "Bus").
# - destination: giá trị cột destination của bench_out/search/data/items.parquet (đúng chính tả catalog) khi câu nêu
#   đúng một điểm đến; vé máy bay -> thành phố ĐẾN; địa danh con không có giá trị riêng quy về destination catalog
#   (Nam Hội An -> Hội An, Grand World Phú Quốc -> Phú Quốc); Phong Nha / Cát Bà có giá trị riêng trong catalog nên
#   giữ nguyên; điểm đến không có trong catalog (out_of_catalog) -> null.
# - origin / destination_city: chỉ cho câu vé máy bay; chuỗi attributes.originCity / destinationCity của snapshot
#   2026-09-23 ("Sài Gòn" -> "TP. Hồ Chí Minh"). Câu cross_vertical có "vé máy bay ... ở X" không có chiều -> null.
# - must_not: khoá tiện ích backend (src/backend/app/domain/search/amenities.py) bị phủ định; "có X" không ghi;
#   "phòng không hút thuốc" là yêu cầu dương (#14). must_not_taxonomies: "vé lẻ" / "không lấy combo" -> [combo].
#   must_not_brands: không câu nào loại trừ thương hiệu ("khách sạn Vinpearl" là thương hiệu dương).
# - price_max / price_min: VND nguyên; star_min: "N sao" / "từ N sao"; party_total: "N người" / "nhóm N người" /
#   "Phòng N Người" ("cặp đôi", "gia đình", "2 Giường Đơn", "double room" -> null).
#
# Quy ước forbidden_filter (Forbidden@10: vi phạm ràng buộc CỨNG, không bao giờ được vào top-10), AST store/filters.py:
# (a) câu phủ định: unit CÓ ghi tiện ích bị phủ định -> {contains_any: [features, [k]]}; câu v4 hai điều kiện chỉ cấm
#     phần phủ định, không cấm phần "có X". (Bản nháp đầu loại trừ một product_id ở c0688 / c0694 vì dương tính giả của
#     amenities.py — 'Bồn tắm spa' -> spa, 'Phòng tập thể' -> gym; đã sửa từ vựng 06/10 nên bỏ ngoại lệ.)
# (b) vé máy bay có điểm đi và/hoặc điểm đến: flight_route sai chặng / chiều (#7b, #8a-c); unit không phải tuyến bay
#     không bị filter này cấm.
# (c) taxonomy_collision (rubric v4: loại sản phẩm cốt lõi là ràng buộc cứng): mọi taxonomy mà chính sách câu + rubric
#     v4 cho 0. c0697 / c0709 -> mọi non-hotel; c0700 -> hotel / flight / golf (combo được 1 nên không cấm);
#     c0703 -> mọi non-attraction (gồm combo bị loại trừ rõ và khách sạn); c0706 -> mọi non-combo.
# 8 mục của config/forbidden_v3.yaml giữ nguyên nghĩa (c0241, c0244, c0247, c0250, c0253, c0373, c0070, c0088).
# Không cấm theo sai điểm đến hay điều kiện mềm; câu cross_vertical không cấm chiều bay (nhãn v3 không thống nhất:
# c0541 cho 2 cả hai chiều, c0546 / c0547 cho 0 chiều ra, c0565 cho 1 chiều vào).
#
# family: không tạo họ nào. Gold không có cặp biến thể (không dấu / viết tắt / typo) cùng ý định mà chắc chắn; ứng viên
# gần nhất c0196 ~ c0475 (chỗ nghỉ "phòng nhìn ra biển" vs KS "nhìn ra biển", 4/8 nhãn chung lệch) và c0456 ~ c0709
# (resort vs khách sạn, rubric v3 vs v4) không gộp.
#
# Đã kiểm: yaml.safe_load; store.filters.validate cho mọi forbidden_filter; với các câu mới (ngoài 8 mục forbidden_v3)
# không cặp (câu, sản phẩm) nhãn >= 1 nào trong gold rơi vào forbidden_filter của câu đó (features = amenity_keys backend trên amenities_raw của items.parquet,
# origin_city / destination_city từ snapshot 2026-09-23). 8 mục forbidden_v3 giữ nguyên nghĩa dù nhãn v3 có 34 cặp nhãn
# >= 1 rơi vào filter (c0088: 3, c0241: 2, c0244: 6, c0247: 7, c0250: 3, c0253: 13) - nhãn cũ theo luật "tối đa 1"
# trước quy ước #3, không sửa ở đây.
