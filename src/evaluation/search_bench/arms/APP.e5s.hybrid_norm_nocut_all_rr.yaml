# Ma trận ablation (06/10, fix/search-gold-v4) trên cổng APP e5-small: chạy đúng SearchProducts của backend trên collection
# ProductBench__e5_small (vector `vec_T3+R_e5-small.npy`, 384 chiều). Mốc A = APP.e5s.hybrid_norm_nocut (hybrid + normalize,
# cutoff -1 vì 0,62 là ngưỡng cosine Cohere). Núm mới (app_adapter.APP_DEFAULTS): tone_normalize (dấu thanh hoà ↔ hòa theo kiểu
# đa số của catalog), taxonomy_strong_only (F4 chỉ lọc với cue loại mạnh), party_filter (số khách suy từ câu → sức chứa tối thiểu),
# kênh fuzzy (fuzzy_k > 0: tên gần đúng theo trigram cửa sổ, vớt khi độ giống ≥ fuzzy_min_sim), trọng số RRF theo nhánh,
# retrieval_mode (hybrid | dense | lexical). Mặc định production hôm nay: mọi núm mới tắt.
# Phase D reranker offline: cùng khối app với APP.e5s.hybrid_norm_nocut_all; engine trả top-30, cross-encoder BAAI/bge-reranker-v2-m3
# (transformers, CPU) chấm (câu gốc, text T3+R của unit), sắp lại rồi cắt top-10 (search_bench/rerank.py). Điểm cache ở
# bench_out/search/cache/rerank.sqlite → chạy lại miễn phí. latency_ms chỉ gồm SearchProducts; thời gian rerank ở extra.rerank.
id: APP.e5s.hybrid_norm_nocut_all_rr
stage: APP
parent: APP.e5s.hybrid_norm_nocut_all
description: "ALL + rerank offline bge-reranker-v2-m3 trên top-30 (CPU, bench-only)"
composite: true
engine: app
app: {cutoff: -1.0, candidate_k: 200, hybrid: true, normalize: true, rrf_k: 60, lexical_k: 10, lexical_cutoff: 0.50, min_coverage: 0.6, lexical_candidate_k: 50,
      dest_filter: true, dest_filter_fallback: true, no_diacritics_mode: "relax",
      negation_filter: true, taxonomy_filter: true, route_filter: true, numeric_filter: true,
      tone_normalize: true, taxonomy_strong_only: true, party_filter: true,
      fuzzy_k: 10, fuzzy_candidate_k: 50, fuzzy_min_sim: 0.75, dense_weight: 1.0, lexical_weight: 1.0, fuzzy_weight: 1.0, retrieval_mode: "hybrid",
      no_diacritics: {lexical_k: 20, lexical_cutoff: 0.0, min_coverage: 0.4, cutoff: null, min_tokens: 3}}
text_variant: T3+R
model: e5-small
embedding_types: float
query_input_type: query
retrieval: hybrid
query_vec: null
fusion: null
bm25: {tokenization: word, k1: 1.2, b: 0.75}
filters: {qu: true, amenity_must: none}
boost: {amenity_nice_w: 0.0, amenity_must_w: 0.0}
dedupe_parent: false
query_preproc: {alias: true, symspell: true}
cutoff: {max_vector_distance: null}
csls: null
rerank: {model: BAAI/bge-reranker-v2-m3, top_n: 30, parent_engine: app, query: "raw", batch_size: 16, max_length: 512}
fallback_bm25_only: false
phase: 1
