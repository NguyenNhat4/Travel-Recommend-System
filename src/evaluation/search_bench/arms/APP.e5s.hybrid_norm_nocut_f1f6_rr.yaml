# Rerank offline (kiến trúc Phase D) trên ứng viên production F1–F6 — như APP.e5s.hybrid_norm_nocut_all_rr nhưng cha là _f1f6.
# Ứng viên production (06/10, sau ma trận ablation): đúng các phần THẮNG hoặc giữ guard trên gold_v5 (chưa tag) — F1 dest_filter,
# F2 no_diacritics relax, F3 negation, F4 taxonomy (mọi cue, KHÔNG strong-only: strong-only −1,0 so F4 đủ), F5 route, F6 numeric;
# không cutoff (cutoff tuyệt đối 0,84 TIE trên e5), không party / tone / fuzzy (trung tính hoặc âm trên gold). Mốc A + F1–F6.
id: APP.e5s.hybrid_norm_nocut_f1f6_rr
stage: APP
parent: APP.e5s.hybrid_norm_nocut_f1f6
description: "F1–F6 + rerank offline bge-reranker-v2-m3 top-30 (chỉ bench)"
composite: true
engine: app
app: {cutoff: -1.0, candidate_k: 200, hybrid: true, normalize: true, rrf_k: 60, lexical_k: 10, lexical_cutoff: 0.50, min_coverage: 0.6, lexical_candidate_k: 50,
      dest_filter: true, dest_filter_fallback: true, no_diacritics_mode: "relax",
      negation_filter: true, taxonomy_filter: true, route_filter: true, numeric_filter: true,
      tone_normalize: false, taxonomy_strong_only: false, party_filter: false,
      fuzzy_k: 0, fuzzy_candidate_k: 50, fuzzy_min_sim: 0.75, dense_weight: 1.0, lexical_weight: 1.0, fuzzy_weight: 1.0, retrieval_mode: "hybrid",
      no_diacritics: {lexical_k: 20, lexical_cutoff: 0.0, min_coverage: 0.4, cutoff: null, min_tokens: 3}}
text_variant: T3+R
model: e5-small
embedding_types: float
query_input_type: query
retrieval: hybrid
query_vec: null
fusion: null
bm25: {tokenization: word, k1: 1.2, b: 0.75}
filters: {qu: true, amenity_must: none}
boost: {amenity_nice_w: 0.0, amenity_must_w: 0.0}
dedupe_parent: false
query_preproc: {alias: true, symspell: true}
cutoff: {max_vector_distance: null}
csls: null
rerank: {model: BAAI/bge-reranker-v2-m3, top_n: 30, parent_engine: app, query: "raw", batch_size: 16, max_length: 512}
fallback_bm25_only: false
phase: 1
