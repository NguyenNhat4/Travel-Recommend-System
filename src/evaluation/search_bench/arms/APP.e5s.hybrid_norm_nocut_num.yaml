# Cổng APP trên e5-small (05/10, fix/search): chạy đúng SearchProducts của backend trên collection ProductBench__e5_small
# (vector `vec_T3+R_e5-small.npy`, 384 chiều, prefix query:/passage: theo config). Người dùng chốt 05/10 chuyển model sang e5-small
# và không gọi Cohere nữa; cutoff -1 vì 0,62 là ngưỡng cosine của Cohere (cosine e5 dồn 0,72–0,78 cho cặp không liên quan) —
# cutoff cho e5 chọn sau khi xem phân bố top_scores (tạm, chờ dev/test split).
# 06/10: query plan (contract `diagnostics.queryPlan`): F3 negation_filter ("không có hồ bơi" → loại unit có ghi nhận tiện ích đó),
# F4 taxonomy_filter (câu nêu đúng một loại sản phẩm → lọc taxonomy), F5 route_filter (vé máy bay "từ A đến B" → lọc originCity),
# F6 numeric_filter (giá hard / sao soft suy từ câu). Mặc định production hôm nay: cả bốn tắt.
id: APP.e5s.hybrid_norm_nocut_num
stage: APP
parent: APP.e5s.hybrid_norm_nocut
description: "mốc + F6: giá-sao (numeric_filter) — giá hard / sao soft suy từ câu"
composite: true
engine: app
app: {cutoff: -1.0, candidate_k: 200, hybrid: true, normalize: true, rrf_k: 60, lexical_k: 10, lexical_cutoff: 0.50, min_coverage: 0.6, lexical_candidate_k: 50,
      dest_filter: false, dest_filter_fallback: true, no_diacritics_mode: "off",
      negation_filter: false, taxonomy_filter: false, route_filter: false, numeric_filter: true,
      tone_normalize: false, taxonomy_strong_only: false, party_filter: false,
      fuzzy_k: 0, fuzzy_candidate_k: 50, fuzzy_min_sim: 0.75, dense_weight: 1.0, lexical_weight: 1.0, fuzzy_weight: 1.0, retrieval_mode: "hybrid",
      no_diacritics: {lexical_k: 20, lexical_cutoff: 0.0, min_coverage: 0.4, cutoff: null, min_tokens: 3}}
text_variant: T3+R
model: e5-small
embedding_types: float
query_input_type: query
retrieval: hybrid
query_vec: null
fusion: null
bm25: {tokenization: word, k1: 1.2, b: 0.75}
filters: {qu: true, amenity_must: none}
boost: {amenity_nice_w: 0.0, amenity_must_w: 0.0}
dedupe_parent: false
query_preproc: {alias: true, symspell: true}
cutoff: {max_vector_distance: null}
csls: null
rerank: null
fallback_bm25_only: false
phase: 1
