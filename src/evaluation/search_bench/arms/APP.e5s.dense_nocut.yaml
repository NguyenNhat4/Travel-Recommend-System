# Cổng APP trên e5-small (05/10, fix/search): chạy đúng SearchProducts của backend trên collection ProductBench_e5_small
# (vector `vec_T3+R_e5-small.npy`, 384 chiều, prefix query:/passage: theo config). Người dùng chốt 05/10 chuyển model sang e5-small
# và không gọi Cohere nữa; cutoff -1 vì 0,62 là ngưỡng cosine của Cohere (cosine e5 dồn 0,72–0,78 cho cặp không liên quan) —
# cutoff cho e5 chọn sau khi xem phân bố top_scores (tạm, chờ dev/test split).
id: APP.e5s.dense_nocut
stage: APP
parent: E2.e5s
description: "e5-small qua SearchProducts: dense-only, không cutoff (≈ E2.e5s qua funnel production, khác do hnsw)"
composite: true
engine: app
app: {cutoff: -1.0, candidate_k: 200, hybrid: false, normalize: false, rrf_k: 60, lexical_k: 10, lexical_cutoff: 0.50, min_coverage: 0.6, lexical_candidate_k: 50,
      dest_filter: false, dest_filter_fallback: true, no_diacritics_mode: "off",
      negation_filter: false, taxonomy_filter: false, route_filter: false, numeric_filter: false,
      no_diacritics: {lexical_k: 20, lexical_cutoff: 0.0, min_coverage: 0.4, cutoff: null, min_tokens: 3}}
text_variant: T3+R
model: e5-small
embedding_types: float
query_input_type: query
retrieval: dense
query_vec: null
fusion: null
bm25: {tokenization: word, k1: 1.2, b: 0.75}
filters: {qu: false, amenity_must: none}
boost: {amenity_nice_w: 0.0, amenity_must_w: 0.0}
dedupe_parent: false
query_preproc: {alias: false, symspell: false}
cutoff: {max_vector_distance: null}
csls: null
rerank: null
fallback_bm25_only: false
phase: 1
