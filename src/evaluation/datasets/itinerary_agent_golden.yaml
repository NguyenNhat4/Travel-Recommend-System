  fr: [FR-AGT-01, FR-AGT-05]
  turns:
    # EXTRACT_PROMPT: 'Không cần khách sạn' loại hotel. Lần test 24/09 lúc có lúc không có chỗ ở.
    - message: Sa Pa 3 ngày, tôi không cần khách sạn vì ở nhà người quen
