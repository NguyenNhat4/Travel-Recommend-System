      expect:
        httpStatus: 200
        status: [COMPLETED, FALLBACK]
    # Chỉ đổi ngân sách, không xin đổi món. Lỗi agent 24/09: LLM đưa toàn bộ 6 sản phẩm lượt 1 vào
