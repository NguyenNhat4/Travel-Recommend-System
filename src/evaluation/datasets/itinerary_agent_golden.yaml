# Golden dataset cho Itinerary Agent — chạy bằng src/evaluation/agent/golden.py
#
# Đối tượng: PRD docs/prd/test-plan.md §2.4 (Tool Calling Accuracy ≥ 95%, Grounding Rate 100%,
# Structured Output Integrity 100%), FR-AGT-01..05, NFR-REL-01, NFR-SEC-01.
#
# Chạy trên catalog Postgres thật (ITINERARY_DATA_MODE=http), không phải fixture — điểm đến,
# sản phẩm, giá đổi theo seed. Vì vậy `expect` chỉ ghi bất biến (status cho phép, trường intent đã
# trích, có/không có node, không có tên bịa...), KHÔNG khóa productId hay tên sản phẩm cụ thể.
# Runner tự kiểm grounding (mọi productId có thật trong `cdp.products`) và các quy tắc xếp lịch cố
# định (docs/spec/agent/langgraph-nodes.md §5) cho MỌI case COMPLETED, không cần ghi lại ở đây.
#
# `expect` (mọi trường tùy chọn, chỉ chấm cái có mặt):
#   httpStatus, status (danh sách cho phép), errorCode,
#   intent (dot-path trên response.intent hoặc response.knownIntent, ví dụ "party.adults"),
#   missingFieldsInclude (tập con bắt buộc có trong missingFields),
#   toolCalled (true/false — có node `tool` chạy không),
#   nodesInclude / nodesExclude (tên node bắt buộc có/không có trong events),
#   forbiddenText (chuỗi con không được xuất hiện ở bất cứ đâu trong response, không phân biệt hoa/thường),
#   excludeProductsFromTurn: {turn: <số lượt trước, 1-based>, role: stay|any} — productId của lượt đó
#     không được xuất hiện lại ở lượt này (đổi món theo FR-AGT-05).

