# G-051..G-075: thêm ngày 2026-09-24 sau một buổi đóng vai người dùng thật gọi
# POST /api/v1/assistant/itineraries (history/2026-09-24-bo-sung-golden-tu-test-nguoi-dung.md).
# Câu nhập lấy nguyên văn từ buổi test. Case ghi "lỗi agent 24/09" là case đang FAIL có chủ đích:
# kỳ vọng đúng handbook §9/PRD, agent chưa đạt.

- id: G-051
  category: clear_request
  fr: [FR-AGT-02, FR-AGT-03, FR-AGT-04]
  turns:
    # Câu demo "Thứ Sáu" của handbook §11 Tuần 4. Nha Trang có 63 điểm tham quan trong catalog nên
    # một lịch 3 ngày phải có ít nhất 1 hoạt động mỗi ngày. Lỗi agent 24/09: tool plan chỉ tìm hotel +
    # 5 gợi ý, không tìm điểm tham quan, ra đúng 1 voucher golf và 2 ngày trống.
    - message: Nha Trang 3 ngày cho gia đình có trẻ nhỏ
      expect:
        httpStatus: 200
        status: [COMPLETED]
        intent: {destination: Nha Trang, days: 3}
        minActivities: 3

- id: G-052
  category: intent_extraction
  fr: [FR-AGT-01, FR-AGT-03]
  turns:
    # Lỗi agent 24/09: intent đúng nhưng lịch không có hoạt động nào (3 ngày trống).
    - message: Nha Trang 3 ngày, 2 người lớn 1 bé 5 tuổi
      expect:
        httpStatus: 200
        status: [COMPLETED]
        intent: {destination: Nha Trang, days: 3, party.adults: 2, party.children: 1}
        minActivities: 3

- id: G-053
  category: intent_extraction
  fr: [FR-AGT-01]
  turns:
    # Người dùng không nói ngày đi; EXTRACT_PROMPT cấm suy ra. Lỗi agent 24/09: LLM thường gán
    # startDate = hôm nay, làm rơi sản phẩm (PRODUCT_DROPPED_DATE) và đặt check-in hôm nay.
    - message: nha trang 3n2d
      expect:
        httpStatus: 200
        intent: {destination: Nha Trang, days: 3, startDate: null}

- id: G-054
  category: intent_extraction
  fr: [FR-AGT-01]
  turns:
    - message: mình với vợ tính đi đà lạt tầm 3 hôm, thích cafe với săn mây, đừng đắt quá
      expect:
        httpStatus: 200
        status: [COMPLETED, FALLBACK]
        intent: {destination: Đà Lạt, days: 3, party.adults: 2, party.type: COUPLE}
        toolCalled: true

- id: G-055
  category: intent_extraction
  fr: [FR-AGT-01, FR-AGT-03]
  turns:
    # Số ngày suy từ khoảng ngày (tính cả hai đầu). Lỗi agent 24/09: lịch không có hoạt động nào dù
    # Hà Nội có 68 điểm tham quan.
    # Ngày dùng placeholder (2026-09-30): ngày cứng "1/10 đến 3/10" sẽ thành ngày đã qua và bị hỏi lại (G-078).
    - message: đi Hà Nội từ {today+1} đến {today+3}
      expect:
        httpStatus: 200
        status: [COMPLETED]
        intent: {destination: Hà Nội, days: 3}
        minActivities: 3

