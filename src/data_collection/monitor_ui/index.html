<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-OTA · Fresh catalog</title>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#15233b;--muted:#637187;--line:#dae2ed;--brand:#215aca;--good:#12714b;--bad:#ac2939;--warn:#825400;--soft:#eef3fa;--code:#102037;--codeink:#d8e6fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px}
header h1{font-size:20px;margin:0}header p{margin:2px 0;color:var(--muted)}
nav,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button,select,input,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px}
button{cursor:pointer}button:hover{border-color:var(--brand)}button:disabled{opacity:.5;cursor:default}
button.primary,nav button[aria-current=true],.tabs button[aria-current=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
button.danger{color:var(--bad)}button.small{padding:3px 8px;font-size:12px}
:focus-visible{outline:3px solid #84acf7;outline-offset:2px}
main{max-width:1600px;margin:20px auto;padding:0 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi strong{display:block;font-size:23px;margin:4px 0;overflow-wrap:anywhere}.kpi strong.long{font-size:15px}
.muted,small{color:var(--muted)}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.status{display:inline-block;border-radius:20px;padding:2px 9px;background:#e9eef5;font-size:12px;white-space:nowrap}
.ok,.done{background:#dff2e9;color:var(--good)}.running,.waiting,.draft{background:#e3edff;color:var(--brand)}
.failed,.dead,.error,.lost,.notRun,.empty{background:#fce6e8;color:var(--bad)}
.partial,.blocked,.timeout,.stopped,.skipped,.paused{background:#fff0d2;color:var(--warn)}
.disabled,.notInMode{background:#eef0f3;color:var(--muted)}
.embedded{background:#e3edff;color:var(--brand)}.unchanged{background:#eef0f3;color:var(--muted)}.deleted,.orphan{background:#fce6e8;color:var(--bad)}.pending{background:#fff0d2;color:var(--warn)}
.scroll{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line);max-width:380px;overflow-wrap:anywhere}
th{color:var(--muted);font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}
tr.lostrow td{background:#fff7f8}
pre{background:var(--code);color:var(--codeink);padding:14px;border-radius:9px;overflow:auto;max-height:65vh;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,monospace;margin:8px 0}
.empty-box{padding:26px;text-align:center;color:var(--muted)}
#notice{padding:0 20px;max-width:1600px;margin:12px auto;color:var(--bad);white-space:pre-wrap}
#notice.info{color:var(--good)}
.field{display:grid;grid-template-columns:minmax(200px,1fr) minmax(120px,300px);gap:12px;border-top:1px solid var(--line);padding:13px 0}
.field label{font-weight:600}.field small{display:block;font-weight:400}.field input:not([type=checkbox]){width:100%}
.badge-row{display:flex;gap:7px;flex-wrap:wrap}
.link{color:var(--brand);border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.pager{display:flex;align-items:center;gap:12px;margin-top:12px}
dialog{border:1px solid var(--line);border-radius:12px;width:min(1150px,96vw);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:#13233d99}dialog .actions{justify-content:flex-end}
details{margin:10px 0}summary{cursor:pointer}
#connection{font-size:12px;color:var(--muted)}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:110px;margin:3px 0}
.bar>i{display:block;height:100%;background:var(--brand)}
.pipeline{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.stage{flex:1 1 170px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);text-align:left}
.stage strong{display:block;font-size:20px}.stage:hover{border-color:var(--brand)}
.arrow{align-self:center;color:var(--muted)}
.logbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.logbox{background:var(--code);color:var(--codeink);border-radius:9px;padding:10px 12px;height:66vh;overflow:auto;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.logbox .w{color:#ffd479}.logbox .e{color:#ff8a8a}.logbox .s{color:#8fd1ff}.logbox .g{color:#9be3b0}.logbox .d{color:#7f93b0}
.tag{display:inline-block;min-width:74px;color:#b9c7ff}
.live-row{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(260px,2fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.live-row input{width:90px}
.diff td:first-child{white-space:nowrap;font-family:ui-monospace,monospace;font-size:12px}
.minus{color:var(--bad)}.plus{color:var(--good)}.wtext{color:var(--warn)}
.hint{background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;color:var(--muted)}
.vec{display:flex;gap:2px;align-items:center;height:36px}
.vec i{display:block;width:10px;background:var(--brand)}
.vec i.neg{background:var(--bad)}
.gwrap{overflow-x:auto;padding:2px}
.graph{position:relative;display:grid;gap:10px 30px;min-width:1100px;align-items:center}
.graph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.graph svg path{fill:none;stroke:#9aaac0;stroke-width:1.5}.graph svg path.bad{stroke:var(--bad);stroke-width:2.5}
.problem{display:block;width:100%;text-align:left;background:#fce6e8;border:1px solid #f3b7bf;border-radius:9px;padding:9px 12px;margin:0 0 12px;color:var(--ink)}.problem:hover{border-color:var(--bad)}
.ghead{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.gcell{display:flex;flex-direction:column;gap:8px}
.node{position:relative;z-index:1;display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--panel)}
.node b{display:block;font-size:13px;line-height:1.3;margin-bottom:3px}.node small{display:block;margin-top:3px}
.node[aria-pressed=true]{outline:3px solid var(--brand);outline-offset:1px}
.node.faded{opacity:.55}.node .status.notRun,#nodeHead .status.notRun{background:#eef0f3;color:var(--muted)}
.node[data-st=ok]{border-left-color:var(--good)}.node[data-st=running],.node[data-st=waiting],.node[data-st=draft]{border-left-color:var(--brand)}
.node[data-st=error],.node[data-st=dead],.node[data-st=failed]{border-left-color:var(--bad)}
.node[data-st=blocked],.node[data-st=timeout],.node[data-st=stopped],.node[data-st=skipped]{border-left-color:#d69a00}
.substeps{display:grid;gap:4px;max-width:900px}.substeps .arrow{justify-self:start;margin-left:18px}
.substep{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:9px;padding:8px 12px}.substep p{margin:4px 0}
.substep[data-st=ok]{border-left-color:var(--good)}.substep[data-st=running]{border-left-color:var(--brand)}.substep[data-st=error]{border-left-color:var(--bad)}
.node small.sub{color:var(--brand)}
/* % hoàn thành: nền ô tô tới --p (đang chạy: đã làm / tổng; xong: phần thành công / tổng) */
.pf{--pf:#dff3e8;background:linear-gradient(90deg,var(--pf) var(--p),var(--panel) var(--p))}
.pf[data-st=running],.pf[data-st=waiting],.pf[data-st=draft]{--pf:#dce8ff}
.pf[data-st=error],.pf[data-st=dead],.pf[data-st=failed]{--pf:#fbe0e3}
.pf[data-st=partial],.pf[data-st=blocked],.pf[data-st=timeout],.pf[data-st=stopped]{--pf:#ffefc7}
.pf[data-low]{--pf:#ffefc7}
.pind{background:repeating-linear-gradient(135deg,#eef3fe 0 10px,var(--panel) 10px 20px);background-size:28px 28px;animation:pind 1.2s linear infinite}
@keyframes pind{to{background-position:28px 0}}
@media (prefers-reduced-motion:reduce){.pind{animation:none}}
.pct{font-variant-numeric:tabular-nums;font-weight:600}
.node .more{color:var(--brand)}
.xnode{display:flex;flex-direction:column;gap:6px}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px;padding:6px;border:1px dashed var(--line);border-radius:9px;background:var(--soft)}
.chain .arr{align-self:center;color:var(--muted);font-size:13px}
.sx{flex:0 0 132px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px;line-height:1.3}
.sx:not(.pf):not(.pind){background:var(--panel)}
.sx b{display:block;font-size:12px}.sx small{display:block;color:var(--muted)}
.sx[data-st=ok]{border-left-color:var(--good)}.sx[data-st=running]{border-left-color:var(--brand)}
.sx[data-st=error]{border-left-color:var(--bad)}.sx[data-st=partial],.sx[data-st=skipped]{border-left-color:#d69a00}
.sx[data-planned],.substep[data-planned]{opacity:.6;border-style:dashed}
.strip{display:flex;gap:3px}.cell{display:inline-block;width:22px;height:18px;padding:0;border-radius:4px;border:1px solid var(--line);background:#eef0f3;cursor:pointer}
.cell[data-st=ok]{background:#9bd9bb;border-color:#7cc8a4}.cell[data-st=running],.cell[data-st=waiting],.cell[data-st=draft]{background:#a9c5ff;border-color:#86abf5}
.cell[data-st=error],.cell[data-st=dead],.cell[data-st=failed]{background:#f19aa6;border-color:#e27584}.cell[data-st=blocked],.cell[data-st=timeout],.cell[data-st=stopped],.cell[data-st=skipped]{background:#ffd27a;border-color:#eab54a}
.legend{display:inline-flex;align-items:center;gap:4px;font-size:12px}.legend .cell{width:14px;height:12px;cursor:default}
.mini .graph{min-width:980px;gap:6px 24px}.mini .node{padding:4px 7px}.mini .node b{font-size:12px}.mini .node small{font-size:11px}
#controls{margin-top:8px}
.facts{display:flex;gap:6px 18px;flex-wrap:wrap;margin:8px 0}.facts span small{margin-right:4px}
@media(max-width:700px){header{padding:14px 16px}main{padding:0 12px}.field,.live-row{grid-template-columns:1fr}th,td{padding:6px}.card{padding:13px}
 .graph{display:flex;flex-direction:column;align-items:stretch;min-width:0;gap:6px}.graph svg{display:none}.ghead{margin-top:10px}}
.dbgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,4fr);align-items:start}.dbgrid>.card{min-width:0}@media (max-width:900px){.dbgrid{grid-template-columns:minmax(0,1fr)}}
.rt td{white-space:nowrap}
#dbDiagram svg{display:block;font:12px system-ui,sans-serif}#dbDiagram .tbl{cursor:pointer}#dbDiagram .tbl rect.box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
#dbDiagram .tbl.view rect.box{stroke-dasharray:4 3}#dbDiagram .tbl:hover rect.box,#dbDiagram .tbl.on rect.box{stroke:var(--brand);stroke-width:2}
#dbDiagram rect.head{fill:var(--soft)}#dbDiagram .edge{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.45}#dbDiagram .edge.conv{stroke-dasharray:5 4}
#dbDiagram .edge.on{stroke:var(--brand);stroke-width:2.2;opacity:1}#dbDiagram .edge.dim{opacity:.1}#dbDiagram text.pk{fill:var(--warn);font-weight:700}#dbDiagram text.fk{fill:var(--brand)}
#dbDiagram text.sec{fill:var(--muted);font-style:italic}#dbDiagram .schema{fill:var(--muted);font-weight:700;font-size:13px;letter-spacing:.06em}
</style>
</head>
<body>
<header><h1>V-OTA <span class="muted">/ Fresh catalog</span></h1><p>Theo dõi cào → chuẩn hoá → nạp Postgres → embed/index Weaviate</p><div id="connection" aria-live="polite">Đang kết nối…</div>
<nav aria-label="Điều hướng"><button data-view="overview" aria-current="true">Tổng quan</button><button data-view="runs">Lịch sử</button><button data-view="system">Hệ thống</button><button data-view="storage">Dung lượng</button><button data-view="settings">Cấu hình</button><button data-view="db">DB</button><button data-view="realtime">Realtime</button></nav>
<div id="controls" class="actions" aria-label="Điều khiển lượt"><button type="button" class="primary" data-action="start" data-args='{"mode":"auto"}' title="full hoặc daily theo chu kỳ trong Cấu hình">Chạy theo chu kỳ</button><button type="button" data-action="start" data-args='{"mode":"full"}'>Cào lớn</button><button type="button" data-action="start" data-args='{"mode":"daily"}'>Làm mới Trip</button><button type="button" data-action="start" data-args='{"mode":"index"}'>Bảo trì và index</button><button type="button" class="danger" data-action="stop" data-args='{}'>Dừng lượt đang chạy</button><span id="controlState"></span></div>
</header>
<div id="notice" role="alert"></div><main id="main" aria-live="polite"></main>
<dialog id="detail"><h2 id="detailTitle">Chi tiết</h2><div id="detailBody"></div><div class="actions"><button id="closeDetail">Đóng</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), main=$('#main');
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=v=>`<pre>${esc(typeof v==='string'?v:JSON.stringify(v,null,2))}</pre>`;
const labels={ok:'Xong',running:'Đang chạy',partial:'Chưa đủ dữ liệu',failed:'Thất bại',dead:'Mất tiến trình',stopped:'Đã dừng',error:'Lỗi',blocked:'Bị chặn',timeout:'Quá giờ',unknown:'Chưa rõ',
 waiting:'Chờ tới lượt',skipped:'Bị bỏ qua',notRun:'Không chạy',noData:'Chưa ghi số liệu',empty:'Không có dữ liệu',disabled:'Đã tắt',notInMode:'Không thuộc lượt',
 lost:'Mất nguồn',draft:'Đang gộp dần',embedded:'Nhúng mới',unchanged:'Giữ nguyên',deleted:'Đã xoá',orphan:'Mồ côi',pending:'Chưa nhúng',paused:'Tạm dừng'};
const reasons={new:'sản phẩm mới',text:'text đổi',model:'đổi model',uuid:'dời id object'};
const badge=v=>`<span class="status ${esc(v)}">${esc(labels[v]||v)}</span>`;
const when=v=>v?new Date(v).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}):'—';
const bytes=n=>n>1048576?`${(n/1048576).toFixed(1)} MB`:`${Math.round((n||0)/1024)} KB`;
const num=n=>n==null?'—':Number(n).toLocaleString('vi-VN');
const button=(label,action,args={},css='')=>`<button type="button" class="${css}" data-action="${action}" data-args="${esc(JSON.stringify(args))}">${esc(label)}</button>`;
const card=(title,body,extra='')=>`<section class="card" ${extra}><h2>${esc(title)}</h2>${body}</section>`;
const table=(heads,rows,rowClass=()=> '')=>rows.length?`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${rowClass(i)}">${r.map(c=>`<td>${c??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty-box">Chưa có dữ liệu.</div>';
const bar=(done,total)=>total?`<div class="bar"><i style="width:${Math.min(100,Math.round(100*done/total))}%"></i></div>`:'';
const select=(name,options,value,all='Tất cả')=>`<select name="${esc(name)}" aria-label="${esc(name)}"><option value="">${esc(all)}</option>${Object.entries(options||{}).map(([k,n])=>`<option value="${esc(k)}" ${k===value?'selected':''}>${esc(k)} (${num(n)})</option>`).join('')}</select>`;
const S={expanded:new Set(),view:'overview',run:null,tab:null,node:null,graph:null,gtimer:null,timer:null,es:null,list:null,runData:null,preview:false,log:{lines:[],group:'',level:'',q:'',step:'',sub:'',follow:true,paused:false,ended:false},settings:null};

const PREVIEWABLE=/^\/api\/(normalise|products?|cities)(\/|$)/;
async function api(path,params={},body){const url=new URL(path,location.origin);if(S.view==='run'&&S.preview&&PREVIEWABLE.test(path))url.searchParams.set('preview','1');Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')url.searchParams.set(k,v)});const response=await fetch(url,{cache:'no-store',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'vota-monitor'},body:JSON.stringify(body)})});const data=await response.json();if(!response.ok)throw Error(typeof data.error==='string'?data.error:JSON.stringify(data.error||data));return data}
function notice(text,info=false){const n=$('#notice');n.textContent=text||'';n.className=info?'info':''}
function fail(error){notice(error.message||String(error))}
function modal(title,html){$('#detailTitle').textContent=title;$('#detailBody').innerHTML=html;if(!$('#detail').open)$('#detail').showModal()}
function stopLive(){clearInterval(S.timer);S.timer=null;if(S.es){S.es.close();S.es=null}}

// ------------------------------------------------------------------ cảnh báo và SLA (CP7, CP8)
const ALERT_KINDS={transient:'Lỗi tạm thời',blocked:'Bị chặn',timeout:'Quá giờ',code:'Lỗi code',quality:'Chặn chất lượng',infra:'Lỗi hạ tầng',unknown:'Chưa phân loại',record:'Bản ghi lỗi',sla:'SLA',coverage:'Cào chưa đủ'};
const SLA_STATE={ok:['ok','Đạt'],late:['error','Trễ'],pending:['waiting','Chưa tới hạn'],none:['notInMode','Không áp dụng']};
function alertRows(list,showRun=true){return table(['Lúc','Mức','Loại',...(showRun?['Lượt']:[]),'Bước · nguồn','Nội dung'],list.map(a=>[esc(when(a.at)),`<span class="status ${a.level==='error'?'error':'partial'}">${a.level==='error'?'Lỗi':'Cảnh báo'}</span>`,esc(ALERT_KINDS[a.kind]||a.kind),...(showRun?[a.run?button(a.run,'run',{id:a.run,node:a.step},'link'):'—']:[]),esc([a.step,a.source].filter(Boolean).join(' · ')||'—'),esc(a.message)]))}
function alertsCard(list){const L=S.alertFilter||{};const shown=(list||[]).filter(a=>(!L.level||a.level===L.level)&&(!L.kind||a.kind===L.kind));
 const kinds=[...new Set((list||[]).map(a=>a.kind))];
 return card(`Cảnh báo (${(list||[]).length})`,(list||[]).length?`<div class="actions"><select data-alert="level" aria-label="Mức"><option value="">Mọi mức</option><option value="error" ${L.level==='error'?'selected':''}>Lỗi</option><option value="warning" ${L.level==='warning'?'selected':''}>Cảnh báo</option></select><select data-alert="kind" aria-label="Loại"><option value="">Mọi loại</option>${kinds.map(k=>`<option value="${esc(k)}" ${L.kind===k?'selected':''}>${esc(ALERT_KINDS[k]||k)}</option>`).join('')}</select><small class="muted">Chưa gửi ra ngoài (Telegram / email chưa cấu hình); cảnh báo giống hệt trong thời gian chờ (Cấu hình) không lặp lại.</small></div>`+alertRows(shown):'<p class="muted">Chưa có cảnh báo nào.</p>')}
function slaLine(sla){if(!sla)return '';if(sla.error)return `<p class="muted">SLA: ${esc(sla.error)}</p>`;if(!sla.enabled)return '<p class="muted">SLA đang tắt (Cấu hình → Cảnh báo và SLA).</p>';
 return `<div class="badge-row"><strong>SLA hôm nay</strong>${(sla.rules||[]).map(r=>{const [cls,label]=SLA_STATE[r.state]||['',r.state];return `<span class="status ${cls}" title="${esc(r.message)}">${esc(r.rule==='finishBy'?'Xong trong ngày':'Catalog tươi')}: ${esc(label)}</span>`}).join('')}</div><p class="muted">${(sla.rules||[]).map(r=>esc(r.message)).join(' · ')}</p>`}

// ------------------------------------------------------------------ tổng quan
// UI4 (docs/plan/2026-09-28-monitor-so-do-luong.md): mỗi lượt một dòng, dải ô = trạng thái xấu nhất của 7 cột sơ đồ
const COLS=[['prepare','Chuẩn bị'],['crawl','Cào'],['normalise','Chuẩn hoá'],['merge','Gộp'],['validate','Kiểm tra'],['db','Nạp DB'],['index','Index']];
const SEV={notInMode:0,disabled:1,notRun:2,ok:3,skipped:4,waiting:5,draft:6,running:6,stopped:7,blocked:8,dead:9,error:10};
const dur=n=>n==null?'—':n<60?`${n} s`:n<3600?`${Math.floor(n/60)} ph ${n%60} s`:`${Math.floor(n/3600)} g ${Math.floor(n%3600/60)} ph`;
function stripHtml(r){if(!r.strip)return '<small class="muted">chỉ còn tóm tắt</small>';
 return `<div class="strip">${COLS.map(([c,l])=>{const st=r.strip[c]||'notRun';const detail=(r.stripDetail?.[c]||[]).map(([n,x])=>`${n}: ${labels[x]||x}`).join('\n');
  return `<button type="button" class="cell" data-st="${esc(st)}" data-action="run" data-args="${esc(JSON.stringify({id:r.id,col:c}))}" title="${esc(`${l}: ${labels[st]||st}${detail?'\n'+detail:''}`)}" aria-label="${esc(`${l}: ${labels[st]||st}`)}"></button>`}).join('')}</div>`}
function historyTable(runs){return table(['Bắt đầu (VN)','Chế độ','Trạng thái','Các bước','Thời gian','Sản phẩm','So với lượt trước cùng chế độ','Lượt'],
 runs.map(r=>[esc(when(r.startedAt)),esc(r.mode),badge(r.status),r.retained?stripHtml(r):'<small class="muted">đã xoá dữ liệu</small>',esc(dur(r.seconds)),num(r.products),
  r.productsDelta==null?'—':`<span class="${r.productsDelta<0?'minus':r.productsDelta>0?'plus':''}">${r.productsDelta>0?'+':''}${num(r.productsDelta)}</span>`,
  r.retained?button(r.id,'run',{id:r.id},'link'):`<small>${esc(r.id)}</small>`]))}
const stripLegend=()=>`<div class="badge-row"><small class="muted">Màu ô:</small>${['ok','running','error','blocked','notRun'].map(x=>`<span class="legend"><i class="cell" data-st="${x}"></i>${esc(labels[x])}</span>`).join('')}<small class="muted">7 ô theo thứ tự: chuẩn bị → cào → chuẩn hoá → gộp → kiểm tra → nạp DB → index. Di chuột lên ô để xem từng nguồn; bấm ô để mở lượt ở bước đó.</small></div>`;
async function historyPage(){const L=S.runFilter||{};const all=await api('/api/runs',{limit:200});const rows=all.filter(r=>(!L.mode||r.mode===L.mode)&&(!L.status||r.status===L.status));
 const opt=(name,values,all)=>`<select data-runfilter="${name}" aria-label="${esc(all)}"><option value="">${esc(all)}</option>${[...new Set(values)].map(v=>`<option value="${esc(v)}" ${L[name]===v?'selected':''}>${esc(labels[v]||v)}</option>`).join('')}</select>`;
 main.innerHTML=card(`Lịch sử (${rows.length}/${all.length} lượt)`,`<div class="actions">${opt('mode',all.map(r=>r.mode),'Mọi chế độ')}${opt('status',all.map(r=>r.status),'Mọi trạng thái')}</div>${stripLegend()}`+historyTable(rows))}

function targetsCard(t){if(!t)return '';const local=t.localOnly?'<span class="status ok">Chế độ local: chỉ ghi vào localhost, không đụng vota/Product</span>':'';
 return card('Nơi lượt kế tiếp ghi dữ liệu',`<div class="badge-row">${local}<span class="status">DB_TARGET: ${esc(t.dbTarget)}</span><span class="status">Postgres: ${esc(t.db)}</span><span class="status">Weaviate: ${esc(t.weaviate)}</span><span class="status">Collection: ${esc(t.collection)}</span></div>${t.error?`<p class="muted">${esc(t.error)}</p>`:''}`)}
// UI5: Tổng quan chỉ còn lượt hiện tại (sơ đồ thu nhỏ), lượt kế tiếp, cảnh báo + SLA; phần kỹ thuật sang trang Hệ thống
async function overview(){const d=await api('/api/overview');const running=d.running;S.overviewAlerts=d.alerts;setControls(running);
 const current=running?.runId||d.runs.find(r=>r.retained)?.id;let g=null;if(current){try{g=await api('/api/graph',{run:current})}catch(e){g=null}}
 if(S.view!=='overview')return;S.miniRun=current;S.graph=g;S.node=null;
 const head=running?`<strong>Đang chạy</strong> ${badge(running.stale?'dead':'running')} ${esc(running.mode||'')} <small class="muted">${esc(running.runId||'đang khởi động')} · bước: ${esc((running.steps||[]).join(', ')||'—')}</small>`
  :current?`<strong>Lượt gần nhất</strong> ${badge(g?.status||'unknown')} <small class="muted">${esc(current)}</small>`:'<strong>Chưa có lượt nào</strong>';
 main.innerHTML=card('Hiện tại',`<div class="meta">${head}${current?button('Mở lượt','run',{id:current},'primary small'):''}</div>`+(g?`<div class="mini">${problemHtml(g)}${graphHtml(g)}</div>`:'')+
   `<div class="grid" style="margin-top:12px">${[['Lượt theo lịch kế tiếp',d.nextRun?.mode||'Đã tắt',d.nextRun?when(d.nextRun.at):'Bật ở Cấu hình → Lịch chạy'],['Cào lớn gần nhất',d.lastFull||'—','ngày (giờ Việt Nam)']].map(([l,v,sub])=>`<div class="card kpi"><small>${esc(l)}</small><strong class="long">${esc(v)}</strong><small>${esc(sub)}</small></div>`).join('')}</div>`+
   (d.stream?`<div style="margin-top:10px">${streamPresetHtml(d.stream)}</div>`:'')+
   (d.settingsError?`<p class="minus">${esc(d.settingsError)}</p>`:'')+(d.spawned?.launchLog?`<p class="minus">Khởi chạy lượt lỗi (mã ${esc(d.spawned.returncode)}):</p>`+pretty(d.spawned.launchLog.join('\n')):''))+
  card('Cảnh báo và SLA',slaLine(d.sla))+alertsCard(d.alerts);
 drawEdges()}
async function system(){const [d,h]=await Promise.all([api('/api/overview'),api('/api/trip-hotels').catch(e=>({error:e.message}))]);if(S.view!=='system')return;
 main.innerHTML=targetsCard(d.targets)+
  card('Biến kết nối',`<div class="badge-row">${Object.entries(d.env).map(([key,value])=>`<span class="status">${esc(key)}: ${typeof value==='boolean'?(value?'đã đặt':'chưa đặt'):esc(value)}</span>`).join('')}</div>`)+
  card('Dữ liệu giữ lại',`<p><strong>${esc(bytes(d.diskBytes))}</strong> <small class="muted">raw, interim, catalog và báo cáo của các lượt còn giữ (Cấu hình → Lưu trữ và log)</small></p>`)+
  card('Log chạy',table(['File','Cập nhật','Mã thoát'],d.runnerLogs.map(r=>[button(r.name,'runnerlog',{name:r.name},'link'),esc(when(r.modifiedAt)),esc(r.exitCode)])))+
  (h.error?card('Khách sạn Trip · xoay vòng',`<p class="muted">${esc(h.error)}</p>`):hotelsCard(h,d.tripHotelIds))}
// UI5: nút chạy / dừng lượt luôn ở thanh trên; trạng thái lấy từ /api/live mỗi 5 giây ở mọi trang
function setControls(running){S.globalRunning=running;document.querySelectorAll('#controls [data-action=start]').forEach(b=>b.disabled=!!running);const stop=$('#controls [data-action=stop]');if(stop)stop.disabled=!running||running.starting;
 const st=$('#controlState');if(st)st.innerHTML=running?`${badge('running')} <small>${esc(running.runId||running.mode||'')}</small>`:'<small class="muted">Không có lượt nào đang chạy</small>'}
async function pollControls(){try{const l=await api('/api/live');setControls(l.running?{runId:l.runId}:null)}catch(e){}}

// ------------------------------------------------------------------ một lượt
// Sơ đồ luồng (docs/plan/2026-09-28-monitor-so-do-luong.md): ô và đường nối tính ở server (/api/graph); bấm một ô thì
// panel bên dưới chỉ hiện những phần của bước đó. Các hàm tab* bên dưới vẽ vào #tab của panel.
const NS='normalise.source:',NORMALISE_ALL='normalise.sources',FADED=new Set(['notInMode','disabled','notRun']);
const RUN_VIEWS=['log','flow','stream','reports'];
const VIEW_LABELS={feed:'Các lô theo phần',stream:'Chạy liên tục',steps:'Các bước bên trong',flow:'Tiến độ & tốc độ',sources:'Raw / interim',cities:'Theo thành phố',log:'Log',normalise:'Chuẩn hoá',errors:'Bản ghi lỗi',products:'Catalog cuối',db:'Trước → sau',embed:'Embedding',reports:'Báo cáo',detail:'Chi tiết bước'};
const LANE_LOG={vinpearl:'vinpearl',tripFlights:'trip',tripAttractions:'trip',booking:'booking',agoda:'agoda',tripHotels:'tripHotels'};
function nodeViews(n){if(!n)return RUN_VIEWS;if(n.col==='crawl')return ['flow','sources','cities','log'];if(n.col==='normalise')return n.id===NORMALISE_ALL?['steps','normalise','log']:['steps','errors','normalise','log'];
 return {merge:['steps','normalise','products','cities','log'],validate:['reports','log'],db:n.stream?['feed','db','log']:['db','log'],index:n.stream?['feed','embed','log']:['embed','log']}[n.col]||['detail','log']}
const STREAM_KEY={merge:'stream.merge',db:'stream.db',index:'stream.index'};
const streamKey=n=>!n?null:n.id.startsWith(NS)?'stream.normalise':STREAM_KEY[n.col]||null;
function streamControl(e){if(!e)return '';if(!e.enabled)return `<p class="muted">${esc(e.label)}: đang tắt trong Cấu hình của lượt này.</p>`;
 return `<div class="live-row" data-stream="${esc(e.key)}"><div><strong>${esc(e.label)}</strong>${e.paused?' '+badge('paused'):''}<br><small>chu kỳ của lượt ${esc(e.base)} s${e.override?` · đang chỉnh ${esc(e.override)} s`:''}</small></div><div><label>Giây giữa hai lô <input type="number" min="${esc(e.minimum)}" max="${esc(e.maximum)}" step="1" value="${esc(e.value)}" data-interval aria-label="${esc(e.label)}: giây giữa hai lô"></label><br><small>áp từ lô kế tiếp; tạm dừng thì dữ liệu dồn sang lô sau</small></div><div class="actions" style="margin:0">${button('Áp dụng','streamSet',{key:e.key},'primary small')}${button('Về cấu hình lượt','streamSet',{key:e.key,reset:true},'small')}${button(e.paused?'Chạy tiếp':'Tạm dừng','streamPause',{key:e.key,paused:!e.paused},e.paused?'primary small':'danger small')}${e.paused?'':button(e.key==='stream.normalise'?'Chuẩn hoá ngay':'Chạy ngay','streamKick',{key:e.key},'small')}</div></div>`}
const RESUME_LABEL={crawl:'Cào lại nguồn này',normalise:'Chạy lại từ bước này',merge:'Chỉ gộp lại từ checkpoint',validate:'Chạy lại từ bước này',db:'Chạy lại từ bước này',index:'Chạy lại từ bước này'};
function resumeButtons(n){if(!n?.resume?.length)return '';const crawl=n.resume.includes('crawl');return `<div class="actions">${n.resume.map(f=>button(RESUME_LABEL[f],'resume',f==='crawl'?{run:S.run,from:f,source:n.lane}:{run:S.run,from:f},f==='merge'?'small':'primary small')).join('')}<small class="muted">${crawl?'Chỉ cào lại nguồn này (tiếp tục từ tiến độ đã lưu), dùng lại dữ liệu của các nguồn khác rồi chạy tiếp tới nạp DB và index.':'Không cào lại; dùng lại interim, checkpoint, catalog của lượt này rồi chạy tiếp tới nạp DB và index.'}</small></div>`}
function nodeStreamControl(n){const key=streamKey(n);if(!key||S.runData?.status!=='running'||!S.live?.running||S.live.runId!==S.run)return '';return streamControl((S.live.stream||[]).find(x=>x.key===key))}
const BIG_STEPS=new Set(['maintain','normalise','validate','db','index']);  // log: catalog.step.* + catalog.substep name=<bước>:… (stepLine)
function nodeLog(n){const f={group:'',q:'',step:'',sub:''};if(!n)return f;if(n.col==='crawl')return {...f,group:LANE_LOG[n.lane]||''};if(n.id.startsWith(NS))return {...f,q:`[normalise:${n.id.slice(NS.length)}]`};if(BIG_STEPS.has(n.id))return {...f,step:n.id};return {...f,group:'job'}}
const currentNode=()=>S.graph?.nodes.find(n=>n.id===S.node)||null;
const stepOf=id=>[...(S.runData?.steps||[])].reverse().find(s=>s.name===id);
// UI6: % hoàn thành (node.progress / bước con .percent) — đang chạy chưa biết tổng thì sọc chạy
function fillAttrs(p,st){if(p?.percent!=null)return ` style="--p:${Math.max(0,Math.min(100,p.percent))}%"${p.percent<90&&['ok','partial'].includes(st)?' data-low':''}`;return ''}
function fillClass(p,st){return p?.percent!=null?' pf':(st==='running'?' pind':'')}  // chỉ ô đang chạy mới có sọc; ô chờ để trắng
function pctText(p){if(!p)return '';const r=p.done!=null&&p.total!=null?`${num(p.done)}/${num(p.total)}`:'';if(p.percent==null)return r?`<span class="pct">${r}</span>`:'';
 return `<span class="pct">${Math.round(p.percent*10)/10}%</span>${r?` · ${r}`:''}${p.kind==='progress'?' đã làm':''}`}
function subHtml(x,parent){// vào → ra (bớt = dòng bị lọc / gộp); bước chỉ sửa dòng có sẵn: "N dòng · M đổi"
 const io=x.changed!=null?`${x.in!=null?`${num(x.in)} dòng · `:''}${num(x.changed)} đổi`:(x.in!=null||x.out!=null?`${x.in!=null?num(x.in):'—'} → ${x.out!=null?num(x.out):'—'}`:'');
 const dropped=x.changed==null&&x.in!=null&&x.out!=null&&x.out<x.in?` <span class="wtext">(bớt ${num(x.in-x.out)})</span>`:'';
 const okt=x.ok!=null&&x.total?`<span class="pct">${x.percent}%</span> · ${num(x.ok)}/${num(x.total)} đạt`:'';
 const tip=[x.description,x.note,x.error].filter(Boolean).join('\n');
 return `<button type="button" class="sx${fillClass(x,x.status)}" data-subof="${esc(parent)}" data-sub="${esc(x.name)}" data-st="${esc(x.status)}"${x.planned?' data-planned':''}${fillAttrs(x,x.status)} title="${esc((x.status==='noData'?'Bước con đã chạy cùng bước lớn, nhưng lượt này chạy trước khi job ghi số liệu từng bước con (từ 08/10/2026).\n':x.planned?'Chưa có số liệu ở lượt này.\n':'')+(tip?tip+'\n':'')+'Bấm để xem log của bước này')}"><b>${esc(x.name)}</b><small>${esc(labels[x.status]||x.status)}${x.seconds!=null?` · ${esc(x.seconds)} s`:''}${x.ramMb!=null?` · RAM ${num(x.ramMb)} MB`:''}</small>${io?`<small>${io}${dropped}</small>`:''}${okt?`<small>${okt}</small>`:''}${x.note?`<small>${esc(x.note)}</small>`:''}${x.error?`<small class="minus">${esc(x.error)}</small>`:''}</button>`}
function chainHtml(n){return `<div class="chain" aria-label="Các bước bên trong ${esc(n.label)}">${n.substeps.map(x=>subHtml(x,n.id)).join('<span class="arr" aria-hidden="true">→</span>')}</div>`}
const expandable=n=>S.view==='run'&&(n.substeps||[]).length>0;
function nodeHtml(n){const bits=[];const secs=n.seconds??(n.status==='running'&&n.startedAt?Math.round((Date.now()-new Date(n.startedAt))/1000):null);if(secs!=null)bits.push(`${esc(secs)} s`);
 if(n.in!=null)bits.push(`${num(n.in)} → ${num(n.out)}`);else if(n.out!=null)bits.push(`${num(n.out)} dòng`);
 if(n.errors)bits.push(`<span class="minus">${num(n.errors)} lỗi</span>`);if(n.retries)bits.push(`thử lại ${esc(n.retries)}`);
 if(n.stream)bits.push(`theo phần: ${esc(n.stream.batches)} lô${n.stream.dbRowsWritten!=null?` · ${num(n.stream.dbRowsWritten)} dòng ghi`:''}`);
 const dr=n.draft?`<small>đang gộp: lần ${esc(n.draft.n)}${n.draft.rows!=null?` · ${num(n.draft.rows)} dòng`:''}${n.draft.groups?.length?` · xong: ${esc(n.draft.groups.join(', '))}`:''}</small>`:'';
 const pt=pctText(n.progress),rf=n.refresh?`<small>làm mới khách sạn đang có ${num(n.refresh.refreshed)}/${num(n.refresh.requested)} (${esc(n.refresh.percent)}%)</small>`:'';
 const open=S.expanded?.has(n.id),more=expandable(n)?`<small class="more">${open?'▾ thu lại':'▸'} ${n.substeps.length} bước bên trong</small>`:'';
 const btn=`<button type="button" class="node${FADED.has(n.status)?' faded':''}${fillClass(n.progress,n.status)}" data-node="${esc(n.id)}" data-st="${esc(n.status)}"${fillAttrs(n.progress,n.status)} aria-pressed="${n.id===S.node}"${expandable(n)?` aria-expanded="${!!open}"`:''} title="${esc(n.error||n.label)}"><b>${esc(n.label)}</b>${badge(n.status)}${pt?`<small>${pt}</small>`:''}${bits.length?`<small>${bits.join(' · ')}</small>`:''}${rf}${dr}${n.substep?`<small class="sub">đang: ${esc(n.substep)}</small>`:''}${n.note?`<small class="sub">${esc(n.note)}</small>`:''}${more}</button>`;
 return open&&expandable(n)?`<div class="xnode">${btn}${chainHtml(n)}</div>`:btn}
function problemHtml(g){const p=g.problem;if(!p)return '';const kind=p.errorKind?kindBadge(p.errorKind)+' ':'';
 const body=`<strong>${p.status==='blocked'?'Bị chặn':'Lỗi'} ở: ${esc(p.label)}</strong> ${kind}<br><small>${esc((p.error||labels[p.status]||p.status||'').slice(0,300))}</small>`;
 return p.id?`<button type="button" class="problem" data-node="${esc(p.id)}">${body} <small class="muted">— bấm để xem</small></button>`:`<div class="problem">${body}</div>`}
function graphHtml(g){const ci=Object.fromEntries(g.columns.map((c,i)=>[c.id,i])),li=Object.fromEntries(g.lanes.map((l,i)=>[l.id,i])),rows=g.lanes.length,cells=new Map();
 for(const n of g.nodes){const k=`${n.col}|${n.lane??''}`;if(!cells.has(k))cells.set(k,{col:n.col,lane:n.lane,nodes:[]});cells.get(k).nodes.push(n)}
 const heads=g.columns.map((c,i)=>`<div class="ghead" style="grid-column:${i+1};grid-row:1;order:${i*100}">${esc(c.label)}</div>`).join('');
 const body=[...cells.values()].map(c=>{const i=ci[c.col],lane=c.lane==null?null:li[c.lane];return `<div class="gcell" style="grid-column:${i+1};grid-row:${lane==null?`2 / span ${rows}`:lane+2};order:${i*100+1+(lane??0)}">${c.nodes.map(nodeHtml).join('')}</div>`}).join('');
 const wide=g.columns.map(c=>{const subs=Math.max(0,...g.nodes.filter(n=>n.col===c.id&&S.expanded?.has(n.id)&&expandable(n)).map(n=>n.substeps.length));
  return subs?`minmax(${Math.min(subs,3)*150+12}px,${Math.min(subs,3)}fr)`:'minmax(140px,1fr)'}).join(' ');  // chuỗi xuống dòng sau 3 ô
 return `<div class="gwrap"><div class="graph" id="graph" style="grid-template-columns:${wide};grid-template-rows:auto repeat(${rows},auto)"><svg id="edges" aria-hidden="true"></svg>${heads}${body}</div></div>`}
function drawEdges(){const gr=$('#graph'),svg=$('#edges');if(!gr||!svg||!S.graph||getComputedStyle(svg).display==='none')return;const box=gr.getBoundingClientRect();
 const bad=new Set(S.graph.nodes.filter(n=>['error','dead'].includes(n.status)).map(n=>n.id));  // UI3: đường tới ô lỗi tô đỏ
 const at=id=>gr.querySelector(`[data-node="${CSS.escape(id)}"]`);
 svg.innerHTML=S.graph.edges.map(([a,b])=>{const A=at(a),B=at(b);if(!A||!B)return '';const p=A.getBoundingClientRect(),q=B.getBoundingClientRect();
  if(Math.abs(p.left-q.left)<4){const x=p.left+p.width/2-box.left;return `<path class="${bad.has(b)?'bad':''}" d="M${x},${p.bottom-box.top} L${x},${q.top-box.top}"/>`}
  const x1=p.right-box.left,y1=p.top+p.height/2-box.top,x2=q.left-box.left,y2=q.top+q.height/2-box.top,m=(x1+x2)/2;return `<path class="${bad.has(b)?'bad':''}" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/>`}).join('')}
function panelHead(){const n=currentNode(),views=nodeViews(n),st=n&&stepOf(n.id);
 const facts=n?[['Bắt đầu',when(n.startedAt)],['Kết thúc',when(n.finishedAt)],['Giây',n.seconds??'—'],['Vào → ra',n.in!=null||n.out!=null?`${num(n.in)} → ${num(n.out)}`:'—'],['Bản ghi lỗi',n.errors==null?'—':num(n.errors)],['Thử lại',n.retries||0]]:[];
 return `<section class="card" id="nodeHead"><div class="meta"><h2 style="margin:0">${esc(n?n.label:'Toàn lượt')}</h2>${n?badge(n.status)+' '+kindBadge(n.errorKind):''}</div>`+
  (n?`<div class="facts">${facts.map(([k,v])=>`<span><small>${esc(k)}</small>${esc(v)}</span>`).join('')}</div>`:'<p class="muted">Log, tiến độ và báo cáo của cả lượt, không lọc theo bước.</p>')+
  (n?.draft?`<p class="muted">Catalog đang gộp: lần ${esc(n.draft.n)} lúc ${esc(when(n.draft.at))}${n.draft.rows!=null?` · ${num(n.draft.rows)} dòng`:''}${n.draft.groups?.length?` · nhóm site đã xong: ${esc(n.draft.groups.join(', '))}`:''}${n.status==='ok'?'':' — bản chính thức chạy khi mọi site cào xong.'}</p>`:'')+
  (n?.error?`<p class="minus">${esc(n.error)}</p>`:'')+(st?attemptsText(st.detail):'')+

// --- log trực tiếp
const GROUPS={'':'Tất cả',vinpearl:'Vinpearl',trip:'trip.com vé/điểm',booking:'booking.com',agoda:'agoda.com',tripHotels:'Khách sạn Trip',preview:'Catalog đang gộp',job:'Job (bước, DB, index)'};
function lineGroup(line){const m=line.match(/^\d\d:\d\d:\d\d \[([a-z]+)\]/);if(m)return m[1];if(/ Trip meta | Trip \d+@|trip_hotels/.test(line))return 'tripHotels';return 'job'}
function lineClass(line){if(/ (ERROR|CRITICAL) |Traceback|failed|Error:/.test(line))return 'e';if(/ WARNING |bị chặn|Bị chặn/.test(line))return 'w';if(/catalog\.(step|group)\./.test(line))return 's';if(/live\.control/.test(line))return 'g';return ''}
// Dòng của một bước lớn / bước con: catalog.step.* và catalog.substep name=<bước>[:<con>]. Bước Gộp thêm dòng
// normalise.step.* của normalise.StepClock (gộp chính thức trong tiến trình job; bản nháp có tiền tố [preview]), cả log
// "Catalog đang gộp" (mọi dòng [preview], catalog.preview.*, start/done của normalise.preview); dòng của chuẩn hoá theo nguồn ([normalise:<nguồn>]) thuộc ô
// của nguồn đó. `name=<bước>` khớp đúng tên bước (không lấy normalise.source:… / normalise.preview của ô khác).
// Gộp chính thức chạy trong tiến trình job nên log của nó (Đọc …jsonl, Khách sạn: …, Đã ghi …, WARNING) không có tiền tố:
// lấy mọi dòng không tiền tố nằm giữa `catalog.step.start name=normalise` và dòng catalog.step / run.end kế tiếp
// (trackMerge, gọi theo thứ tự dòng; renderLog đặt lại trạng thái trước khi lọc).
const CLOCK_LINE=/ normalise\.step\.(?:start|done|failed) name=(.+?) (?:in|seconds|error)=/;
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function trackMerge(line){const L=S.log;if(/catalog\.step\.start name=normalise(?: |$)/.test(line)){L.inMerge=true;return true}
 const was=!!L.inMerge;if(/catalog\.step\.(?:start|done) name=| run\.end /.test(line))L.inMerge=false;return was}
function stepLine(line,step,sub,inMerge){if(step==='normalise'&&!line.includes('[normalise:')){const m=line.match(CLOCK_LINE);if(m)return !sub||m[1]===sub;if(!sub&&(lineGroup(line)==='preview'||/catalog\.(?:preview\.|step\.\w+ name=normalise\.preview )/.test(line)||(inMerge&&lineGroup(line)==='job')))return true}
 return sub?line.includes(`catalog.substep name=${step}:${sub} `):new RegExp(`name=${reEsc(step)}(?:[ :]|$)`).test(line)}
function stepChip(){const L=S.log;if(!L.step)return '';const n=S.graph?.nodes.find(x=>x.id===L.step);
 return `<small class="muted">Đang lọc theo bước:</small> <span class="status running">${esc(n?.label||L.step)}${L.sub?' › '+esc(L.sub):''}</span> <button type="button" id="logStepClear" class="small">Bỏ lọc bước</button>`}
function lineMatch(line){const L=S.log;const inMerge=trackMerge(line);if(L.group&&lineGroup(line)!==L.group)return false;if(L.step&&!stepLine(line,L.step,L.sub,inMerge))return false;if(L.level==='warn'&&!lineClass(line).match(/[we]/))return false;if(L.level==='error'&&lineClass(line)!=='e')return false;if(L.q&&!line.toLowerCase().includes(L.q))return false;return true}
function lineHtml(line){const m=line.match(/^(\d\d:\d\d:\d\d) (\[[a-z]+\] )?(.*)$/);const cls=lineClass(line);return m?`<div class="${cls}"><span class="d">${esc(m[1])}</span> <span class="tag">${esc((m[2]||'').trim())}</span>${esc(m[3])}</div>`:`<div class="${cls}">${esc(line)}</div>`}
function renderLog(){const box=$('#logbox');if(!box)return;S.log.inMerge=false;const shown=S.log.lines.filter(lineMatch).slice(-4000);box.innerHTML=shown.map(lineHtml).join('')||'<div class="d">Chưa có dòng nào khớp bộ lọc.</div>';$('#logCount').textContent=`${num(shown.length)} / ${num(S.log.lines.length)} dòng`;if(S.log.follow)box.scrollTop=box.scrollHeight}
function appendLog(lines){S.log.lines.push(...lines);if(S.log.lines.length>20000)S.log.lines.splice(0,S.log.lines.length-20000);if(S.log.paused)return;const box=$('#logbox');if(!box)return;const add=lines.filter(lineMatch);if(!add.length)return;box.insertAdjacentHTML('beforeend',add.map(lineHtml).join(''));while(box.childElementCount>4000)box.firstElementChild.remove();$('#logCount').textContent=`${num(box.childElementCount)} / ${num(S.log.lines.length)} dòng`;if(S.log.follow)box.scrollTop=box.scrollHeight}
async function tabLog(){const L=S.log;L.lines=[];L.ended=false;const t=$('#tab');
 t.innerHTML=card('Log trực tiếp (job.log của lượt)',`<div class="logbar"><select id="logGroup" aria-label="Nguồn">${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}" ${k===L.group?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="logLevel" aria-label="Mức"><option value="">Mọi mức</option><option value="warn" ${L.level==='warn'?'selected':''}>Cảnh báo + lỗi</option><option value="error" ${L.level==='error'?'selected':''}>Chỉ lỗi</option></select><input id="logQ" type="search" placeholder="Lọc chữ (URL, mã HTTP, id…)" value="${esc(L.q)}" aria-label="Lọc log"><label><input id="logFollow" type="checkbox" ${L.follow?'checked':''}> Tự cuộn</label><button type="button" id="logPause">${L.paused?'Tiếp tục hiển thị':'Tạm dừng hiển thị'}</button><button type="button" id="logReload">Tải lại</button><span id="logState" class="status running">Đang kết nối…</span><small id="logCount"></small></div><div id="logStep" class="badge-row">${stepChip()}</div><div id="logbox" class="logbox" tabindex="0" aria-label="Log"></div><p class="muted">Dòng có [nhóm] là của tiến trình crawl.py từng site; “Trip meta”/“Trip &lt;id&gt;@ngày” là khách sạn Trip; “catalog.step/group” là mốc bước. Nguồn cần hiển thị nhiều hơn: bật “Log chi tiết từng request” ở Cấu hình.</p>`);
 $('#logGroup').onchange=e=>{L.group=e.target.value;renderLog()};$('#logLevel').onchange=e=>{L.level=e.target.value;renderLog()};$('#logQ').oninput=e=>{L.q=e.target.value.toLowerCase();renderLog()};
 $('#logFollow').onchange=e=>{L.follow=e.target.checked;if(L.follow)renderLog()};$('#logPause').onclick=e=>{L.paused=!L.paused;e.target.textContent=L.paused?'Tiếp tục hiển thị':'Tạm dừng hiển thị';if(!L.paused)renderLog()};$('#logReload').onclick=()=>tabLog();
 if($('#logStepClear'))$('#logStepClear').onclick=()=>{L.step='';L.sub='';$('#logStep').innerHTML='';renderLog()};
 const es=new EventSource(`/api/log/stream?run=${encodeURIComponent(S.run)}&lines=2000`);S.es=es;const st=$('#logState');
 es.addEventListener('init',e=>{L.lines=JSON.parse(e.data).lines;renderLog();st.className='status running';st.textContent='Đang nhận log'});
 es.addEventListener('lines',e=>appendLog(JSON.parse(e.data).lines));
 es.addEventListener('end',()=>{L.ended=true;st.className='status ok';st.textContent='Lượt đã kết thúc';es.close()});
 es.onerror=()=>{if(!L.ended){st.className='status error';st.textContent='Mất kết nối stream';es.close()}}}

 (d.merges.length?`<h3>Gộp trùng</h3>${table(['Loại','Điểm','Giữ lại','Gộp vào'],d.merges.map(m=>[esc(m.kind),esc(m.score),esc(`${m.keptName} · ${m.keptRef}`),esc(`${m.mergedName} · ${m.mergedRef}`)]))}`:'')+

function dbDiagram(g){const W=270,RH=17,HH=34,GAP=26,CG=110,TOP=30;const by={};for(const t of g.tables)(by[t.schema]=by[t.schema]||[]).push(t);

 const cols=[];for(const sc of order){const ts=by[sc];const h=t=>HH+t.columns.length*RH+10;const total=ts.reduce((a,t)=>a+h(t)+GAP,0);
  const parts=total>2200?2:1;const lanes=Array.from({length:parts},()=>({schema:sc,items:[],h:0}));
  for(const t of ts.slice().sort((a,b)=>h(b)-h(a))){const l=lanes.reduce((m,x)=>x.h<m.h?x:m);l.items.push(t);l.h+=h(t)+GAP}cols.push(...lanes)}
 const pos={};cols.forEach((c,i)=>{let y=TOP;c.items.sort((a,b)=>a.table.localeCompare(b.table)).forEach(t=>{pos[t.name]={x:20+i*(W+CG),y,t};y+=HH+t.columns.length*RH+10+GAP})});
 const width=20+cols.length*(W+CG),height=Math.max(...Object.values(pos).map(p=>p.y+HH+p.t.columns.length*RH+10))+30;
 const rowY=(p,c)=>{const i=p.t.columns.findIndex(x=>x.name===c);return p.y+HH+(i<0?0:i)*RH+RH/2+3};
 const edges=g.edges.map(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return'';const y1=rowY(a,e.columns[0]),y2=rowY(b,e.targetColumns[0]);let d;
  if(e.from===e.to){const x=a.x+W,off=e.columns[0].startsWith('source_ref')?70:40;d=`M${x} ${y1} C${x+off} ${y1},${x+off} ${y2},${x} ${y2}`}
  else{const right=b.x>a.x;const x1=right?a.x+W:a.x,x2=right?b.x:b.x+W;const dx=Math.max(40,Math.abs(x2-x1)/2)*(right?1:-1);
   if(a.x===b.x){const x=a.x+W;d=`M${x} ${y1} C${x+60} ${y1},${x+60} ${y2},${x} ${y2}`}else d=`M${x1} ${y1} C${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}`}
  return `<path class="edge${e.kind==='convention'?' conv':''}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${d}" marker-end="url(#arrow)"><title>${esc(e.from+'.'+e.columns.join('+')+' → '+e.to+'.'+e.targetColumns.join('+')+(e.label?' ('+e.label+')':'')+(e.kind==='convention'?' · quy ước':' · khoá ngoại'))}</title></path>`}).join('');

  const rows=t.columns.map((c,i)=>{const cy=y+HH+i*RH+RH/2+4;const cls=c.pk?'pk':c.fk?'fk':c.secret?'sec':'';const tag=c.pk?'PK':c.fk?'FK':'';
   return `<text class="${cls}" x="${x+8}" y="${cy}">${esc(tag)}</text><text class="${cls}" x="${x+30}" y="${cy}">${esc(c.name.length>24?c.name.slice(0,23)+'…':c.name)}${c.secret?' (ẩn)':''}</text><text x="${x+W-8}" y="${cy}" text-anchor="end" fill="var(--muted)">${esc(c.type.replace('timestamp with time zone','timestamptz').replace('character varying','varchar').replace('USER-DEFINED','enum').slice(0,14))}</text>`}).join('');
  return `<g class="tbl${t.view?' view':''}" data-tbl="${esc(t.name)}" data-action="dbTable" data-args="${esc(JSON.stringify({table:t.name}))}"><title>${esc(t.name)} — bấm để xem dữ liệu</title><rect class="box" x="${x}" y="${y}" width="${W}" height="${h}" rx="8"/><rect class="head" x="${x+1}" y="${y+1}" width="${W-2}" height="${HH-6}" rx="7"/>

 return `<p class="muted">${num(g.tables.length)} bảng / view · ${num(g.edges.length)} quan hệ. Nét liền: khoá ngoại; nét đứt: quan hệ quy ước (không có khoá ngoại). <b>PK</b> khoá chính, <b>FK</b> khoá ngoại. Rê chuột vào một bảng để tô các quan hệ của nó; bấm để mở dữ liệu bảng.</p>

  case 'trace':return trace(args.id);
  case 'traceModal':$('#detail').close();S.tab='normalise';await renderTab();return trace(args.id);
  case 'product':{const d=await api('/api/product',args);return modal('Sản phẩm và nguồn',pretty(d.product)+button('Truy vết qua các bước chuẩn hoá','traceModal',{id:args.id})+card('Truy vết raw / interim',d.trace.map(t=>`<p>${esc(t.ref)} · ${esc(t.source)}</p>${button('Xem interim','record',{run:args.run,source:t.source,index:t.interim.index})} ${(t.raw||[]).map(path=>button(path,'rawfile',{run:args.run,source:t.source,path})).join(' ')}`).join('')||'<p>Không tìm thấy bản ghi tương ứng.</p>')+card('Dòng nạp DB',pretty(d.db)))}
  case 'embedRow':return embedRow(args);
  case 'vector':{const out=$('#vecOut');out.innerHTML='<p class="muted">Đang đọc…</p>';try{const d=await api('/api/embed/vector',args);out.innerHTML=`<small>Trong ${esc(d.collection)} · ${esc(JSON.stringify(d.properties))}</small>`+vecHtml(d.vector)}catch(e){out.innerHTML=`<p class="minus">${esc(e.message)}</p>`}return}
  case 'artifact':{const d=await api('/api/artifact',args);return modal(d.name,d.kind==='table'?table(d.header,d.rows.map(r=>r.map(esc))):pretty(d.json||d.text||d))}
  case 'start':if(!confirm(`Bắt đầu lượt “${{auto:'theo chu kỳ',full:'cào lớn',daily:'làm mới Trip',index:'bảo trì và index'}[args.mode]||args.mode}”?`))return;await api('/api/run',{},args);await pollControls();return navigate('overview');
  case 'stop':{const d=await api('/api/stop',{},{});notice(d.message,true);return S.view==='run'?openRun(S.run,S.tab,S.preview,S.node):navigate('overview')}
  case 'liveApply':{const row=document.querySelector(`[data-live="${args.key}"]`);const changes={};row.querySelectorAll('[data-field]').forEach(i=>changes[i.dataset.field]=Number(i.value));return liveSend(args.key,changes)}
  case 'liveReset':return liveSend(args.key,Object.fromEntries(args.fields.map(f=>[f,null])));
  case 'livePause':return liveSend(args.key,{paused:args.paused});
  case 'nextSave':{const input=document.querySelector(`[data-next="${args.key}"]`);await api('/api/settings',{},{values:{[args.key]:Number(input.value)}});notice('Đã lưu vào Cấu hình, áp từ lượt sau.',true);return refreshFlow(true)}
  case 'tripBudget':for(const [key,value] of Object.entries({'tripHotels.initialPerCity':30,'tripHotels.newPerCity':10,'tripHotels.dailyHotels':180}))main.querySelector(`[data-key="${key}"]`).value=value;return notice('Đã điền ngân sách Trip. Bấm Lưu thay đổi để áp dụng.',true);
  case 'dbTable':S.db={table:args.table,filters:{},offset:0,mode:'list'};return dbPage();
  case 'dbMode':S.db={...S.db,mode:args.mode};return dbPage();
  case 'dbReload':return dbPage();
  case 'dbZoom':S.db.fit=!S.db.fit;return dbPage();
  case 'dbOffset':S.db.offset=args.offset;return dbPage();
  case 'dbSort':S.db.desc=S.db.sort===args.col?!S.db.desc:false;S.db.sort=args.col;S.db.offset=0;return dbPage();
  case 'dbClear':S.db={table:S.db.table,filters:{},offset:0};return dbPage();
  case 'dbRow':return dbRow(args.table,args.key);
  case 'dbList':$('#detail').close();S.db={table:args.table,filters:args.filters,offset:0};await navigate('db');return;
  case 'dbChildren':$('#detail').close();S.db={table:'cdp.products',filters:{},children:args.id,offset:0};await navigate('db');return;
  case 'resetSetting':await api('/api/settings',{},{values:{[args.key]:null}});return settings();
 }}
document.addEventListener('click',e=>{const sg=e.target.closest('[data-setgroup]');if(sg){S.settingsGroup=sg.dataset.setgroup;document.querySelectorAll('[data-setgroup]').forEach(b=>b.setAttribute('aria-current',b===sg));document.querySelectorAll('#settingsForm [data-group]').forEach(x=>x.hidden=x.dataset.group!==S.settingsGroup);return}
 const nav=e.target.closest('nav [data-view]'),tab=e.target.closest('[data-tab]'),b=e.target.closest('[data-action]'),node=e.target.closest('[data-node]');
 if(nav)navigate(nav.dataset.view).catch(fail);
 const sx=e.target.closest('[data-sub]');  // UI6: bấm ô con → tab Log lọc đúng bước con
 if(sx&&S.view==='run'){S.node=sx.dataset.subof;S.tab='log';Object.assign(S.log,{group:'',q:'',step:sx.dataset.subof,sub:sx.dataset.sub});markSelected();renderPanel().then(()=>$('#panel')?.scrollIntoView({behavior:'smooth'})).catch(fail);return}
 if(node&&S.view==='run'){const n=S.graph?.nodes.find(x=>x.id===node.dataset.node);  // UI6: bấm ô lớn có bước con thì bung / thu
  if(n&&expandable(n)){S.expanded.has(n.id)?S.expanded.delete(n.id):S.expanded.add(n.id);$('#graphBox').innerHTML=graphHtml(S.graph);drawEdges();
   document.querySelector(`#graph [data-node="${CSS.escape(n.id)}"]`)?.scrollIntoView({block:'nearest',inline:'nearest'})}}
 if(node)(S.view==='run'?selectNode(node.dataset.node):openRun(S.miniRun,null,null,node.dataset.node)).catch(fail);
 if(tab){S.tab=tab.dataset.tab;renderTab().catch(fail)}
 if(b){e.preventDefault();b.disabled=true;action(b.dataset.action,JSON.parse(b.dataset.args)).catch(fail).finally(()=>b.disabled=false)}});
document.addEventListener('change',e=>{const rf=e.target.closest('[data-runfilter]');if(rf){S.runFilter={...(S.runFilter||{}),[rf.dataset.runfilter]:rf.value};historyPage().catch(fail);return}
 const f=e.target.closest('[data-alert]');if(!f)return;S.alertFilter={...(S.alertFilter||{}),[f.dataset.alert]:f.value};
 const cardEl=f.closest('.card');if(cardEl)cardEl.outerHTML=alertsCard(S.overviewAlerts)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);
 try{
  if(e.target.id==='searchForm'){const extra={};for(const k of ['taxonomy','level','src','destination','flag','step','action'])if(f.has(k))extra[k]=f.get(k);return await showList({...S.list,...extra,q:f.get('q'),offset:0})}
  if(e.target.id==='traceForm')return await trace(f.get('id'));
  if(e.target.id==='dbForm'){S.db.q=f.get('q');S.db.offset=0;return await dbPage()}
  if(e.target.id==='cleanupForm')return await storageCleanup(f);
  if(e.target.id==='queryForm'){const out=$('#queryOut');out.innerHTML='<p class="muted">Đang embed và xếp hạng…</p>';out.innerHTML=queryHtml(await api('/api/embed/query',{},{run:S.run,q:f.get('q'),k:Number(f.get('k')),refresh:f.get('refresh')==='on'}));return}
  if(e.target.id==='settingsForm'){const values={};for(const fl of S.settings.fields){const input=main.querySelector(`[data-key="${fl.key}"]`);const value=fl.kind==='bool'?input.checked:['int','float'].includes(fl.kind)?Number(input.value):input.value;const old=Array.isArray(fl.value)?fl.value.join(','):fl.value??'';if(value!==old)values[fl.key]=value}await api('/api/settings',{},{values});await settings();notice('Đã lưu. Cấu hình áp dụng từ lượt kế tiếp.',true)}
 }catch(err){fail(err);if(e.target.id==='queryForm')$('#queryOut').innerHTML=''}});
$('#closeDetail').onclick=()=>$('#detail').close();
addEventListener('resize',()=>drawEdges());
async function poll(){if(S.view!=='overview'||$('#detail').open)return;try{await overview();$('#connection').textContent='Đã kết nối · '+when(new Date().toISOString())+' · tự làm mới 5 giây'}catch(e){$('#connection').textContent='Không kết nối được';fail(e)}}
applyHash().then(()=>$('#connection').textContent='Đã kết nối · tự làm mới 5 giây').catch(fail);setInterval(poll,5000);pollControls();setInterval(pollControls,5000);
</script>
</body>
