<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-OTA · Fresh catalog</title>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#15233b;--muted:#637187;--line:#dae2ed;--brand:#215aca;--good:#12714b;--bad:#ac2939}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 26px}header h1{font-size:21px;margin:0}header p{margin:4px 0;color:var(--muted)}nav,.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button,select,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--brand)}button:disabled{opacity:.5;cursor:default}button.primary,nav button[aria-current=true]{background:var(--brand);color:#fff;border-color:var(--brand)}button.danger{color:var(--bad)}:focus-visible{outline:3px solid #84acf7;outline-offset:2px}main{max-width:1500px;margin:24px auto;padding:0 24px 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}.kpi strong{display:block;font-size:25px;margin:6px 0}.muted,small{color:var(--muted)}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px}.status{display:inline-block;border-radius:20px;padding:2px 9px;background:#e9eef5;font-size:12px;white-space:nowrap}.ok{background:#dff2e9;color:var(--good)}.running{background:#e3edff;color:var(--brand)}.failed,.dead,.error{background:#fce6e8;color:var(--bad)}.partial,.blocked,.stopped{background:#fff0d2;color:#825400}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line);max-width:370px;overflow-wrap:anywhere}th{color:var(--muted);font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}pre{background:#102037;color:#d8e6fb;padding:16px;border-radius:9px;overflow:auto;max-height:65vh;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}.empty{padding:30px;text-align:center;color:var(--muted)}#notice{padding:0 24px;max-width:1500px;margin:15px auto;color:var(--bad);white-space:pre-wrap}.field{display:grid;grid-template-columns:minmax(200px,1fr) minmax(120px,300px);gap:12px;border-top:1px solid var(--line);padding:15px 0}.field label{font-weight:600}.field small{display:block;font-weight:400}.field input:not([type=checkbox]){width:100%}.badge-row{display:flex;gap:8px;flex-wrap:wrap}.link{color:var(--brand);border:0;background:transparent;padding:0;text-align:left}.meta{display:flex;gap:20px;flex-wrap:wrap}.pager{display:flex;align-items:center;gap:12px;margin-top:14px}dialog{border:1px solid var(--line);border-radius:12px;width:min(1050px,95vw);max-height:90vh;color:var(--ink)}dialog::backdrop{background:#13233d99}dialog .actions{justify-content:flex-end}details{margin:12px 0}summary{cursor:pointer}#connection{font-size:12px;color:var(--muted)}@media(max-width:620px){header{padding:16px}main{padding:0 12px}.field{grid-template-columns:1fr}th,td{padding:8px}.card{padding:14px}}
</style>
</head>
<body>
<header><h1>V-OTA <span class="muted">/ Fresh catalog</span></h1><p>Theo dõi cào mới → chuẩn hoá → nạp Postgres → index Weaviate</p><div id="connection" aria-live="polite">Đang kết nối…</div>
<nav aria-label="Điều hướng"><button data-view="overview" aria-current="true">Tổng quan</button><button data-view="runs">Lịch sử lượt</button><button data-view="hotels">Khách sạn Trip</button><button data-view="settings">Cấu hình</button></nav>
</header>
<div id="notice" role="alert"></div><main id="main" aria-live="polite"></main>
<dialog id="detail"><h2 id="detailTitle">Chi tiết</h2><div id="detailBody"></div><div class="actions"><button id="closeDetail">Đóng</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), main=$('#main');
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=v=>`<pre>${esc(typeof v==='string'?v:JSON.stringify(v,null,2))}</pre>`;
const labels={ok:'Thành công',running:'Đang chạy',partial:'Chưa đủ dữ liệu',failed:'Thất bại',dead:'Đã mất tiến trình',stopped:'Đã dừng',error:'Lỗi',blocked:'Bị chặn',unknown:'Chưa có trạng thái'};
const badge=v=>`<span class="status ${esc(v)}">${esc(labels[v]||v)}</span>`;
const when=v=>v?new Date(v).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}):'—';
const bytes=n=>n>1048576?`${(n/1048576).toFixed(1)} MB`:`${Math.round((n||0)/1024)} KB`;
const button=(label,action,args={},css='')=>`<button class="${css}" data-action="${action}" data-args="${esc(JSON.stringify(args))}">${esc(label)}</button>`;
const card=(title,body)=>`<section class="card"><h2>${esc(title)}</h2>${body}</section>`;
const table=(heads,rows)=>rows.length?`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có dữ liệu.</div>';
let view='overview', activeRun=null, listState=null, refreshing=false, settingsData=null;
async function api(path,params={},body){const url=new URL(path,location.origin);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null)url.searchParams.set(k,v)});const response=await fetch(url,{cache:'no-store',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'vota-monitor'},body:JSON.stringify(body)})});const data=await response.json();if(!response.ok)throw Error(typeof data.error==='string'?data.error:JSON.stringify(data.error||data));return data}
function fail(error){$('#notice').textContent=error.message||String(error)}
function modal(title,html){$('#detailTitle').textContent=title;$('#detailBody').innerHTML=html;if(!$('#detail').open)$('#detail').showModal()}
function runsTable(runs){return table(['Bắt đầu (VN)','Chế độ','Trạng thái','Thời gian','Sản phẩm / Trip','Dữ liệu'],runs.map(r=>[esc(when(r.startedAt)),esc(r.mode),badge(r.status),r.seconds==null?'—':`${esc(r.seconds)} s`,esc(`${r.counts?.catalog?.products??'—'} / ${r.counts?.trip?.completed??'—'}`),r.retained?button(r.id,'run',{id:r.id},'link'):'Chỉ còn tóm tắt']))}
async function overview(){const d=await api('/api/overview');const running=d.running;main.innerHTML=`<div class="grid">${[
 ['Hiện tại',running?(running.stale?'Mất nhịp sống':running.starting?'Đang khởi động':running.mode):'Đang nghỉ',running?.runId||'Không có lượt giữ khoá'],
 ['Lượt theo lịch',d.nextRun?.mode||'Đã tắt',when(d.nextRun?.at)],['Khách sạn Trip',d.tripHotelIds,'ID đã lưu để xoay vòng'],['Dữ liệu giữ lại',bytes(d.diskBytes),'Raw, interim, catalog và báo cáo']
].map(([label,value,sub])=>`<div class="card kpi"><small>${esc(label)}</small><strong>${esc(value)}</strong><small>${esc(sub)}</small></div>`).join('')}</div>`+
card('Điều khiển lượt cào',`<p class="muted">Cấu hình mới áp dụng từ lượt kế tiếp. Giờ lịch hiển thị theo Việt Nam; cron phải gọi <code>fresh-run tick</code>.</p><div class="actions">${['auto','full','daily','index'].map(mode=>button({auto:'Chạy theo chu kỳ',full:'Cào lớn',daily:'Làm mới Trip',index:'Bảo trì và index'}[mode],'start',{mode},mode==='auto'?'primary':'')).join('')}${button('Dừng lượt đang chạy','stop',{},'danger')}</div>${running?`<p>Bước hiện tại: ${esc((running.steps||[]).join(', ')||'Đang khởi động')}</p>${running.runId?button('Xem lượt đang chạy','run',{id:running.runId}):''}`:''}${d.settingsError?`<p>${esc(d.settingsError)}</p>`:''}${d.spawned?.launchLog?pretty(d.spawned.launchLog.join('\n')):''}`)+
card('Lượt gần nhất',runsTable(d.runs))+
card('Log runner',table(['File','Cập nhật','Mã thoát'],d.runnerLogs.map(r=>[button(r.name,'runnerlog',{name:r.name},'link'),esc(when(r.modifiedAt)),esc(r.exitCode)])))+
card('Kết nối được cấu hình',`<div class="badge-row">${Object.entries(d.env).map(([key,value])=>`<span class="status">${esc(key)}: ${typeof value==='boolean'?(value?'đã đặt':'chưa đặt'):esc(value)}</span>`).join('')}</div>`);
main.querySelectorAll('[data-action=start]').forEach(b=>b.disabled=!!running);main.querySelector('[data-action=stop]').disabled=!running||running.starting;
}
async function showRun(id){activeRun=id;view='run';listState=null;const d=await api('/api/run',{id});main.innerHTML=card(id,`<div class="meta">${badge(d.status)}<span>${esc(d.mode)} · ${esc(d.trigger)}</span><span>${esc(when(d.startedAt))}</span><span>${esc(d.seconds??'—')} s</span></div>${d.error?`<p>${esc(d.error)}</p>`:''}<div class="actions">${button('Làm mới','run',{id})}${button('Log lượt','log',{run:id})}${d.hasProducts?button('Catalog chuẩn hoá','list',{kind:'products',run:id}):''}${d.hasDbReport?button('Báo cáo nạp DB','list',{kind:'db',run:id}):''}</div>`)+
card('Các bước',table(['Bước','Nhóm','Trạng thái','Giây'],(d.steps||[]).map(s=>[esc(s.label||s.name),esc(s.group),badge(s.status),esc(s.seconds)])))+
card('Số liệu của lượt',pretty(d.counts||{}))+
card('Nguồn dữ liệu',table(['Nguồn','Raw','Interim','Xem dữ liệu'],(d.sourcesData||[]).map(s=>[esc(s.label),`${s.rawFiles} file · ${bytes(s.rawBytes)}`,esc(s.interimRecords),button('Raw','list',{kind:'raw',run:id,source:s.source})+' '+button('Interim','list',{kind:'interim',run:id,source:s.source})])))+
card('Báo cáo',table(['File','Dung lượng'],(d.artifacts||[]).map(a=>[button(a.name,'artifact',{run:id,name:a.name},'link'),bytes(a.bytes)])))+`<details><summary>Cấu hình đã dùng trong lượt này</summary>${pretty(d.settings||{})}</details>`;
}
async function showLog(args,runner=false){const d=await api('/api/log',{...args,runner:runner?'1':'',name:args.name||'job.log',lines:500});modal(d.name,pretty(d.lines.join('\n'))+button('Làm mới log',runner?'runnerlog':'log',args))}
async function showList(args){view='data';listState={...args,offset:args.offset||0};const {kind,run,source,offset,q=''}=listState;const d=await api('/api/'+kind,{run,source,offset,q,limit:100});let heads,rows;
 if(kind==='raw'){heads=['File','Dung lượng','Loại'];rows=d.rows.map(r=>[button(r.path,'rawfile',{run,source,path:r.path},'link'),bytes(r.bytes),esc(r.kind)])}
 if(kind==='interim'){heads=['ID','Tên','Điểm đến','Phòng','Chi tiết'];rows=d.rows.map(r=>[esc(r.id),esc(r.name),esc(r.destination),esc(r.rooms),button('Xem','record',{run,source,index:r.index})])}
 if(kind==='products'){heads=['Sản phẩm','Loại / cấp','Điểm đến','Giá VND','Khả dụng','Nguồn'];rows=d.rows.map(r=>[button(r.name||r.productId,'product',{run,id:r.productId},'link'),esc(`${r.taxonomy}/${r.level||'—'}`),esc(r.destination),esc(r.unitPrice),r.available?'Có':'Không',esc(r.sourceRef)])}
 if(kind==='db'){heads=['Sản phẩm','Hành động','Đã ghi','Giá trước → sau'];rows=d.rows.map(r=>[button(r.name||r.productId,'json',{title:r.productId,data:r},'link'),esc(r.action),r.written?'Có':'Không đổi',esc(`${r.before?.unitPrice??'—'} → ${r.after?.unitPrice??'—'}`)])}
 main.innerHTML=card({raw:'File raw',interim:'Bản ghi interim',products:'Catalog chuẩn hoá',db:'Báo cáo nạp DB'}[kind],`<p>${esc(run)} ${source?'· '+esc(source):''}</p><form id="searchForm" class="actions"><input name="q" type="search" placeholder="Lọc theo tên hoặc ID" value="${esc(q)}" aria-label="Tìm dữ liệu"><button type="submit">Tìm</button>${button('Quay lại lượt','run',{id:run})}</form><p>${esc(d.total)} kết quả</p>${table(heads,rows)}<div class="pager">${offset>0?button('← Trước','list',{...listState,offset:Math.max(0,offset-100)}):''}<span>${offset+1}–${offset+d.rows.length} / ${d.total}</span>${offset+100<d.total?button('Tiếp →','list',{...listState,offset:offset+100}):''}</div>`);
}
async function hotels(){const d=await api('/api/trip-hotels');main.innerHTML=card('Khách sạn Trip · xoay vòng',`<p>Lượt daily tối đa <strong>${d.dailyBatch}</strong> khách sạn. Ưu tiên ID chưa thử hoặc lâu chưa thử.</p><p class="muted">Coverage lấy từ lượt gần nhất: ${esc(d.coverageRun)}. Trống nghĩa là chưa có quan sát trong lượt đó.</p>`+table(['Thứ tự','ID','Thành phố','Lần thử gần nhất','Thành công gần nhất','Lượt kế','Coverage'],d.hotels.map(r=>[esc(r.queue),esc(r.hotelId),esc(r.destination),esc(when(r.lastAttemptAt)),esc(when(r.lastSuccessAt)),r.nextBatch?'Có':'—',esc(r.lastCoverage?Object.entries(r.lastCoverage).map(([k,v])=>`${k}: ${v}`).join(', '):'—')])))}
function fieldHtml(f){const value=Array.isArray(f.value)?f.value.join(','):f.value??'';let input;if(f.kind==='bool')input=`<input id="f-${esc(f.key)}" data-key="${esc(f.key)}" type="checkbox" ${f.value?'checked':''}>`;else input=`<input id="f-${esc(f.key)}" data-key="${esc(f.key)}" type="${['int','float'].includes(f.kind)?'number':f.kind==='time'?'time':'text'}" value="${esc(value)}" ${f.minimum!=null?`min="${f.minimum}"`:''} ${f.maximum!=null?`max="${f.maximum}"`:''} step="${f.kind==='float'?'any':'1'}">`;return `<div class="field"><label for="f-${esc(f.key)}">${esc(f.label)}<small>${esc(f.help||'')} · Nguồn: ${esc(f.source)}${f.env?' · '+esc(f.env):''}</small></label><div>${input}${button('Về env/mặc định','resetSetting',{key:f.key},'link')}</div></div>`}
async function settings(){settingsData=await api('/api/settings');main.innerHTML=`<form id="settingsForm">${card('Cấu hình lượt kế tiếp',`<p>Lưu tại volume dùng chung với cron. Lượt đang chạy giữ cấu hình lúc bắt đầu.</p><p class="muted">Trip: mặc định mới 30 ID/thành phố lần đầu, 10 ID mới/thành phố mỗi lượt full và 180 khách sạn/daily. Giá trị env hoặc đã lưu được ưu tiên.</p>${button('Áp ngân sách Trip 30 / 10 / 180','tripBudget')} <button class="primary" type="submit">Lưu thay đổi</button>${settingsData.error?`<p>${esc(settingsData.error)}</p>`:''}`)}${settingsData.groups.map(g=>card(g.label,settingsData.fields.filter(f=>f.group===g.id).map(fieldHtml).join(''))).join('')}<button class="primary" type="submit">Lưu thay đổi</button></form>`;main.querySelectorAll('[data-action]').forEach(b=>b.type='button')}
async function navigate(name){view=name;activeRun=null;listState=null;$('#notice').textContent='';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view));main.innerHTML='<p class="muted">Đang tải…</p>';if(name==='overview')await overview();if(name==='runs')main.innerHTML=card('Lịch sử lượt',runsTable(await api('/api/runs',{limit:200})));if(name==='hotels')await hotels();if(name==='settings')await settings()}
async function action(name,args){$('#notice').textContent='';if(name==='run')return showRun(args.id);if(name==='list')return showList(args);if(name==='log')return showLog(args);if(name==='runnerlog')return showLog(args,true);if(name==='json')return modal(args.title,pretty(args.data));if(name==='rawfile'){const d=await api('/api/raw/file',args);return modal(d.path,(d.truncated?'<p>File đã cắt bớt khi hiển thị.</p>':'')+pretty(d.json||d.text||d.visibleText||d))}if(name==='record')return modal('Bản ghi interim',pretty(await api('/api/interim/record',args)));if(name==='product'){const d=await api('/api/product',args);return modal('Sản phẩm và nguồn',pretty(d.product)+card('Truy vết raw / interim',d.trace.map(t=>`<p>${esc(t.ref)} · ${esc(t.source)}</p>${button('Xem interim','record',{run:args.run,source:t.source,index:t.interim.index})} ${(t.raw||[]).map(path=>button(path,'rawfile',{run:args.run,source:t.source,path})).join(' ')}`).join('')||'<p>Không tìm thấy bản ghi tương ứng.</p>')+card('Dòng nạp DB',pretty(d.db)))}if(name==='artifact'){const d=await api('/api/artifact',args);return modal(d.name,d.kind==='table'?table(d.header,d.rows.map(r=>r.map(esc))):pretty(d.json||d.text||d))}if(name==='start'){await api('/api/run',{},args);return navigate('overview')}if(name==='stop'){const d=await api('/api/stop',{},{});await navigate('overview');$('#notice').textContent=d.message;return}if(name==='tripBudget'){for(const [key,value] of Object.entries({'tripHotels.initialPerCity':30,'tripHotels.newPerCity':10,'tripHotels.dailyHotels':180}))main.querySelector(`[data-key="${key}"]`).value=value;$('#notice').textContent='Đã điền ngân sách Trip. Bấm Lưu thay đổi để áp dụng.';return}if(name==='resetSetting'){await api('/api/settings',{}, {values:{[args.key]:null}});return settings()}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]'),b=e.target.closest('[data-action]');if(nav)navigate(nav.dataset.view).catch(fail);if(b){e.preventDefault();b.disabled=true;action(b.dataset.action,JSON.parse(b.dataset.args)).catch(fail).finally(()=>b.disabled=false)}});
document.addEventListener('submit',async e=>{if(e.target.id==='searchForm'){e.preventDefault();showList({...listState,q:new FormData(e.target).get('q'),offset:0}).catch(fail)}if(e.target.id==='settingsForm'){e.preventDefault();const values={};for(const f of settingsData.fields){const input=main.querySelector(`[data-key="${f.key}"]`);let value=f.kind==='bool'?input.checked:['int','float'].includes(f.kind)?Number(input.value):input.value;const old=Array.isArray(f.value)?f.value.join(','):f.value??'';if(value!==old)values[f.key]=value}try{await api('/api/settings',{}, {values});await settings();$('#notice').textContent='Đã lưu. Cấu hình áp dụng từ lượt kế tiếp.'}catch(err){fail(err)}}});
$('#closeDetail').onclick=()=>$('#detail').close();
async function poll(){if(refreshing||view!=='overview'||$('#detail').open)return;refreshing=true;try{await overview();$('#connection').textContent='Đã kết nối · '+when(new Date().toISOString())+' · tự làm mới 5 giây'}catch(e){$('#connection').textContent='Không kết nối được';fail(e)}finally{refreshing=false}}
navigate('overview').then(()=>$('#connection').textContent='Đã kết nối · tự làm mới 5 giây').catch(fail);setInterval(poll,5000);
</script>
</body>
</html>
