name: HA CI

# Kiểm các phần HA mà workflow khác không chạy: Terraform staging-ha, agent giám sát VM (infra/monitoring),
# test cấu trúc, cụm Patroni thật trong Docker, khoá DB của crawler trên Postgres thật. Chỉ kiểm, không deploy.
on:
  pull_request:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/ha-checks.yml'
      - 'infra/terraform/environments/staging-ha/**'
      # Agent và collector mà template app staging-ha nạp qua main.tf (file()).
      - 'infra/monitoring/**'
      - 'ops/patroni/**'
      - 'ops/tests/**'
      - 'ops/promote-db-replica.sh'
      - 'ops/loadtest/**'
      - 'src/data_collection/catalog_run_lock.py'
      - 'src/data_collection/fresh_catalog.py'
      - 'src/data_collection/tests/**'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-staging-ha:
    name: Terraform staging-ha
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'   # cùng bản với staging-ha-infra-cd.yml
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=infra/terraform/environments/staging-ha fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infra/terraform/environments/staging-ha init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/staging-ha validate -no-color
      - name: Structure tests
        run: |
          for t in infra/terraform/environments/staging-ha/tests/test_*.py; do python3 "$t"; done
      - name: VM monitoring agent tests
        # Trước đây do monitoring-agent-cd-staging.yml (staging cũ, đã gỡ 2026-10-13) kiểm.
        run: |
          bash -n infra/monitoring/install-vota-docker-event-watcher.sh
          python3 -m unittest discover -s infra/monitoring/tests -p 'test_*.py'
      - name: Drill script syntax and dry run
        run: |
          bash -n ops/loadtest/ha-rolling-update-drill.sh
          BASE_URL=http://x PROJECT=p REGION=r MIG=m BACKEND_SERVICE=b bash ops/loadtest/ha-rolling-update-drill.sh

  db-scripts-and-patroni:
    name: Patroni, promote script, probe (Docker)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe tests
        run: |
          printf 'pytest>=8,<9\n' > "$RUNNER_TEMP/probe-requirements.txt"
          PYTHONPATH="$(bash scripts/ci/py-deps.sh pytest "$RUNNER_TEMP/probe-requirements.txt")" python3 -m pytest -q ops/tests/test_cluster_probe.py
      - name: Promote script on a real primary/replica pair
        run: bash ops/tests/test_promote_db_replica.sh
      - name: Build Patroni image
        run: docker build -t vota-patroni:ci ops/patroni
      - name: Patroni failover (etcd + 2 nodes, kill the leader)
        run: PATRONI_TEST_IMAGE=vota-patroni:ci bash ops/tests/test_patroni_failover.sh
      - name: Patroni bootstrap by cloning a running primary
        run: PATRONI_TEST_IMAGE=vota-patroni:ci bash ops/tests/test_patroni_clone_bootstrap.sh

  crawler-lock:
    name: Crawler DB run lock (real Postgres)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Runner tự host chạy Debian 12 (Python 3.11 hệ thống); setup-python không hỗ trợ Debian nên không dùng.
      - uses: actions/setup-python@v5
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/data_collection/requirements.txt
      - name: Install
        # Như Dockerfile.fresh-catalog: bước index import cấu hình backend nên cần pydantic, pydantic-settings, numpy.
        # Thư mục riêng theo hash requirements, không cài vào Python hệ thống dùng chung giữa các runner.
        run: |
          grep -E '^(pydantic|pydantic-settings|numpy|argon2-cffi)[<>=]' src/backend/requirements.txt | sed 's/[[:space:]]*#.*//' > "$RUNNER_TEMP/job-extra.txt"
          echo 'pytest>=8,<9' >> "$RUNNER_TEMP/job-extra.txt"
          echo "DEPS=$(bash scripts/ci/py-deps.sh crawler-lock src/data_collection/requirements.txt "$RUNNER_TEMP/job-extra.txt")" >> "$GITHUB_ENV"
      - name: Lock and job tests
        working-directory: src/data_collection
        env:
          CATALOG_TEST_DATABASE_URL: postgresql://postgres:pw@127.0.0.1:5432/postgres
        run: PYTHONPATH="..:.:$DEPS" python3 -m pytest -q tests/test_catalog_run_lock.py tests/test_fresh_catalog_job.py tests/test_pipeline_graph.py tests/test_alerts.py
