name: Staging-HA Frontend Build

# Build và publish image frontend cho staging-ha. File này được staging-ha-frontend-cd.yml gọi qua workflow_call.
# Không có concurrency group: build chỉ ghi image vào Artifact Registry, không đụng MIG hay last-good, nên không phải
# xếp hàng sau deploy của run khác. Deploy vẫn xếp hàng qua group `staging-ha-app` ở staging-ha-frontend-cd.yml.
# Chỉ truyền digest qua output: đường dẫn image là secret, GitHub che giá trị secret trong output.

on:
  workflow_call:
    outputs:
      frontend_digest:
        description: Digest sha256 của image frontend vừa publish
        value: ${{ jobs.images.outputs.frontend_digest }}

permissions:
  contents: read

jobs:
  images:
    name: Build and publish frontend image
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      frontend_digest: ${{ steps.refs.outputs.frontend_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate publishing configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          STAGING_HA_TFVARS: ${{ secrets.STAGING_HA_TFVARS }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for name in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT BACKEND_IMAGE STAGING_HA_TFVARS TF_STATE_BUCKET GCP_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging-ha configuration: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$BACKEND_IMAGE" =~ ^asia-southeast1-docker\.pkg\.dev/[a-z0-9][a-z0-9._/-]*/vota-backend$ ]]; then
            echo 'GAR_BACKEND_IMAGE phải kết thúc bằng /vota-backend trong Artifact Registry.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Isolate Docker credentials per job
        # Mọi runner chạy chung một VM và chung HOME (~/.docker/config.json). Bước `docker logout` ở cuối job khác xoá đăng nhập
        # của job đang đẩy image: lỗi 403 "failed to fetch anonymous token" ngày 2026-10-12. Mỗi job dùng thư mục riêng.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive Frontend image path
        id: frontend_path
        env:
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
        run: |
          echo "image=${BACKEND_IMAGE%/vota-backend}/vota-frontend" >> "$GITHUB_OUTPUT"

      - name: Publish Frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile.web
          push: true
          tags: ${{ steps.frontend_path.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=staging-ha-frontend
          cache-to: type=gha,mode=max,scope=staging-ha-frontend

      - name: Resolve immutable image reference
        id: refs
        env:
          FRONTEND_IMAGE: ${{ steps.frontend_path.outputs.image }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          if [[ ! "$FRONTEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "FRONTEND_DIGEST không hợp lệ: $FRONTEND_DIGEST" >&2
            exit 1
          fi
          echo "frontend_digest=$FRONTEND_DIGEST" >> "$GITHUB_OUTPUT"
