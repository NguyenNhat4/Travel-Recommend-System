name: Staging-HA Crawler CD

# CD job cào (fresh catalog) lên VM vota-ha-crawler (staging-ha). Crawler không nằm trong MIG app và không đổi
# Terraform ở đây. Khoá concurrency `staging-ha-crawler` riêng, last-good riêng; lỗi crawler không rollback app.
# Giống CD app: content key so với last-good, CI gate (Crawler CI qua workflow_call), image build-hoặc-tái-dùng.

on:
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/staging-ha-crawler-cd.yml'
      - '.github/workflows/staging-ha-image-build.yml'
      - '.github/workflows/crawler-ci-cd.yml'
      - 'Dockerfile.fresh-catalog'
      - 'Dockerfile.fresh-catalog.dockerignore'
      - 'src/data_collection/**'
      # Image crawler copy toàn bộ src/backend: job index embed bằng embedder và cấu hình của backend.
      - 'src/backend/**'
      - 'infra/monitoring/ops-agent-crawler.yaml'
      - 'scripts/install-vota-cron.sh'
      - 'scripts/check-db-tunnel.sh'
      - 'scripts/deploy-staging-ha-crawler.sh'
      - 'scripts/ci/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Cài lại crawler dù content key không đổi'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-ha-crawler
  cancel-in-progress: false

env:
  CRAWLER_INSTANCE: vota-ha-crawler
  CRAWLER_ZONE: asia-southeast1-a
  STAGING_HA_LAST_GOOD_OBJECT: deploy/staging-ha-last-good-crawler.json

jobs:
  plan:
    name: Plan (content key so với last-good)
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      key: ${{ steps.plan.outputs.key }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Compare content key with what is running
        id: plan
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          gcloud storage cp "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" last-good.json 2>/dev/null || echo '{}' > last-good.json
          key="$(bash scripts/ci/image-key.sh crawler)"
          running="$(jq -r '.crawler_key // empty' last-good.json)"
          changed=true
          if [ "$key" = "$running" ] && [ "$FORCE" != true ]; then changed=false; fi
          { echo "key=$key"; echo "changed=$changed"; } >> "$GITHUB_OUTPUT"
          echo "- crawler: key \`$key\`, đang chạy \`${running:-không rõ}\`, deploy: **$changed**" | tee -a "$GITHUB_STEP_SUMMARY"

  ci:
    name: Crawler CI gate
    needs: plan
    if: ${{ needs.plan.outputs.changed == 'true' }}
    uses: ./.github/workflows/crawler-ci-cd.yml
    secrets: inherit

  images:
    name: Crawler image
    needs: [plan, ci]
    if: ${{ needs.plan.outputs.changed == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-ha-image-build.yml
    with:
      component: crawler
    secrets: inherit

  deploy_crawler:
    name: Install crawler on staging-ha VM
    needs: [plan, images]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.changed == 'true' }}
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build immutable crawler reference
        env:
          CRAWLER_IMAGE: ${{ secrets.GAR_FRESH_IMAGE }}
          CRAWLER_DIGEST: ${{ needs.images.outputs.digest }}
        run: echo "CRAWLER_REF=$CRAWLER_IMAGE@$CRAWLER_DIGEST" >> "$GITHUB_ENV"

      - name: Install crawler cron and monitor
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CRAWLER_INSTANCE: ${{ env.CRAWLER_INSTANCE }}
          CRAWLER_ZONE: ${{ env.CRAWLER_ZONE }}
        run: bash scripts/deploy-staging-ha-crawler.sh

  verify:
    name: Verify staging-ha crawler VM
    needs: [plan, images, deploy_crawler]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.changed == 'true' }}
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check crawler VM is running
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          status="$(gcloud compute instances describe "$CRAWLER_INSTANCE" --zone "$CRAWLER_ZONE" \
            --project "$GCP_PROJECT_ID" --format='value(status)')"
          [ "$status" = RUNNING ] || { echo "VM crawler đang $status" >&2; exit 1; }

      - name: Check there is exactly one crawler VM
        # Job cào chạy bằng cron trên một VM đơn. Workflow chỉ cài lên CRAWLER_INSTANCE, nên nếu có VM thứ hai
        # mang tag vota-crawler thì nó không được cài và job cào có thể chạy trùng. Dừng để người vận hành xử lý.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          count="$(gcloud compute instances list --project "$GCP_PROJECT_ID" \
            --filter='tags.items=vota-crawler' --format='value(name)' | grep -c . || true)"
          [ "$count" = 1 ] || { echo "Có $count VM mang tag vota-crawler, cần đúng 1." >&2; exit 1; }

      - name: Build immutable crawler reference
        env:
          CRAWLER_IMAGE: ${{ secrets.GAR_FRESH_IMAGE }}
          CRAWLER_DIGEST: ${{ needs.images.outputs.digest }}
        run: echo "CRAWLER_REF=$CRAWLER_IMAGE@$CRAWLER_DIGEST" >> "$GITHUB_ENV"

      - name: Record crawler as last good
        # Chỉ ghi khi VM đang chạy. Object riêng của crawler (không chung với app).
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          CRAWLER_KEY: ${{ needs.plan.outputs.key }}
        run: |
          if gcloud storage objects describe "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" >/dev/null 2>&1; then
            gcloud storage cp "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" last-good.json
          else
            echo '{}' > last-good.json
          fi
          jq --arg ref "$CRAWLER_REF" --arg key "$CRAWLER_KEY" --arg sha "$GITHUB_SHA" \
            '.crawler_ref = $ref | .crawler_key = $key | .git_sha = $sha' last-good.json > next-last-good.json
          gcloud storage cp next-last-good.json "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT"
