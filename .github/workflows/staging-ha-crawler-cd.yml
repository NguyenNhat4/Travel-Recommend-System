name: Staging-HA Crawler CD

# CD job cào (fresh catalog) lên VM vota-ha-crawler (staging-ha). Crawler không nằm trong MIG app và không đổi
# Terraform ở đây. Dùng concurrency group `staging-ha-crawler` riêng, và ghi last-good riêng (không ghi chung với app).
# last-good. Lỗi crawler không kích hoạt rollback app.

on:
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/staging-ha-crawler-cd.yml'
      - 'Dockerfile.fresh-catalog'
      - 'src/data_collection/**'
      - 'scripts/install-vota-cron.sh'
      - 'scripts/check-db-tunnel.sh'
      - 'scripts/deploy-staging-ha-crawler.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ha-crawler
  cancel-in-progress: false

env:
  CRAWLER_INSTANCE: vota-ha-crawler
  CRAWLER_ZONE: asia-southeast1-a
  STAGING_HA_LAST_GOOD_OBJECT: deploy/staging-ha-last-good-crawler.json

jobs:
  images:
    name: Build and publish crawler image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      crawler_digest: ${{ steps.refs.outputs.crawler_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate publishing configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          CRAWLER_IMAGE: ${{ secrets.GAR_FRESH_IMAGE }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for name in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT CRAWLER_IMAGE TF_STATE_BUCKET GCP_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging-ha configuration: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$CRAWLER_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo 'GAR_FRESH_IMAGE phải là đường dẫn image Artifact Registry không có tag.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Crawler image
        id: crawler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fresh-catalog
          push: true
          tags: ${{ secrets.GAR_FRESH_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=staging-ha-crawler
          cache-to: type=gha,mode=max,scope=staging-ha-crawler

      - name: Resolve immutable image reference
        id: refs
        env:
          CRAWLER_IMAGE: ${{ secrets.GAR_FRESH_IMAGE }}
          CRAWLER_DIGEST: ${{ steps.crawler.outputs.digest }}
        run: |
          if [[ ! "$CRAWLER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "CRAWLER_DIGEST không hợp lệ: $CRAWLER_DIGEST" >&2
            exit 1
          fi
          echo "crawler_digest=$CRAWLER_DIGEST" >> "$GITHUB_OUTPUT"

  deploy_crawler:
    name: Install crawler on staging-ha VM
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build immutable crawler reference
        env:
          CRAWLER_IMAGE: ${{ secrets.GAR_FRESH_IMAGE }}
          CRAWLER_DIGEST: ${{ needs.images.outputs.crawler_digest }}
        run: echo "CRAWLER_REF=$CRAWLER_IMAGE@$CRAWLER_DIGEST" >> "$GITHUB_ENV"

      - name: Install crawler cron and monitor
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CRAWLER_INSTANCE: ${{ env.CRAWLER_INSTANCE }}
          CRAWLER_ZONE: ${{ env.CRAWLER_ZONE }}
        run: bash scripts/deploy-staging-ha-crawler.sh

  verify:
    name: Verify staging-ha crawler VM
    needs: [images, deploy_crawler]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check crawler VM is running
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          status="$(gcloud compute instances describe "$CRAWLER_INSTANCE" --zone "$CRAWLER_ZONE" \
            --project "$GCP_PROJECT_ID" --format='value(status)')"
          [ "$status" = RUNNING ] || { echo "VM crawler đang $status" >&2; exit 1; }

      - name: Check there is exactly one crawler VM
        # Job cào chạy bằng cron trên một VM đơn. Workflow chỉ cài lên CRAWLER_INSTANCE, nên nếu có VM thứ hai
        # mang tag vota-crawler thì nó không được cài và job cào có thể chạy trùng. Dừng để người vận hành xử lý.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          count="$(gcloud compute instances list --project "$GCP_PROJECT_ID" \
            --filter='tags.items=vota-crawler' --format='value(name)' | grep -c . || true)"
          [ "$count" = 1 ] || { echo "Có $count VM mang tag vota-crawler, cần đúng 1." >&2; exit 1; }

      - name: Build immutable crawler reference
        env:
          CRAWLER_IMAGE: ${{ secrets.GAR_FRESH_IMAGE }}
          CRAWLER_DIGEST: ${{ needs.images.outputs.crawler_digest }}
        run: echo "CRAWLER_REF=$CRAWLER_IMAGE@$CRAWLER_DIGEST" >> "$GITHUB_ENV"

      - name: Record crawler as last good
        # Chỉ ghi khi VM đang chạy. Giữ nguyên backend_ref và frontend_ref đang có trong object.
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if gcloud storage objects describe "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" >/dev/null 2>&1; then
            gcloud storage cp "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" last-good.json
          else
            echo '{}' > last-good.json
          fi
          jq --arg ref "$CRAWLER_REF" '.crawler_ref = $ref' last-good.json > next-last-good.json
          gcloud storage cp next-last-good.json "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT"
