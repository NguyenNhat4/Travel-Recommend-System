name: Staging-HA Backend Build

# Build và publish image backend cho staging-ha. File này được staging-ha-backend-cd.yml gọi qua workflow_call.
# Không có concurrency group: build chỉ ghi image vào Artifact Registry, không đụng MIG hay last-good, nên không phải
# xếp hàng sau deploy của run khác. Deploy vẫn xếp hàng qua group `staging-ha-app` ở staging-ha-backend-cd.yml.
# Chỉ truyền digest qua output: đường dẫn image là secret, GitHub che giá trị secret trong output.

on:
  workflow_call:
    outputs:
      backend_digest:
        description: Digest sha256 của image backend vừa publish
        value: ${{ jobs.images.outputs.backend_digest }}

permissions:
  contents: read

jobs:
  images:
    name: Build and publish backend image
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_digest: ${{ steps.refs.outputs.backend_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate publishing configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          STAGING_HA_TFVARS: ${{ secrets.STAGING_HA_TFVARS }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for name in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT BACKEND_IMAGE STAGING_HA_TFVARS TF_STATE_BUCKET GCP_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging-ha configuration: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$BACKEND_IMAGE" =~ ^asia-southeast1-docker\.pkg\.dev/[a-z0-9][a-z0-9._/-]*/vota-backend$ ]]; then
            echo 'GAR_BACKEND_IMAGE phải kết thúc bằng /vota-backend trong Artifact Registry.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Isolate Docker credentials per job
        # Mọi runner chạy chung một VM và chung HOME (~/.docker/config.json). Bước `docker logout` ở cuối job khác xoá đăng nhập
        # của job đang đẩy image: lỗi 403 "failed to fetch anonymous token" ngày 2026-10-12. Mỗi job dùng thư mục riêng.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.GAR_BACKEND_IMAGE }}:${{ github.sha }}
          # Cache nằm trong Artifact Registry cùng region với image. Layer đã có trong repo thì không đẩy lại; cache GHA
          # trước đây mất ~212 s chỉ để export khi cache miss. Tag buildcache cần cleanup policy giữ lại.
          cache-from: type=registry,ref=${{ secrets.GAR_BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ secrets.GAR_BACKEND_IMAGE }}:buildcache,mode=max

      - name: Resolve immutable image reference
        id: refs
        env:
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "BACKEND_DIGEST không hợp lệ: $BACKEND_DIGEST" >&2
            exit 1
          fi
          echo "backend_digest=$BACKEND_DIGEST" >> "$GITHUB_OUTPUT"
