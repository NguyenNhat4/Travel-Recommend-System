name: Frontend CI

# CI frontend. Chạy trên mọi PR, và được staging-ha-app-cd.yml gọi lại (workflow_call) làm cổng trước khi build và deploy
# commit đã merge. Không chạy riêng khi push.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/frontend-ci-cd.yml'
      - '.github/workflows/staging-ha-image-build.yml'
      - '.dockerignore'
      - 'scripts/ci/**'
      - 'src/frontend/**'
      - 'src/shared/contracts/**'
      - 'src/shared/mocks/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR: push mới huỷ run cũ cùng PR. Khi staging-ha-app-cd.yml gọi: nhóm riêng theo run, không huỷ.
  group: ${{ github.event_name == 'pull_request' && format('frontend-ci-{0}', github.ref) || format('frontend-ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Frontend quality checks
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install contract validator dependency
        run: |
          printf 'PyYAML>=6,<7\n' > "$RUNNER_TEMP/validator-requirements.txt"
          echo "PYTHONPATH=$(bash scripts/ci/py-deps.sh contract-validator "$RUNNER_TEMP/validator-requirements.txt")" >> "$GITHUB_ENV"

      - name: Validate OpenAPI contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 src/shared/contracts/tests/validate_contract.py

      - name: Regenerate OpenAPI types
        working-directory: src/frontend
        run: npm run generate:api-types

      - name: Check generated OpenAPI types are committed
        run: git diff --exit-code -- src/frontend/src/types/api.gen.ts

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck

      - name: Unit and contract tests
        working-directory: src/frontend
        run: npm run test

      - name: Build frontend and API bundle
        working-directory: src/frontend
        run: npm run build

  docker_test:
    name: Frontend Docker build test
    # Chỉ trên PR: kiểm Dockerfile.web và làm nóng cache của builder cố định. Sau merge, staging-ha-app-cd.yml build
    # (gần như toàn bộ từ cache) hoặc tái dùng image theo content key. Chạy song song với quality.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Persistent BuildKit builder
        id: builder
        run: bash scripts/ci/buildx-builder.sh

      - name: Build Docker image (test phase in CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile.web
          builder: ${{ steps.builder.outputs.name }}
          push: false
          tags: vota-frontend-ci:${{ github.sha }}-test

  e2e:
    name: Frontend E2E smoke tests
    needs: quality
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: src/frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        # Runner tự host không có sudo không cần mật khẩu: --with-deps cần root để cài thư viện hệ thống.
        # Có sudo (GitHub-hosted) thì cài đủ phụ thuộc; không có thì chỉ cài binary, thư viện phải có sẵn trên runner.
        run: |
          if sudo -n true 2>/dev/null; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi

      - name: Run Playwright smoke tests
        working-directory: src/frontend
        env:
          CI: 'true'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npm run test:e2e
