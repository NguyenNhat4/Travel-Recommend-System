name: Frontend CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/frontend-ci-cd.yml'
      - 'ops/docker-compose.backend-vm.yml'
      - 'scripts/deploy-frontend-vm.sh'
      - 'src/frontend/Dockerfile.web'
      - 'src/frontend/**'
      - 'src/shared/contracts/**'
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/frontend-ci-cd.yml'
      - 'ops/docker-compose.backend-vm.yml'
      - 'scripts/deploy-frontend-vm.sh'
      - 'src/frontend/Dockerfile.web'
      - 'src/frontend/**'
      - 'src/shared/contracts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event_name == 'pull_request' && github.ref || 'staging' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Frontend quality checks
    if: ${{ github.event_name == 'push' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install contract validator dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate OpenAPI contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 src/shared/contracts/tests/validate_contract.py

      - name: Regenerate OpenAPI types
        working-directory: src/frontend
        run: npm run generate:api-types

      - name: Check generated OpenAPI types are committed
        run: git diff --exit-code -- src/frontend/src/types/api.gen.ts

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck

      - name: Unit and contract tests
        working-directory: src/frontend
        run: npm run test

      - name: Build frontend and API bundle
        working-directory: src/frontend
        run: npm run build

  e2e:
    name: Frontend E2E smoke tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: src/frontend
        env:
          CI: 'true'
        run: npm run test:e2e

  build_vm:
    name: Build Frontend VM image
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile.web
          push: false
          tags: vota-frontend-ci:${{ github.sha }}
          cache-from: type=gha,scope=frontend-vm
          cache-to: type=gha,mode=max,scope=frontend-vm

  publish_vm:
    name: Publish Frontend SHA and latest images
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') }}
    needs: build_vm
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      frontend_image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive Frontend image from Backend registry configuration
        id: image
        env:
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
        run: |
          for name in BACKEND_IMAGE GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging configuration: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$BACKEND_IMAGE" =~ ^asia-southeast1-docker\.pkg\.dev/[a-z0-9][a-z0-9._/-]*/vota-backend$ ]]; then
            echo 'GAR_BACKEND_IMAGE must end with /vota-backend in Artifact Registry.' >&2
            exit 1
          fi
          frontend_image="${BACKEND_IMAGE%/vota-backend}/vota-frontend"
          echo "ref=$frontend_image" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile.web
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
            ${{ steps.image.outputs.ref }}:latest
          cache-from: type=gha,scope=frontend-vm-publish
          cache-to: type=gha,mode=max,scope=frontend-vm-publish

  deploy_vm:
    name: Deploy Frontend to Backend VM
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') }}
    needs: publish_vm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vota-application-vm-deploy
      cancel-in-progress: false
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VM configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
          FRONTEND_IMAGE: ${{ needs.publish_vm.outputs.frontend_image }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
        run: |
          for name in GCP_PROJECT_ID GCE_INSTANCE GCE_ZONE GCE_COMPOSE_FILE FRONTEND_IMAGE GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging configuration: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$GCE_COMPOSE_FILE" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo 'GCE_COMPOSE_FILE must be an absolute path without shell metacharacters.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Initialize non-interactive SSH access
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
        run: |
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" \
            --tunnel-through-iap --quiet --command true

      - name: Copy Frontend deploy files to application VM
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
        run: |
          remote_dir="/tmp/vota-frontend-cd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -czf - \
            -C "$GITHUB_WORKSPACE/scripts" deploy-frontend-vm.sh \
            -C "$GITHUB_WORKSPACE/ops" docker-compose.backend-vm.yml \
            | gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet \
                --command "umask 077; mkdir -m 700 '$remote_dir' && tar -xzf - -C '$remote_dir' && chmod 0755 '$remote_dir/deploy-frontend-vm.sh' && sudo -n install -D -m 0644 '$remote_dir/docker-compose.backend-vm.yml' '$GCE_COMPOSE_FILE' && sudo -n docker compose -f '$GCE_COMPOSE_FILE' config >/dev/null"

      - name: Deploy Frontend image and verify health
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
          FRONTEND_IMAGE: ${{ needs.publish_vm.outputs.frontend_image }}
        run: |
          remote_dir="/tmp/vota-frontend-cd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_command="'$remote_dir/deploy-frontend-vm.sh' --frontend-image '$FRONTEND_IMAGE:latest' --compose-file '$GCE_COMPOSE_FILE'"
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command "$remote_command"
