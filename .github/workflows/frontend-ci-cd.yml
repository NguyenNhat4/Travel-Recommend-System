name: Frontend CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/frontend-ci-cd.yml'
      - '.github/actions/sync-env-from-secret-manager/**'
      - 'ops/docker-compose.backend-vm.yml'
      - 'scripts/deploy-frontend-vm.sh'
      - 'src/frontend/Dockerfile.web'
      - 'src/frontend/**'
      - 'src/shared/contracts/**'
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/frontend-ci-cd.yml'
      - '.github/actions/sync-env-from-secret-manager/**'
      - 'ops/docker-compose.backend-vm.yml'
      - 'scripts/deploy-frontend-vm.sh'
      - 'src/frontend/Dockerfile.web'
      - 'src/frontend/**'
      - 'src/shared/contracts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event_name == 'pull_request' && github.ref || 'staging' }}
  # PR: push mới huỷ run cũ cùng nhánh. Push lên nhánh deploy vẫn xếp hàng, không huỷ.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Frontend quality checks
    if: ${{ github.event_name == 'push' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3')) }}
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install contract validator dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate OpenAPI contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 src/shared/contracts/tests/validate_contract.py

      - name: Regenerate OpenAPI types
        working-directory: src/frontend
        run: npm run generate:api-types

      - name: Check generated OpenAPI types are committed
        run: git diff --exit-code -- src/frontend/src/types/api.gen.ts

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck

      - name: Unit and contract tests
        working-directory: src/frontend
        run: npm run test

      - name: Build frontend and API bundle
        working-directory: src/frontend
        run: npm run build

  docker_test:
    name: Frontend Docker build test
    # Chỉ kiểm Dockerfile.web trên PR. Trên push, image được build một lần ở staging-ha-frontend-build.yml (CD); job này
    # không build lại. Chạy song song với quality, không đợi lint/test.
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx for Docker build test
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test phase in CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile.web
          push: false
          load: false
          cache-from: type=gha,scope=frontend-vm
          tags: vota-frontend-ci:${{ github.sha }}-test

  e2e:
    name: Frontend E2E smoke tests
    needs: quality
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: src/frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        # Runner tự host không có sudo không cần mật khẩu: --with-deps cần root để cài thư viện hệ thống.
        # Có sudo (GitHub-hosted) thì cài đủ phụ thuộc; không có thì chỉ cài binary, thư viện phải có sẵn trên runner.
        run: |
          if sudo -n true 2>/dev/null; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi

      - name: Run Playwright smoke tests
        working-directory: src/frontend
        env:
          CI: 'true'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npm run test:e2e
