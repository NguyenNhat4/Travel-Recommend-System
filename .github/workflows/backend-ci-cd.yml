name: Backend CI/CD

on:
  pull_request:
    paths:
      - '.github/workflows/backend-ci-cd.yml'
      - 'Dockerfile.backend'
      - 'Dockerfile.daily'
      - 'src/backend/**'
      - 'src/data_collection/**'
      - 'src/shared/contracts/**'
      - 'scripts/**'
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/backend-ci-cd.yml'
      - 'Dockerfile.backend'
      - 'Dockerfile.daily'
      - 'src/backend/**'
      - 'src/data_collection/**'
      - 'src/shared/contracts/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.event_name == 'pull_request' && github.ref || 'staging' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - name: Refuse staging dispatch from another ref
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev' }}
        run: |
          echo 'Staging workflow_dispatch must run from the dev branch.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r src/backend/requirements.txt

      - name: Validate contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 src/shared/contracts/tests/validate_contract.py

      - name: Compile Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m compileall -q src/backend src/data_collection

      - name: Run backend tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q src/backend/tests

      - name: Validate deployment scripts
        run: |
          bash -n \
            scripts/check-db-tunnel.sh \
            scripts/deploy-backend-vm.sh \
            scripts/install-vota-cron.sh

  build:
    name: Build images
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: vota-backend-ci:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.daily
          push: false
          tags: vota-daily-ci:${{ github.sha }}
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,mode=max,scope=crawler

  publish:
    name: Publish SHA and latest images
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
      CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      crawler_digest: ${{ steps.crawler.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate publishing configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
        run: |
          for name in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT BACKEND_IMAGE CRAWLER_IMAGE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging secret: $name" >&2
              exit 1
            fi
          done
          for name in BACKEND_IMAGE CRAWLER_IMAGE; do
            if [[ ! "${!name}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
              echo "$name must be an untagged Artifact Registry image path." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend-publish
          cache-to: type=gha,mode=max,scope=backend-publish

      - name: Publish crawler image
        id: crawler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.daily
          push: true
          tags: |
            ${{ env.CRAWLER_IMAGE }}:${{ github.sha }}
            ${{ env.CRAWLER_IMAGE }}:latest
          cache-from: type=gha,scope=crawler-publish
          cache-to: type=gha,mode=max,scope=crawler-publish

  deploy:
    name: Deploy application VM in place
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: publish
    runs-on: ubuntu-latest
    # Two 15-minute health windows (deploy and rollback) plus image pull and SSH.
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VM configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
          GCE_BACKEND_HEALTH_URL: ${{ vars.GCE_BACKEND_HEALTH_URL }}
          GCE_DB_TUNNEL_PORT: ${{ secrets.GCE_DB_TUNNEL_PORT || '15432' }}
          GCE_CRON_RUNNER: ${{ secrets.GCE_CRON_RUNNER || '/opt/vota/bin/run_daily_docker.sh' }}
          GCE_CRON_DATA_DIR: ${{ secrets.GCE_CRON_DATA_DIR || '/srv/vota/daily-data' }}
          GCE_CRON_ENV_FILE: ${{ secrets.GCE_CRON_ENV_FILE || '/etc/vota/daily.env' }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
        run: |
          for name in GCP_PROJECT_ID GCE_INSTANCE GCE_ZONE GCE_COMPOSE_FILE GCE_BACKEND_HEALTH_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging environment variable: $name" >&2
              exit 1
            fi
          done
          for name in GCE_COMPOSE_FILE GCE_CRON_RUNNER GCE_CRON_DATA_DIR GCE_CRON_ENV_FILE; do
            if [[ ! "${!name}" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
              echo "$name must be an absolute path without shell metacharacters." >&2
              exit 1
            fi
          done
          if [[ ! "$GCE_DB_TUNNEL_PORT" =~ ^[0-9]+$ ]]; then
            echo 'GCE_DB_TUNNEL_PORT must be numeric.' >&2
            exit 1
          fi
          if [[ ! "$GCE_BACKEND_HEALTH_URL" =~ ^https?://[a-zA-Z0-9.:-]+/[a-zA-Z0-9._/%-]*$ ]]; then
            echo 'GCE_BACKEND_HEALTH_URL must be a URL without shell metacharacters.' >&2
            exit 1
          fi
          for name in BACKEND_IMAGE CRAWLER_IMAGE; do
            if [[ ! "${!name}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
              echo "$name must be an untagged Artifact Registry image path." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Initialize non-interactive SSH access
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
        run: |
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" \
            --tunnel-through-iap --quiet --command true

      - name: Copy deploy scripts to application VM
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
        run: |
          remote_dir="/tmp/vota-cicd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -C scripts -czf - deploy-backend-vm.sh install-vota-cron.sh check-db-tunnel.sh \
            | gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet \
                --command "umask 077; mkdir -m 700 '$remote_dir' && tar -xzf - -C '$remote_dir'"

      - name: Deploy latest images and update existing cron
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
          GCE_BACKEND_HEALTH_URL: ${{ vars.GCE_BACKEND_HEALTH_URL }}
          GCE_DB_TUNNEL_PORT: ${{ secrets.GCE_DB_TUNNEL_PORT || '15432' }}
          GCE_CRON_RUNNER: ${{ secrets.GCE_CRON_RUNNER || '/opt/vota/bin/run_daily_docker.sh' }}
          GCE_CRON_DATA_DIR: ${{ secrets.GCE_CRON_DATA_DIR || '/srv/vota/daily-data' }}
          GCE_CRON_ENV_FILE: ${{ secrets.GCE_CRON_ENV_FILE || '/etc/vota/daily.env' }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
        run: |
          remote_dir="/tmp/vota-cicd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backend_ref="$BACKEND_IMAGE:latest"
          crawler_ref="$CRAWLER_IMAGE:latest"
          remote_command="chmod +x '$remote_dir'/*.sh && '$remote_dir/deploy-backend-vm.sh' --backend-image '$backend_ref' --crawler-image '$crawler_ref' --compose-file '$GCE_COMPOSE_FILE' --backend-health-url '$GCE_BACKEND_HEALTH_URL' --db-tunnel-port '$GCE_DB_TUNNEL_PORT' --cron-runner '$GCE_CRON_RUNNER' --cron-data-dir '$GCE_CRON_DATA_DIR' --cron-env-file '$GCE_CRON_ENV_FILE'"
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command "$remote_command"
