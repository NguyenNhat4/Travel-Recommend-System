name: Backend CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/backend-ci-cd.yml'
      - 'Dockerfile.backend'
      - 'src/backend/**'
      - 'scripts/**'
      - 'src/shared/contracts/**'
      - 'scripts/**'
      - 'ops/docker-compose.backend-vm.yml'
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/backend-ci-cd.yml'
      - 'Dockerfile.backend'
      - 'src/backend/**'
      - 'scripts/**'
      - 'src/shared/contracts/**'
      - 'ops/docker-compose.backend-vm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.event_name == 'pull_request' && github.ref || 'staging' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality:
    name: CI checks
    if: ${{ github.event_name == 'push' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r src/backend/requirements.txt

      - name: Validate contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 src/shared/contracts/tests/validate_contract.py

      - name: Compile Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m compileall -q src/backend src/data_collection

      - name: Run backend tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q src/backend/tests

      - name: Validate deployment scripts
        run: |
          bash -n \
            scripts/check-db-tunnel.sh \
            scripts/deploy-backend-vm.sh \
            scripts/install-vota-cron.sh \
            scripts/tests/test-backend-vm-cd-sync.sh
          bash scripts/tests/test-backend-vm-cd-sync.sh

  build:
    name: Build images
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: vota-backend-ci:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  publish:
    name: Publish SHA and latest images
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') }}
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate publishing configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
        run: |
          for name in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT BACKEND_IMAGE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging secret: $name" >&2
              exit 1
            fi
          done
          for name in BACKEND_IMAGE; do
            if [[ ! "${!name}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
              echo "$name must be an untagged Artifact Registry image path." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend-publish
          cache-to: type=gha,mode=max,scope=backend-publish


  deploy:
    name: Deploy application VM in place
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') }}
    needs: publish
    runs-on: ubuntu-latest
    # Two 15-minute health windows (deploy and rollback) plus image pull and SSH.
    timeout-minutes: 45
    concurrency:
      group: vota-application-vm-deploy
      cancel-in-progress: false
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VM configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
          GCE_BACKEND_HEALTH_URL: http://127.0.0.1:8000/health/ready
          GCE_DB_TUNNEL_PORT: ${{ secrets.GCE_DB_TUNNEL_PORT || '15432' }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
        run: |
          for name in GCP_PROJECT_ID GCE_INSTANCE GCE_ZONE GCE_COMPOSE_FILE GCE_BACKEND_HEALTH_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging environment variable: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$GCE_DB_TUNNEL_PORT" =~ ^[0-9]+$ ]]; then
            echo 'GCE_DB_TUNNEL_PORT must be numeric.' >&2
            exit 1
          fi
          if [[ ! "$GCE_BACKEND_HEALTH_URL" =~ ^https?://[a-zA-Z0-9.:-]+/health/ready$ ]]; then
            echo 'GCE_BACKEND_HEALTH_URL must target /health/ready.' >&2
            exit 1
          fi
          for name in BACKEND_IMAGE; do
            if [[ ! "${!name}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
              echo "$name must be an untagged Artifact Registry image path." >&2
              exit 1
            fi
          done
          if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Publish did not return a valid Backend digest.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate VM Docker to Artifact Registry
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
        run: |
          access_token="$(gcloud auth print-access-token)"
          printf '%s' "$access_token" \
            | gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" \
                --tunnel-through-iap --quiet \
                --command 'docker login --username oauth2accesstoken --password-stdin https://asia-southeast1-docker.pkg.dev'

      - name: Initialize non-interactive SSH access
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
        run: |
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" \
            --tunnel-through-iap --quiet --command true

      - name: Copy deploy scripts to application VM
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
        run: |
          remote_dir="/tmp/vota-cicd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -czf - \
            -C "$GITHUB_WORKSPACE/scripts" deploy-backend-vm.sh install-vota-cron.sh check-db-tunnel.sh \
            -C "$GITHUB_WORKSPACE/ops" docker-compose.backend-vm.yml \
            | gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet \
                --command "umask 077; mkdir -m 700 '$remote_dir' && tar -xzf - -C '$remote_dir' && sudo -n install -D -m 0644 '$remote_dir/docker-compose.backend-vm.yml' '$GCE_COMPOSE_FILE' && sudo -n docker compose -f '$GCE_COMPOSE_FILE' config >/dev/null"

      # Secret ứng dụng nằm trong Secret Manager (1 secret = nội dung file backend.env). CI đọc bằng service account
      # của CI rồi ghi vào /etc/vota/backend.env qua SSH stdin: không cần quyền Secret Manager hay gcloud trên VM,
      # giá trị không nằm trong tham số dòng lệnh hay log. Chưa đặt vars.GCE_BACKEND_ENV_SECRET thì bỏ qua và
      # giữ file đặt tay như trước.
      - name: Sync backend env from Secret Manager
        if: ${{ vars.GCE_BACKEND_ENV_SECRET != '' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          BACKEND_ENV_SECRET: ${{ vars.GCE_BACKEND_ENV_SECRET }}
        run: |
          if [[ ! "$BACKEND_ENV_SECRET" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo 'GCE_BACKEND_ENV_SECRET must be a Secret Manager secret id.' >&2
            exit 1
          fi
          umask 077
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          gcloud secrets versions access latest --secret "$BACKEND_ENV_SECRET" --project "$GCP_PROJECT_ID" > "$env_file"
          for key in DATABASE_URL CDP_DATABASE_URL JWT_PRIVATE_KEY_PATH JWT_PUBLIC_KEY_PATH AUTH_REDIS_URL; do
            if ! grep -Eq "^${key}=." "$env_file"; then
              echo "Secret $BACKEND_ENV_SECRET is missing a value for $key; not touching the VM." >&2
              exit 1
            fi
          done
          # Giữ bản cũ để khôi phục tay; tee ghi đè nội dung nhưng giữ owner/mode của file hiện có
          # (file mới tạo: root, 0640).
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet \
            --command "sudo -n sh -c 'umask 027; [ -f /etc/vota/backend.env ] && cp -p /etc/vota/backend.env /etc/vota/backend.env.prev; tee /etc/vota/backend.env >/dev/null'" \
            < "$env_file"

      - name: Deploy latest Backend image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_COMPOSE_FILE: ${{ vars.GCE_COMPOSE_FILE }}
          GCE_BACKEND_HEALTH_URL: http://127.0.0.1:8000/health/ready
          GCE_DB_TUNNEL_PORT: ${{ secrets.GCE_DB_TUNNEL_PORT || '15432' }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
        run: |
          remote_dir="/tmp/vota-cicd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backend_ref="$BACKEND_IMAGE@$BACKEND_DIGEST"
          remote_command="chmod +x '$remote_dir'/*.sh && '$remote_dir/deploy-backend-vm.sh' --backend-image '$backend_ref' --compose-file '$GCE_COMPOSE_FILE' --backend-health-url '$GCE_BACKEND_HEALTH_URL' --db-tunnel-port '$GCE_DB_TUNNEL_PORT'"
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command "$remote_command"
