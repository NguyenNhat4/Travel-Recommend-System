name: Staging-HA Infra CD

# Apply Terraform root staging-ha khi infra/terraform/environments/staging-ha/** đổi (trước đây hai CD ứng dụng cùng chạy).
# Không build, không migration, không ghi last-good: lấy backend_ref và frontend_ref đang chạy từ last-good để plan chỉ
# còn phần hạ tầng đổi. Cổng allowed_changes của scripts/deploy-staging-ha-app.sh vẫn áp dụng: thay đổi ngoài danh sách
# làm job dừng TRƯỚC apply (thêm địa chỉ vào danh sách kèm chú thích rồi chạy lại, không nới để cho qua).
# Dùng chung khoá concurrency `staging-ha-app` với hai CD ứng dụng. Không rollback tự động: ref ứng dụng không đổi nên
# apply lại last-good không hoàn tác được thay đổi hạ tầng; revert commit rồi để workflow này chạy lại.

on:
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/staging-ha-infra-cd.yml'
      - 'scripts/deploy-staging-ha-app.sh'
      - 'scripts/roll-staging-ha-app-slots.sh'
      - 'scripts/pin-staging-ha-mig-opportunistic.sh'
      - 'infra/terraform/environments/staging-ha/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: '1.15.8'
  STAGING_HA_URL: https://praxis.io.vn
  STAGING_HA_LAST_GOOD_OBJECT: deploy/staging-ha-last-good.json
  MIG_NAME: vota-ha-app
  MIG_REGION: asia-southeast1
  BACKEND_SERVICE: vota-ha-app

jobs:
  apply:
    name: Apply Terraform and verify staging-ha
    runs-on: [self-hosted, vota-staging-ha]
    concurrency:
      group: staging-ha-app
      cancel-in-progress: false
    timeout-minutes: 150
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write staging-ha tfvars from secret
        env:
          STAGING_HA_TFVARS: ${{ secrets.STAGING_HA_TFVARS }}
        run: |
          umask 077
          printf '%s\n' "$STAGING_HA_TFVARS" > "$RUNNER_TEMP/staging-ha.tfvars"

      - name: Read image references from last good
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          gcloud storage cp "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" last-good.json \
            || { echo 'Chưa có last-good. Chạy Staging-HA Backend CD và Frontend CD một lần trước (workflow_dispatch).' >&2; exit 1; }
          backend_ref="$(jq -er .backend_ref last-good.json)" \
            || { echo 'last-good thiếu backend_ref.' >&2; exit 1; }
          frontend_ref="$(jq -er .frontend_ref last-good.json)" \
            || { echo 'last-good thiếu frontend_ref.' >&2; exit 1; }
          echo "BACKEND_REF=$backend_ref" >> "$GITHUB_ENV"
          echo "FRONTEND_REF=$frontend_ref" >> "$GITHUB_ENV"

      - name: Keep the MIG from replacing VMs when the template changes
        # Lần đầu MIG còn PROACTIVE: đặt OPPORTUNISTIC trước khi Terraform đổi template, nếu không MIG tự thay hết VM và app sập.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: bash scripts/pin-staging-ha-mig-opportunistic.sh

      - name: Apply Terraform (template mang image đang chạy)
        # Chỉ phần hạ tầng đổi; image giữ nguyên last-good. Không thay VM đang chạy.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TFVARS_FILE: ${{ runner.temp }}/staging-ha.tfvars
        run: bash scripts/deploy-staging-ha-app.sh

      - name: Roll app VMs to the new image without downtime
        # Từng VM: chạy bản mới song song bản cũ, đợi ready, đổi proxy, rút bản cũ. Lỗi ở VM nào thì VM đó vẫn chạy bản cũ.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: bash scripts/roll-staging-ha-app-slots.sh

      - name: Authenticate to Google Cloud for verification
        # Job này có thể chạy hơn một giờ khi MIG chậm; xác thực lại trước khi verify để không dựa vào phiên của bước apply.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Wait for the MIG to be stable
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud compute instance-groups managed wait-until "$MIG_NAME" \
            --region "$MIG_REGION" --project "$GCP_PROJECT_ID" \
            --stable --timeout=1800

      - name: Check every app VM is running and healthy
        # Image trên từng VM đã được roll-staging-ha-app-slots.sh đối chiếu. Template không còn là tiêu chí: MIG là
        # OPPORTUNISTIC nên VM giữ template cũ cho tới khi bị thay. Ở đây kiểm VM RUNNING và LB báo HEALTHY.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          mig_json="$(gcloud compute instance-groups managed describe "$MIG_NAME" --region "$MIG_REGION" --project "$GCP_PROJECT_ID" --format=json)"
          target_size="$(jq -er .targetSize <<< "$mig_json")"
          instances="$(gcloud compute instance-groups managed list-instances "$MIG_NAME" --region "$MIG_REGION" --project "$GCP_PROJECT_ID" --format=json)"
          [ "$(jq 'length' <<< "$instances")" = "$target_size" ] || { echo "Số VM khác targetSize $target_size" >&2; exit 1; }
          bad="$(jq -r '.[] | select(.instanceStatus != "RUNNING" or .currentAction != "NONE") | .instance | split("/") | last' <<< "$instances")"
          [ -z "$bad" ] || { echo "VM chưa RUNNING hoặc MIG đang thao tác: $bad" >&2; exit 1; }
          # min_ready_sec = 0 nên MIG có thể báo stable trước khi VM mới nạp xong. Chờ LB báo đủ HEALTHY tối đa 10 phút.
          healthy=0
          for i in $(seq 1 60); do
            health="$(gcloud compute backend-services get-health "$BACKEND_SERVICE" --global --project "$GCP_PROJECT_ID" --format=json)"
            # get-health trả về mảng (một mục mỗi backend group), không phải object.
            healthy="$(jq '[(if type == "array" then .[] else . end) | .status.healthStatus[]? | select(.healthState == "HEALTHY")] | length' <<< "$health")"
            [ "$healthy" = "$target_size" ] && break
            sleep 10
          done
          [ "$healthy" = "$target_size" ] || { echo "LB chỉ có $healthy/$target_size instance HEALTHY sau 10 phút" >&2; exit 1; }

      - name: Check readiness through the public endpoint
        # Cần 6 lần 200 liên tiếp qua Cloudflare → load balancer.
        run: |
          ok=0
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$STAGING_HA_URL/health/ready" || true)"
            if [ "$code" = 200 ]; then
              ok=$((ok + 1))
            else
              ok=0
              echo "attempt $i: $code"
            fi
            [ "$ok" -ge 6 ] && break
            sleep 10
          done
          [ "$ok" -ge 6 ] || { echo 'Readiness chưa đạt 6 lần liên tiếp.' >&2; exit 1; }
