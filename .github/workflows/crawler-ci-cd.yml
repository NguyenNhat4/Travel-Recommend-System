name: Crawler CI

# CI crawler. Chạy trên mọi PR, và được staging-ha-crawler-cd.yml gọi lại (workflow_call) làm cổng. Không chạy riêng khi push.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/crawler-ci-cd.yml'
      - '.github/workflows/staging-ha-image-build.yml'
      - 'Dockerfile.fresh-catalog'
      - 'Dockerfile.fresh-catalog.dockerignore'
      - 'src/data_collection/**'
      # Image crawler copy toàn bộ src/backend (job index dùng chung embedder và cấu hình backend).
      - 'src/backend/**'
      - 'scripts/install-vota-cron.sh'
      - 'scripts/check-db-tunnel.sh'
      - 'scripts/ci/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR: push mới huỷ run cũ cùng PR. Khi staging-ha-crawler-cd.yml gọi: nhóm riêng theo run, không huỷ.
  group: ${{ github.event_name == 'pull_request' && format('crawler-ci-{0}', github.ref) || format('crawler-ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality:
    name: Crawler quality checks
    timeout-minutes: 15
    runs-on: [self-hosted, vota-staging-ha]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m compileall -q src/data_collection

      - name: Validate crawler scripts
        run: |
          bash -n scripts/check-db-tunnel.sh scripts/install-vota-cron.sh src/data_collection/run_daily_docker.sh
          bash scripts/tests/test-install-vota-cron.sh

  build:
    name: Build crawler image
    needs: quality
    # Chỉ trên PR: kiểm Dockerfile.fresh-catalog và làm nóng cache của builder cố định. Sau merge, staging-ha-crawler-cd.yml
    # build (gần như toàn bộ từ cache) hoặc tái dùng image theo content key.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Persistent BuildKit builder
        id: builder
        run: bash scripts/ci/buildx-builder.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fresh-catalog
          builder: ${{ steps.builder.outputs.name }}
          push: false
          tags: vota-fresh-catalog-ci:${{ github.sha }}
