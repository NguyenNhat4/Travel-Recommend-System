name: Crawler CI/CD

on:
  pull_request:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/crawler-ci-cd.yml'
      - 'Dockerfile.daily'
      - 'Dockerfile.daily.dockerignore'
      - 'Dockerfile.fresh-catalog'
      - 'Dockerfile.fresh-catalog.dockerignore'
      - 'scripts/deploy-crawler-vm.sh'
      - 'scripts/tests/**'
      - 'src/data_collection/**'
      - 'scripts/install-vota-cron.sh'
      - 'scripts/check-db-tunnel.sh'
      - 'src/data_collection/**'
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/crawler-ci-cd.yml'
      - 'Dockerfile.daily'
      - 'Dockerfile.daily.dockerignore'
      - 'Dockerfile.fresh-catalog'
      - 'Dockerfile.fresh-catalog.dockerignore'
      - 'scripts/deploy-crawler-vm.sh'
      - 'scripts/tests/**'
      - 'src/data_collection/**'
      - 'scripts/install-vota-cron.sh'
      - 'scripts/check-db-tunnel.sh'
      - 'src/data_collection/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-ci-cd-${{ github.event_name == 'pull_request' && github.ref || 'staging' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality:
    name: Crawler quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Refuse dispatch from another ref
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release-mvp-v1' && github.ref != 'refs/heads/release-mvp-v2' && github.ref != 'refs/heads/release-mvp-v3' }}
        run: |
          echo 'This workflow_dispatch must run from main or release-mvp-v1/release-mvp-v2/release-mvp-v3.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m compileall -q src/data_collection

      - name: Validate crawler scripts
        run: |
          bash -n scripts/check-db-tunnel.sh scripts/install-vota-cron.sh scripts/deploy-crawler-vm.sh src/data_collection/run_daily_docker.sh
          bash scripts/tests/test-install-vota-cron.sh
          bash scripts/tests/test-crawler-deploy.sh

  build:
    name: Build crawler image (${{ matrix.kind }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: [daily, fresh-catalog]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.kind }}
          push: false
          load: true
          tags: vota-${{ matrix.kind }}-ci:${{ github.sha }}
          cache-from: type=gha,scope=crawler-${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=crawler-${{ matrix.kind }}

      - name: Validate release fares inside the built image
        run: docker run --rm --network none --entrypoint python vota-${{ matrix.kind }}-ci:${{ github.sha }} -m src.data_collection.seed.release_flights --validate-only

  publish:
    name: Publish crawler SHA and latest image
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
    outputs:
      crawler_digest: ${{ steps.crawler.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate publishing configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
        run: |
          for name in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT CRAWLER_IMAGE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging secret: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$CRAWLER_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then echo "CRAWLER_IMAGE must be an untagged Artifact Registry image path." >&2; exit 1; fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish crawler image
        id: crawler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.daily
          push: true
          tags: |
            ${{ env.CRAWLER_IMAGE }}:${{ github.sha }}
            ${{ env.CRAWLER_IMAGE }}:latest
          cache-from: type=gha,scope=crawler-publish
          cache-to: type=gha,mode=max,scope=crawler-publish

      - name: Publish fresh crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fresh-catalog
          push: true
          tags: |
            ${{ env.CRAWLER_IMAGE }}-fresh:${{ github.sha }}
            ${{ env.CRAWLER_IMAGE }}-fresh:latest
          cache-from: type=gha,scope=crawler-fresh-publish
          cache-to: type=gha,mode=max,scope=crawler-fresh-publish

  deploy:
    name: Deploy crawler on application VM
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: publish
    runs-on: ubuntu-latest
    # Publish configuration and dispatch; the crawl continues asynchronously on the VM.
    timeout-minutes: 45
    concurrency:
      group: vota-application-vm-deploy
      cancel-in-progress: false
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VM configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_CRON_RUNNER: ${{ secrets.GCE_CRON_RUNNER || '/opt/vota/bin/run_daily_docker.sh' }}
          GCE_CRON_DATA_DIR: ${{ secrets.GCE_FRESH_DATA_DIR || '/srv/vota/fresh-catalog-data' }}
          GCE_CRON_ENV_FILE: ${{ secrets.GCE_FRESH_ENV_FILE || '/etc/vota/fresh-catalog.env' }}
          GCE_FRESH_LOG_DIR: ${{ secrets.GCE_FRESH_LOG_DIR || '/srv/vota/fresh-catalog-logs' }}
          CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
        run: |
          for name in GCP_PROJECT_ID GCE_INSTANCE GCE_ZONE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging environment variable: $name" >&2
              exit 1
            fi
          done
          for name in GCE_CRON_RUNNER GCE_CRON_DATA_DIR GCE_CRON_ENV_FILE GCE_FRESH_LOG_DIR; do
            if [[ ! "${!name}" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
              echo "$name must be an absolute path without shell metacharacters." >&2
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate VM Docker to Artifact Registry
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
        run: |
          access_token="$(gcloud auth print-access-token)"
          printf '%s' "$access_token" | gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command 'docker login --username oauth2accesstoken --password-stdin https://asia-southeast1-docker.pkg.dev'

      - name: Copy crawler runner to VM
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_CRON_RUNNER: ${{ secrets.GCE_CRON_RUNNER || '/opt/vota/bin/run_daily_docker.sh' }}
        run: |
          remote_dir="/tmp/vota-crawler-cd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -czf - -C "$GITHUB_WORKSPACE/scripts" install-vota-cron.sh check-db-tunnel.sh deploy-crawler-vm.sh -C "$GITHUB_WORKSPACE/src/data_collection" run_daily_docker.sh | gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command "umask 077; mkdir -m 700 '$remote_dir' && tar -xzf - -C '$remote_dir' && sudo -n install -D -m 0755 '$remote_dir/run_daily_docker.sh' '$GCE_CRON_RUNNER'"

      - name: Deploy fresh cron and request a full crawl
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          GCE_CRON_RUNNER: ${{ secrets.GCE_CRON_RUNNER || '/opt/vota/bin/run_daily_docker.sh' }}
          GCE_FRESH_DATA_DIR: ${{ secrets.GCE_FRESH_DATA_DIR || '/srv/vota/fresh-catalog-data' }}
          GCE_FRESH_ENV_FILE: ${{ secrets.GCE_FRESH_ENV_FILE || '/etc/vota/fresh-catalog.env' }}
          GCE_FRESH_LOG_DIR: ${{ secrets.GCE_FRESH_LOG_DIR || '/srv/vota/fresh-catalog-logs' }}
          CRAWLER_IMAGE: ${{ secrets.GAR_DAILY_IMAGE }}
        run: |
          remote_dir="/tmp/vota-crawler-cd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_command="env FRESH_IMAGE='$CRAWLER_IMAGE-fresh:${{ github.sha }}' FRESH_CRON_IMAGE='$CRAWLER_IMAGE-fresh:latest' RUNNER='$GCE_CRON_RUNNER' FRESH_DATA_DIR='$GCE_FRESH_DATA_DIR' CATALOG_ENV_FILE='$GCE_FRESH_ENV_FILE' CATALOG_LOG_DIR='$GCE_FRESH_LOG_DIR' bash '$remote_dir/deploy-crawler-vm.sh'"
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command "$remote_command"
