name: Staging-HA Backend CD

# CD backend lên MIG vota-ha-app (staging-ha). Frontend cùng MIG và cùng Terraform state, nên image frontend
# lấy từ last-good, không build lại ở đây. Backend và frontend dùng chung concurrency group `staging-ha-app`
# để không apply chồng nhau và không ghi chồng lên last-good. Output job chỉ truyền digest: đường dẫn image là
# secret, GitHub che giá trị secret trong output nên job sau nhận chuỗi rỗng.
# Không chạy migration DB ở đây (xem kiểm tra db/migrations ở job images).

on:
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/staging-ha-backend-cd.yml'
      - 'Dockerfile.backend'
      - 'src/backend/**'
      - 'src/shared/contracts/**'
      - 'db/migrations/**'
      - 'scripts/deploy-staging-ha-app.sh'
      - 'infra/terraform/environments/staging-ha/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ha-app
  cancel-in-progress: false

env:
  TF_VERSION: '1.15.8'
  STAGING_HA_URL: https://praxis.io.vn
  STAGING_HA_LAST_GOOD_OBJECT: deploy/staging-ha-last-good.json
  MIG_NAME: vota-ha-app
  MIG_REGION: asia-southeast1
  BACKEND_SERVICE: vota-ha-app

jobs:
  images:
    name: Build and publish backend image
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_digest: ${{ steps.refs.outputs.backend_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Refuse to deploy a schema change without a migration step
        # CD staging-ha chưa chạy migration DB. Code mới mà kèm thay đổi db/migrations thì không được tự triển khai.
        if: ${{ github.event_name == 'push' }}
        run: |
          changed="$(git diff --name-only HEAD~1 HEAD -- db/migrations || true)"
          if [ -n "$changed" ]; then
            echo 'Commit này có thay đổi db/migrations. CD staging-ha chưa chạy migration; dừng để tránh deploy code lệch schema:' >&2
            echo "$changed" >&2
            exit 1
          fi

      - name: Validate publishing configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_CI_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          STAGING_HA_TFVARS: ${{ secrets.STAGING_HA_TFVARS }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for name in GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT BACKEND_IMAGE STAGING_HA_TFVARS TF_STATE_BUCKET GCP_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging-ha configuration: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$BACKEND_IMAGE" =~ ^asia-southeast1-docker\.pkg\.dev/[a-z0-9][a-z0-9._/-]*/vota-backend$ ]]; then
            echo 'GAR_BACKEND_IMAGE phải kết thúc bằng /vota-backend trong Artifact Registry.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.GAR_BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=staging-ha-backend
          cache-to: type=gha,mode=max,scope=staging-ha-backend

      - name: Resolve immutable image reference
        id: refs
        env:
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "BACKEND_DIGEST không hợp lệ: $BACKEND_DIGEST" >&2
            exit 1
          fi
          echo "backend_digest=$BACKEND_DIGEST" >> "$GITHUB_OUTPUT"

  deploy_app:
    name: Apply backend image to staging-ha MIG
    needs: images
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Read frontend reference from last good
        # Frontend không đổi ở đây; lấy digest frontend đang chạy từ last-good do workflow frontend ghi.
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          gcloud storage cp "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" last-good.json \
            || { echo 'Chưa có last-good. Chạy Staging-HA Frontend CD một lần trước (workflow_dispatch).' >&2; exit 1; }
          frontend_ref="$(jq -er .frontend_ref last-good.json)" \
            || { echo 'last-good thiếu frontend_ref.' >&2; exit 1; }
          echo "FRONTEND_REF=$frontend_ref" >> "$GITHUB_ENV"

      - name: Write staging-ha tfvars from secret
        env:
          STAGING_HA_TFVARS: ${{ secrets.STAGING_HA_TFVARS }}
        run: |
          umask 077
          printf '%s\n' "$STAGING_HA_TFVARS" > "$RUNNER_TEMP/staging-ha.tfvars"

      - name: Build immutable backend reference
        env:
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
        run: echo "BACKEND_REF=$BACKEND_IMAGE@$BACKEND_DIGEST" >> "$GITHUB_ENV"

      - name: Apply backend image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TFVARS_FILE: ${{ runner.temp }}/staging-ha.tfvars
        run: bash scripts/deploy-staging-ha-app.sh

  verify:
    name: Verify staging-ha after backend deploy
    needs: [images, deploy_app]
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Wait for the MIG to be stable on the new template
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud compute instance-groups managed wait-until "$MIG_NAME" \
            --region "$MIG_REGION" --project "$GCP_PROJECT_ID" \
            --stable --timeout=1800

      - name: Check every app VM runs the new template and is healthy
        # wait-until --stable chỉ nói MIG đã ổn định, không nói từng VM đã đổi. Kiểm từng instance.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          mig_json="$(gcloud compute instance-groups managed describe "$MIG_NAME" --region "$MIG_REGION" --project "$GCP_PROJECT_ID" --format=json)"
          target_size="$(jq -er .targetSize <<< "$mig_json")"
          target_template="$(jq -er '.versions[0].instanceTemplate | split("/") | last' <<< "$mig_json")"
          instances="$(gcloud compute instance-groups managed list-instances "$MIG_NAME" --region "$MIG_REGION" --project "$GCP_PROJECT_ID" --format=json)"
          [ "$(jq 'length' <<< "$instances")" = "$target_size" ] || { echo "Số VM khác targetSize $target_size" >&2; exit 1; }
          bad="$(jq -r --arg t "$target_template" '.[]
            | select(.instanceStatus != "RUNNING" or .currentAction != "NONE" or ((.version.instanceTemplate // "" | split("/") | last) != $t))
            | .instance | split("/") | last' <<< "$instances")"
          [ -z "$bad" ] || { echo "VM chưa đúng template đích hoặc chưa RUNNING: $bad" >&2; exit 1; }
          # min_ready_sec = 0 nên MIG có thể báo stable trước khi VM mới nạp xong RecSys. Chờ LB báo đủ HEALTHY tối đa 10 phút.
          healthy=0
          for i in $(seq 1 60); do
            health="$(gcloud compute backend-services get-health "$BACKEND_SERVICE" --global --project "$GCP_PROJECT_ID" --format=json)"
            # get-health trả về mảng (một mục mỗi backend group), không phải object.
            healthy="$(jq '[(if type == "array" then .[] else . end) | .status.healthStatus[]? | select(.healthState == "HEALTHY")] | length' <<< "$health")"
            [ "$healthy" = "$target_size" ] && break
            sleep 10
          done
          [ "$healthy" = "$target_size" ] || { echo "LB chỉ có $healthy/$target_size instance HEALTHY sau 10 phút" >&2; exit 1; }

      - name: Check readiness through the public endpoint
        # Cần 6 lần 200 liên tiếp qua Cloudflare → load balancer.
        run: |
          ok=0
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$STAGING_HA_URL/health/ready" || true)"
            if [ "$code" = 200 ]; then
              ok=$((ok + 1))
            else
              ok=0
              echo "attempt $i: $code"
            fi
            [ "$ok" -ge 6 ] && break
            sleep 10
          done
          [ "$ok" -ge 6 ] || { echo 'Readiness chưa đạt 6 lần liên tiếp.' >&2; exit 1; }

      - name: Build immutable backend reference
        env:
          BACKEND_IMAGE: ${{ secrets.GAR_BACKEND_IMAGE }}
          BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
        run: echo "BACKEND_REF=$BACKEND_IMAGE@$BACKEND_DIGEST" >> "$GITHUB_ENV"

      - name: Record backend as last good
        # Chỉ ghi khi đã đạt kiểm tra. Giữ nguyên frontend_ref và crawler_ref đang có trong object.
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if gcloud storage objects describe "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" >/dev/null 2>&1; then
            gcloud storage cp "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" last-good.json
          else
            echo '{}' > last-good.json
          fi
          jq --arg ref "$BACKEND_REF" '.backend_ref = $ref' last-good.json > next-last-good.json
          gcloud storage cp next-last-good.json "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT"

  rollback:
    name: Roll back backend to last good
    needs: [deploy_app, verify]
    # Chỉ rollback khi apply lỗi hoặc MIG/readiness không đạt. Lỗi ở crawler không liên quan tới đây.
    if: ${{ always() && (needs.deploy_app.result == 'failure' || needs.verify.result == 'failure') }}
    runs-on: [self-hosted, vota-staging-ha]
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write staging-ha tfvars from secret
        env:
          STAGING_HA_TFVARS: ${{ secrets.STAGING_HA_TFVARS }}
        run: |
          umask 077
          printf '%s\n' "$STAGING_HA_TFVARS" > "$RUNNER_TEMP/staging-ha.tfvars"

      - name: Apply last good backend and frontend
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TFVARS_FILE: ${{ runner.temp }}/staging-ha.tfvars
        run: |
          gcloud storage cp "gs://$TF_STATE_BUCKET/$STAGING_HA_LAST_GOOD_OBJECT" last-good.json \
            || { echo 'Không có last-good để rollback.' >&2; exit 1; }
          BACKEND_REF="$(jq -er .backend_ref last-good.json)" || { echo 'last-good thiếu backend_ref.' >&2; exit 1; }
          FRONTEND_REF="$(jq -er .frontend_ref last-good.json)" || { echo 'last-good thiếu frontend_ref.' >&2; exit 1; }
          BACKEND_REF="$BACKEND_REF" FRONTEND_REF="$FRONTEND_REF" TF_STATE_BUCKET="$TF_STATE_BUCKET" \
            GCP_PROJECT_ID="$GCP_PROJECT_ID" TFVARS_FILE="$TFVARS_FILE" bash scripts/deploy-staging-ha-app.sh
