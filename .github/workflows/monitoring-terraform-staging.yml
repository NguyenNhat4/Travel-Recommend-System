name: Staging Monitoring Terraform

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/monitoring-terraform-staging.yml'
      - 'infra/monitoring/**'
      - 'ops/monitoring/**'
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/monitoring-terraform-staging.yml'
      - 'infra/monitoring/**'
      - 'ops/monitoring/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-terraform-staging
  cancel-in-progress: false

env:
  TF_ROOT: infra/monitoring
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  validate:
    name: Validate monitoring Terraform
    if: ${{ github.event_name == 'push' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3')) }}
    runs-on: [self-hosted, vota-staging-ha]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.6'

      - name: Check staging-only layout
        run: bash infra/monitoring/tests/test_staging_layout.sh

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_ROOT" fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform -chdir="$TF_ROOT" init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir="$TF_ROOT" validate -no-color

  apply_staging:
    name: Apply staging monitoring
    if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') }}
    needs: validate
    runs-on: [self-hosted, vota-staging-ha]
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'asia-southeast1' }}
      TF_VAR_environment: staging
      TF_VAR_name_prefix: vota-staging
      TF_VAR_app_vm_name: ${{ vars.GCE_APP_INSTANCE }}
      TF_VAR_db_vm_name: ${{ vars.GCE_DB_INSTANCE }}
      DB_REPLICA_INSTANCE: ${{ vars.GCE_DB_REPLICA_INSTANCE }}
      GCE_ZONE: ${{ secrets.GCE_ZONE || 'asia-southeast1-a' }}
      GCE_REPLICA_ZONE: ${{ vars.GCE_DB_REPLICA_ZONE || 'asia-southeast1-b' }}
      TF_VAR_db_replica_zone: ${{ vars.GCE_DB_REPLICA_ZONE || 'asia-southeast1-b' }}
      TF_VAR_uptime_host: ${{ vars.STAGING_UPTIME_HOST }}
      TF_VAR_uptime_path: ${{ vars.STAGING_UPTIME_PATH || '/health/ready' }}
      TF_VAR_notification_email: ${{ secrets.MONITORING_NOTIFICATION_EMAIL }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.6'

      - name: Validate required staging configuration
        run: |
          for name in TF_VAR_project_id TF_VAR_app_vm_name TF_VAR_db_vm_name TF_VAR_uptime_host TF_STATE_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging configuration: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable DB replica monitoring only if the VM exists
        run: |
          if [ -z "${DB_REPLICA_INSTANCE:-}" ]; then
            echo 'GCE_DB_REPLICA_INSTANCE is not set; skipping replica monitoring.'
          elif gcloud compute instances describe "$DB_REPLICA_INSTANCE" \
              --project "$TF_VAR_project_id" --zone "$GCE_REPLICA_ZONE" --format='value(name)' >/dev/null 2>&1; then
            echo "TF_VAR_db_replica_vm_name=$DB_REPLICA_INSTANCE" >> "$GITHUB_ENV"
            echo "Replica VM $DB_REPLICA_INSTANCE exists; replica monitoring enabled."
          else
            echo "::warning::Replica VM $DB_REPLICA_INSTANCE not found in $GCE_REPLICA_ZONE; replica monitoring skipped. Create it with the Staging Infra Terraform workflow."
          fi

      - name: Initialize staging remote state
        run: |
          terraform -chdir="$TF_ROOT" init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config='prefix=monitoring/staging'

      - name: Plan staging monitoring
        run: terraform -chdir="$TF_ROOT" plan -input=false -lock-timeout=5m -out=staging.tfplan -no-color

      - name: Apply staging monitoring
        run: terraform -chdir="$TF_ROOT" apply -input=false -auto-approve staging.tfplan

      - name: Verify managed resources are in state
        run: |
          terraform -chdir="$TF_ROOT" state list | grep -E 'google_monitoring_dashboard|google_monitoring_alert_policy|google_monitoring_uptime_check_config|google_logging_metric'
