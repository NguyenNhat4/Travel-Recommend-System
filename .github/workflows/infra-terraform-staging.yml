name: Staging Infra Terraform

# Infrastructure as code for the staging VMs.
# - Pull request: validate only (fmt, validate, layout test). Nothing touches GCP.
# - Push / merge to a release branch, or manual dispatch: plan, guard, then apply.
#   The guard refuses any plan that deletes or replaces a resource (a replaced VM
#   loses its data disk) unless a manual dispatch sets allow_destroy=true. It also
#   refuses any in-place update of the primary DB VM or the app VM unless a manual
#   dispatch sets allow_vm_update=true, or the Environment variable
#   INFRA_ALLOW_VM_UPDATE=true is set and the blocked run is re-run (dispatch only works
#   for workflows on the default branch). Unset the variable after use.
# After a successful apply, the replication job brings the primary and the replica to the
# replicating state through IAP SSH (ops/ci-db-replication.sh); it is idempotent.
# All branches share one state (prefix infra/staging), so keep infra/terraform in
# step across branches; a branch with older code plans a delete and is blocked.
on:
  pull_request:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/infra-terraform-staging.yml'
      - 'infra/terraform/**'
      - 'ops/tests/test_infra_layout.sh'
  push:
    branches:
      - main
      - release-mvp-v1
      - release-mvp-v2
      - release-mvp-v3
    paths:
      - '.github/workflows/infra-terraform-staging.yml'
      - 'infra/terraform/**'
      - 'ops/ci-db-replication.sh'
      - 'ops/bootstrap-db-primary-replication.sh'
      - 'ops/bootstrap-db-replica.sh'
      - 'ops/db-replica-lag-probe.sh'
      - 'infra/monitoring/install-db-replica-monitoring.sh'
      - 'infra/monitoring/ops-agent-db-replica.yaml'
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: 'Allow a plan that deletes or replaces resources (data loss risk)'
        type: boolean
        default: false
      allow_vm_update:
        description: 'Allow in-place updates of the primary DB VM and the app VM (a snapshot of the primary disk is taken first)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-terraform-staging
  cancel-in-progress: false

env:
  TF_ROOT: infra/terraform/environments/staging
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  validate:
    name: Validate infra Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Check replica scripts and layout
        run: bash ops/tests/test_infra_layout.sh

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_ROOT" fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform -chdir="$TF_ROOT" init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir="$TF_ROOT" validate -no-color

  plan_apply_staging:
    name: Plan and apply staging infra
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-mvp-v1' || github.ref == 'refs/heads/release-mvp-v2' || github.ref == 'refs/heads/release-mvp-v3') }}
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'asia-southeast1' }}
      TF_VAR_zone: ${{ secrets.GCE_ZONE }}
      TF_VAR_db_replica_zone: ${{ vars.GCE_DB_REPLICA_ZONE || 'asia-southeast1-b' }}
      TF_VAR_db_primary_vm_name: ${{ vars.GCE_DB_INSTANCE }}
      TF_VAR_app_vm_name: ${{ vars.GCE_APP_INSTANCE }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      ALLOW_DESTROY: ${{ inputs.allow_destroy || vars.INFRA_ALLOW_DESTROY || 'false' }}
      ALLOW_VM_UPDATE: ${{ inputs.allow_vm_update || vars.INFRA_ALLOW_VM_UPDATE || 'false' }}
      PRIMARY_VM_ADDRESS: google_compute_instance.db_primary
      APP_VM_ADDRESS: google_compute_instance.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Validate required staging configuration
        run: |
          for name in TF_VAR_project_id TF_VAR_zone TF_VAR_db_primary_vm_name TF_VAR_app_vm_name TF_STATE_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging configuration: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Initialize staging remote state
        run: |
          terraform -chdir="$TF_ROOT" init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config='prefix=infra/staging'

      - name: Plan staging infra
        run: terraform -chdir="$TF_ROOT" plan -input=false -lock-timeout=5m -out=staging.tfplan -no-color

      - name: Show plan in the run summary
        run: |
          {
            echo '### Terraform plan (staging infra)'
            echo '```'
            terraform -chdir="$TF_ROOT" show -no-color staging.tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Block destructive plans
        run: |
          terraform -chdir="$TF_ROOT" show -json staging.tfplan > plan.json
          destructive=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.address) \(.change.actions | join(","))"' plan.json)
          if [ -n "$destructive" ]; then
            echo "Plan deletes or replaces:" >&2
            echo "$destructive" >&2
            if [ "$ALLOW_DESTROY" != 'true' ]; then
              echo '::error::Destructive plan blocked. Review it, then set the Environment variable INFRA_ALLOW_DESTROY=true and re-run this run (or dispatch with allow_destroy=true) if intended.'
              exit 1
            fi
            echo '::warning::Destructive plan allowed by allow_destroy=true.'
          fi

      - name: Block in-place updates of the DB and app VMs
        run: |
          vm_updates=$(jq -r --arg p "$PRIMARY_VM_ADDRESS" --arg a "$APP_VM_ADDRESS" '.resource_changes[]? | select(.address == $p or .address == $a) | select(.change.actions | index("update")) | .address' plan.json)
          if [ -n "$vm_updates" ]; then
            echo "Plan updates in place:" >&2
            echo "$vm_updates" >&2
            if [ "$ALLOW_VM_UPDATE" != 'true' ]; then
              echo '::error::Update of a production-like VM blocked. Read the plan in the run summary, then set the Environment variable INFRA_ALLOW_VM_UPDATE=true and re-run this run (or dispatch with allow_vm_update=true) if intended.'
              exit 1
            fi
            echo '::warning::VM update allowed by allow_vm_update=true.'
            echo 'VM_UPDATE=true' >> "$GITHUB_ENV"
          fi

      - name: Set up gcloud
        if: ${{ env.VM_UPDATE == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Snapshot the primary disk before updating VMs
        if: ${{ env.VM_UPDATE == 'true' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
        run: |
          gcloud compute disks snapshot "$TF_VAR_db_primary_vm_name" \
            --project "$GCP_PROJECT_ID" --zone "$GCE_ZONE" \
            --snapshot-names "pre-apply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --labels "created-by=infra-terraform-staging"

      - name: Apply staging infra
        run: terraform -chdir="$TF_ROOT" apply -input=false -auto-approve staging.tfplan

  replication_staging:
    name: Connect DB primary and replica
    needs: plan_apply_staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCE_ZONE: ${{ secrets.GCE_ZONE }}
      GCE_REPLICA_ZONE: ${{ vars.GCE_DB_REPLICA_ZONE || 'asia-southeast1-b' }}
      PRIMARY_VM: ${{ vars.GCE_DB_INSTANCE }}
      REPLICA_VM: ${{ vars.GCE_DB_REPLICA_INSTANCE }}
      DB_IMAGE: ${{ vars.DB_IMAGE || 'pgvector/pgvector:0.8.6-pg18-bookworm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required staging configuration
        run: |
          for name in GCP_PROJECT_ID GCE_ZONE PRIMARY_VM REPLICA_VM; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging configuration: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Bring primary and replica to the replicating state
        run: bash ops/ci-db-replication.sh
